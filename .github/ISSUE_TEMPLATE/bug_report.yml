name: Bug report
description: Report a reproducible PulseForge defect
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a PulseForge bug. For security-sensitive issues, follow SECURITY.md instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: PulseForge version or commit
      placeholder: "0.9.7 / commit SHA"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x86_64
        - Linux x86_64
        - macOS arm64
        - macOS x86_64
        - Android arm64
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Start PulseForge...
        2. Load...
        3. Enable...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Chart/mod context
      description: If relevant, describe chart format, key count, NoteTypes/events, PFC1/materialized path, multipliers, Third Strum, etc. Do not upload private or unlicensed content.
  - type: dropdown
    id: path
    attributes:
      label: Gameplay/loading path
      options:
        - Not applicable
        - Materialized
        - PFC1 streaming
        - Both
        - Unknown
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: Paste only relevant output. Remove tokens, credentials, private paths and personal information.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and pull requests for this problem.
          required: true
        - label: I removed credentials, Discord tokens, signing material and private content from this report.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
