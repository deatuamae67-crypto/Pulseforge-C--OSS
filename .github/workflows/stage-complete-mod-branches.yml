name: PulseForge stage isolated Complete mod branches

on:
  pull_request:
    branches: [main]
    paths:
      - 'mods/**'
      - 'docs/complete/mods/*.json'
      - 'docs/complete/materialization_overrides.json'
      - 'docs/COMPLETE_CROSS_MOD_RECOVERY.md'
      - 'scripts/audit_complete_mod_payload.py'
      - 'scripts/audit_complete_mod_payload_core.py'
      - 'scripts/recover_complete_mod_dependencies.py'
      - 'scripts/download_gdrive_folder_parallel.py'
      - '.github/workflows/stage-complete-mod-branches.yml'
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'docs/complete/mods/*.json'
      - 'docs/complete/materialization_overrides.json'
      - 'docs/COMPLETE_CROSS_MOD_RECOVERY.md'
      - 'scripts/audit_complete_mod_payload.py'
      - 'scripts/audit_complete_mod_payload_core.py'
      - 'scripts/recover_complete_mod_dependencies.py'
      - 'scripts/download_gdrive_folder_parallel.py'
      - '.github/workflows/stage-complete-mod-branches.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulseforge-complete-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  GDOWN_VERSION: '6.2.0'
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false

      - name: Self-test Complete staging helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_complete_mod_payload.py --self-test
          python3 scripts/recover_complete_mod_dependencies.py --self-test
          python3 -m py_compile scripts/download_gdrive_folder_parallel.py
          python3 scripts/download_gdrive_folder_parallel.py --self-test

      - name: Build size-prioritized isolated mod matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, pathlib, sys
          descriptors=[]; names=set(); slugs=set()
          for path in sorted(glob.glob('docs/complete/mods/*.json')):
              with open(path,encoding='utf-8') as f: spec=json.load(f)
              name=spec.get('name'); slug=spec.get('slug')
              if name=='.autochart-staging': raise SystemExit('.autochart-staging must never be embedded')
              if not isinstance(name,str) or not name or '/' in name or '\\' in name: raise SystemExit(f'invalid mod name in {path}: {name!r}')
              if not isinstance(slug,str) or not slug: raise SystemExit(f'invalid slug in {path}: {slug!r}')
              try: min_files=int(spec.get('min_files',0)); min_bytes=int(spec.get('min_bytes',0))
              except (TypeError,ValueError): raise SystemExit(f'invalid minimums in {path}')
              if min_files < 0 or min_bytes < 0: raise SystemExit(f'negative minimums in {path}')
              if name.casefold() in names: raise SystemExit(f'duplicate Complete mod name: {name}')
              if slug in slugs: raise SystemExit(f'duplicate Complete mod slug: {slug}')
              names.add(name.casefold()); slugs.add(slug)
              descriptors.append({'slug':slug,'name':name,'min_files':min_files,'min_bytes':min_bytes})
          if len(descriptors)!=30: raise SystemExit(f'expected 30 built-in mod descriptors, found {len(descriptors)}')
          remaining=[x for x in descriptors if not (pathlib.Path('mods')/x['name']).exists()]
          remaining.sort(key=lambda x:(x['min_bytes'],x['min_files'],x['slug']))
          specs=remaining[:2]
          print(f'Complete mods remaining to stage: {len(remaining)}; current batch: {len(specs)}', file=sys.stderr)
          for item in specs: print(f" - {item['slug']}: >= {item['min_files']} files, >= {item['min_bytes']} bytes", file=sys.stderr)
          print('matrix='+json.dumps({'include':[{'slug':x['slug']} for x in specs]},separators=(',',':')))
          PY

      - name: Audit changed Complete mod payloads in this PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          python3 - <<'PY'
          import json,os,pathlib,subprocess,sys
          base=subprocess.check_output(['git','merge-base','HEAD',f'origin/{os.environ["BASE_REF"]}'],text=True).strip()
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          # Only mods/<collection>/... is a mod payload. Root-level files such
          # as mods/modsList.txt are global Complete catalog metadata.
          mods={p.parts[1] for x in changed if len((p:=pathlib.PurePosixPath(x)).parts)>=3 and p.parts[0]=='mods'}
          desc={json.loads(p.read_text(encoding='utf-8'))['name']:p for p in pathlib.Path('docs/complete/mods').glob('*.json')}
          audited=0
          for name in sorted(mods,key=str.casefold):
              root=pathlib.Path('mods')/name
              if not root.exists(): continue
              spec=desc.get(name)
              if spec is None: raise SystemExit(f'changed Complete mod has no descriptor: {name}')
              subprocess.check_call([sys.executable,'scripts/audit_complete_mod_payload.py','.','--mod-root',str(root),'--descriptor',str(spec),'--output',f'/tmp/pulseforge-audit-{spec.stem}.json'])
              audited+=1
          print(f'PR Complete payloads audited: {audited}')
          PY

      - name: Confirm PR mode is validation-only
        if: github.event_name == 'pull_request'
        shell: bash
        run: echo 'Complete staging helpers and changed payloads validated; branch writes are disabled for pull requests.'

  stage-one:
    if: github.event_name != 'pull_request'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      ITEM_SLUG: ${{ matrix.slug }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Install pinned content import tools
        shell: bash
        run: |
          set -euo pipefail
          command -v git-lfs >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y --no-install-recommends git-lfs; }
          git lfs install --local
          gdown_venv="$RUNNER_TEMP/pulseforge-gdown"
          rm -rf "$gdown_venv"
          python3 -m venv "$gdown_venv"
          "$gdown_venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --force-reinstall "gdown==$GDOWN_VERSION"
          "$gdown_venv/bin/python" - <<'PY'
          import os
          from importlib.metadata import version
          actual=version('gdown'); expected=os.environ['GDOWN_VERSION']
          print(f'gdown package version: {actual}')
          if actual != expected: raise SystemExit(f'expected gdown {expected}, got {actual}')
          PY

      - name: Validate descriptor and prepare isolated branch
        id: mod
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ITEM_SLUG" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo "invalid slug: $ITEM_SLUG" >&2; exit 1; }
          descriptor="docs/complete/mods/$ITEM_SLUG.json"; test -f "$descriptor"
          [[ "$(jq -r '.slug' "$descriptor")" == "$ITEM_SLUG" ]] || exit 1
          name="$(jq -r '.name' "$descriptor")"; drive_id="$(jq -r '.drive_id' "$descriptor")"; min_files="$(jq -r '.min_files' "$descriptor")"; min_bytes="$(jq -r '.min_bytes' "$descriptor")"
          [[ "$name" != '.autochart-staging' && -n "$name" && "$name" != 'null' && "$name" != */* && "$name" != *\\* ]]
          [[ "$drive_id" =~ ^[A-Za-z0-9_-]+$ && "$min_files" =~ ^[0-9]+$ && "$min_bytes" =~ ^[0-9]+$ ]]
          target="mods/$name"; branch="complete/content-$ITEM_SLUG"
          git config user.name 'PulseForge Content Stager'; git config user.email 'pulseforge-content-stager@localhost'
          old=''; if git fetch origin "$branch"; then old="$(git rev-parse "refs/remotes/origin/$branch")"; fi
          git checkout -B "$branch" "$GITHUB_SHA"; git reset --hard "$GITHUB_SHA"
          printf 'name=%s\ndrive_id=%s\nmin_files=%s\nmin_bytes=%s\ndescriptor=%s\ntarget=%s\nbranch=%s\nold=%s\n' "$name" "$drive_id" "$min_files" "$min_bytes" "$descriptor" "$target" "$branch" "$old" >> "$GITHUB_OUTPUT"

      - name: Restore partial Drive staging cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/mod-${{ matrix.slug }}
            ${{ runner.temp }}/gdown-state-${{ matrix.slug }}
          key: complete-drive-stage-v1-${{ matrix.slug }}-${{ steps.mod.outputs.drive_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            complete-drive-stage-v1-${{ matrix.slug }}-${{ steps.mod.outputs.drive_id }}-

      - name: Download authoritative Drive candidate in bounded parallel
        id: source_download
        continue-on-error: true
        shell: bash
        env:
          DRIVE_ID: ${{ steps.mod.outputs.drive_id }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/mod-$ITEM_SLUG"
          state="$RUNNER_TEMP/gdown-state-$ITEM_SLUG/completed.json"
          diagnostics="$RUNNER_TEMP/gdown-$ITEM_SLUG"
          rm -rf "$diagnostics"
          mkdir -p "$(dirname "$state")"
          python3 scripts/download_gdrive_folder_parallel.py \
            --python "$RUNNER_TEMP/pulseforge-gdown/bin/python" \
            --folder-url "https://drive.google.com/drive/folders/$DRIVE_ID" \
            --staging "$staging" \
            --state "$state" \
            --diagnostics "$diagnostics" \
            --workers 3 \
            --attempts 1 \
            --backoff-seconds 20

      - name: Save partial Drive staging cache
        if: steps.source_download.outcome == 'failure'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/mod-${{ matrix.slug }}
            ${{ runner.temp }}/gdown-state-${{ matrix.slug }}
          key: complete-drive-stage-v1-${{ matrix.slug }}-${{ steps.mod.outputs.drive_id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report upstream candidate unavailable
        if: steps.source_download.outcome == 'failure'
        shell: bash
        env:
          NAME: ${{ steps.mod.outputs.name }}
          DRIVE_ID: ${{ steps.mod.outputs.drive_id }}
        run: |
          echo "::warning title=Authoritative candidate unavailable::$ITEM_SLUG ($NAME) stopped after a bounded Drive pass; completed files were cached for the next fresh runner. Folder: $DRIVE_ID."

      - name: Validate and materialize source mod
        if: steps.source_download.outcome == 'success'
        shell: bash
        env:
          NAME: ${{ steps.mod.outputs.name }}
          MIN_FILES: ${{ steps.mod.outputs.min_files }}
          MIN_BYTES: ${{ steps.mod.outputs.min_bytes }}
          TARGET: ${{ steps.mod.outputs.target }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/mod-$ITEM_SLUG"
          files="$(find "$staging" -type f | wc -l | tr -d ' ')"; bytes="$(find "$staging" -type f -printf '%s\n' | awk '{s+=$1} END{printf "%.0f",s}')"
          (( files >= MIN_FILES )) || { echo "$NAME: $files files < $MIN_FILES" >&2; exit 1; }
          (( bytes >= MIN_BYTES )) || { echo "$NAME: $bytes bytes < $MIN_BYTES" >&2; exit 1; }
          violations=()
          while IFS= read -r -d '' path; do
            lower="${path,,}"; base="${lower##*/}"
            case "$lower" in *third_party/discord_social_sdk/*|*discord_partner_sdk.framework/*|*discord_partner_sdk.xcframework/*) violations+=("$path");; esac
            case "$base" in discord_partner_sdk.dll|libdiscord_partner_sdk.so|libdiscord_partner_sdk.dylib|discord_partner_sdk.aar|*.jks|*.keystore|*.p12|*.pfx) violations+=("$path");; esac
          done < <(find "$staging" -type f -print0)
          if (( ${#violations[@]} )); then printf 'Refusing private/non-redistributable inputs:\n' >&2; printf ' - %s\n' "${violations[@]}" >&2; exit 1; fi
          rm -rf "$TARGET"; mkdir -p "$(dirname "$TARGET")"; mv "$staging" "$TARGET"

      - name: Recover missing runtime dependencies from verified sibling mods
        if: success() && steps.source_download.outcome == 'success'
        shell: bash
        env:
          TARGET: ${{ steps.mod.outputs.target }}
        run: |
          set -euo pipefail
          python3 scripts/recover_complete_mod_dependencies.py . --target "$TARGET" --output "$RUNNER_TEMP/complete-mod-recovery-$ITEM_SLUG.json"

      - name: Audit functional dependency closure before Git LFS conversion
        id: payload_audit
        if: success() && steps.source_download.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          TARGET: ${{ steps.mod.outputs.target }}
          DESCRIPTOR: ${{ steps.mod.outputs.descriptor }}
        run: |
          set -euo pipefail
          python3 scripts/audit_complete_mod_payload.py . --mod-root "$TARGET" --descriptor "$DESCRIPTOR" --output "$RUNNER_TEMP/complete-mod-audit-$ITEM_SLUG.json"

      - name: Report candidate deferred after dependency audit failure
        if: steps.payload_audit.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Complete candidate deferred::$ITEM_SLUG did not satisfy the fail-closed runtime dependency audit. Diagnostics were preserved; this isolated candidate will not be published until its source dependencies are complete or explicitly documented as archival."

      - name: Upload dependency audit, recovery provenance and Drive diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-mod-audit-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/complete-mod-audit-${{ matrix.slug }}.json
            ${{ runner.temp }}/complete-mod-recovery-${{ matrix.slug }}.json
            ${{ runner.temp }}/gdown-${{ matrix.slug }}/
          if-no-files-found: ignore
          retention-days: 7

      - name: Defer unavailable authoritative candidate
        if: steps.source_download.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Complete candidate deferred::$ITEM_SLUG Drive pass was incomplete; partial progress was cached for a later fresh runner. No content branch will be published from an incomplete transfer."

      - name: Commit and publish this mod branch
        if: success() && steps.source_download.outcome == 'success' && steps.payload_audit.outcome == 'success'
        shell: bash
        env:
          TARGET: ${{ steps.mod.outputs.target }}
          BRANCH: ${{ steps.mod.outputs.branch }}
          OLD_SHA: ${{ steps.mod.outputs.old }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "::warning title=Stale staging snapshot::Skipping publication of $ITEM_SLUG because main advanced from $GITHUB_SHA to $current_main."
            exit 0
          fi
          while IFS= read -r -d '' file; do
            size="$(stat -c '%s' "$file")"
            if (( size >= 25*1024*1024 )); then
              attr="$(git check-attr filter -- "$file" | sed 's/^.*: //')"
              [[ "$attr" == lfs ]] || git lfs track "$file"
            fi
          done < <(find "$TARGET" -type f -print0)
          git add -- .gitattributes
          git add -f -- "$TARGET"
          if git diff --cached --quiet; then echo "$ITEM_SLUG already identical to main"; exit 0; fi
          while IFS= read -r path; do [[ "$path" == '.gitattributes' || "$path" == "$TARGET"/* ]] || { echo "unexpected staged path: $path" >&2; exit 1; }; done < <(git diff --cached --name-only)
          while IFS= read -r -d '' file; do
            size="$(stat -c '%s' "$file")"
            if (( size >= 95*1024*1024 )); then
              [[ "$(git check-attr filter -- "$file" | sed 's/^.*: //')" == lfs ]] || { echo "$file is $size bytes but is not LFS" >&2; exit 1; }
            fi
          done < <(find "$TARGET" -type f -print0)
          git commit -m "complete(content): embed $ITEM_SLUG"
          git lfs fsck --pointers HEAD
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "::warning title=Stale staging snapshot::Refusing to push $ITEM_SLUG because main advanced after staging."
            exit 0
          fi
          if [[ -n "$OLD_SHA" ]]; then
            git push --force-with-lease="refs/heads/$BRANCH:$OLD_SHA" origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
