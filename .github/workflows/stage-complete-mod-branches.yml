name: PulseForge stage isolated Complete mod branches

on:
  pull_request:
    branches: [main]
    paths:
      - 'mods/**'
      - 'docs/complete/mods/*.json'
      - 'docs/complete/materialization_overrides.json'
      - 'scripts/audit_complete_mod_payload.py'
      - 'scripts/audit_complete_mod_payload_core.py'
      - '.github/workflows/stage-complete-mod-branches.yml'
  push:
    branches: [main]
    paths:
      - 'docs/complete/mods/*.json'
      - 'docs/complete/materialization_overrides.json'
      - 'scripts/audit_complete_mod_payload.py'
      - 'scripts/audit_complete_mod_payload_core.py'
      - '.github/workflows/stage-complete-mod-branches.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GDOWN_VERSION: '6.0.0'
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false

      - name: Self-test Complete payload auditor
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_complete_mod_payload.py --self-test

      - name: Build isolated mod matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          root=pathlib.Path('docs/complete/mods')
          items=[]
          for path in sorted(root.glob('*.json')):
              d=json.loads(path.read_text(encoding='utf-8'))
              if d.get('name')=='.autochart-staging': continue
              items.append({'slug':d['slug'],'name':d['name'],'drive_id':d['drive_id'],'min_files':d['min_files'],'min_bytes':d['min_bytes']})
          deferred={'drive-2026-08-22-dek-v1','charts-feitos-no-flp'}
          items.sort(key=lambda x:(x['slug'] in deferred,x['slug']))
          print('matrix='+json.dumps({'include':items},separators=(',',':')))
          PY

      - name: Audit changed Complete mod payloads in this PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          mapfile -t changed < <(git diff --name-only "$base" "$head" -- 'mods/**')
          declare -A roots=()
          for path in "${changed[@]}"; do
            [[ "$path" == mods/*/* ]] || continue
            rest="${path#mods/}"
            root="${rest%%/*}"
            roots["$root"]=1
          done
          if (( ${#roots[@]} == 0 )); then
            echo 'No Complete mod payloads changed in this PR.'
            exit 0
          fi
          for root in "${!roots[@]}"; do
            descriptor=''
            for candidate in docs/complete/mods/*.json; do
              [[ "$(jq -r '.name' "$candidate")" == "$root" ]] || continue
              descriptor="$candidate"
              break
            done
            [[ -n "$descriptor" ]] || { echo "No descriptor for changed mod root: $root" >&2; exit 1; }
            python3 scripts/audit_complete_mod_payload.py . \
              --mod-root "mods/$root" \
              --descriptor "$descriptor" \
              --output "$RUNNER_TEMP/pr-audit-$(basename "$descriptor")"
          done

      - name: Confirm PR mode is validation-only
        if: github.event_name == 'pull_request'
        run: echo 'Pull requests never download from Drive or publish branches.'

  stage-one:
    if: github.event_name != 'pull_request'
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ITEM_SLUG: ${{ matrix.slug }}
      ITEM_NAME: ${{ matrix.name }}
      ITEM_DRIVE_ID: ${{ matrix.drive_id }}
      ITEM_MIN_FILES: ${{ matrix.min_files }}
      ITEM_MIN_BYTES: ${{ matrix.min_bytes }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Install content import tools
        shell: bash
        run: |
          set -euo pipefail
          command -v git-lfs >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y --no-install-recommends git-lfs; }
          git lfs install --local
          python3 -m pip install --disable-pip-version-check "gdown==$GDOWN_VERSION"

      - name: Validate descriptor and prepare isolated branch
        id: mod
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ITEM_SLUG" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo "invalid slug: $ITEM_SLUG" >&2; exit 1; }
          descriptor="docs/complete/mods/$ITEM_SLUG.json"; test -f "$descriptor"
          [[ "$(jq -r '.slug' "$descriptor")" == "$ITEM_SLUG" ]] || exit 1
          name="$(jq -r '.name' "$descriptor")"; drive_id="$(jq -r '.drive_id' "$descriptor")"; min_files="$(jq -r '.min_files' "$descriptor")"; min_bytes="$(jq -r '.min_bytes' "$descriptor")"
          [[ "$name" != '.autochart-staging' && -n "$name" && "$name" != 'null' && "$name" != */* && "$name" != *\\* ]]
          [[ "$drive_id" =~ ^[A-Za-z0-9_-]+$ && "$min_files" =~ ^[0-9]+$ && "$min_bytes" =~ ^[0-9]+$ ]]
          target="mods/$name"; branch="complete/content-$ITEM_SLUG"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          old=''; if git fetch origin "$branch"; then old="$(git rev-parse "refs/remotes/origin/$branch")"; fi
          git checkout -B "$branch" "$GITHUB_SHA"; git reset --hard "$GITHUB_SHA"
          printf 'name=%s\ndrive_id=%s\nmin_files=%s\nmin_bytes=%s\ndescriptor=%s\ntarget=%s\nbranch=%s\nold=%s\n' "$name" "$drive_id" "$min_files" "$min_bytes" "$descriptor" "$target" "$branch" "$old" >> "$GITHUB_OUTPUT"

      - name: Reuse already embedded candidate when available
        id: embedded_candidate
        shell: bash
        env:
          TARGET: ${{ steps.mod.outputs.target }}
          DESCRIPTOR: ${{ steps.mod.outputs.descriptor }}
        run: |
          set -euo pipefail
          echo 'hit=false' >> "$GITHUB_OUTPUT"
          cache_branch='complete/embedded-builtin-content'
          cache_ref="refs/remotes/origin/$cache_branch"
          staging="$RUNNER_TEMP/mod-$ITEM_SLUG"
          cache_worktree="$RUNNER_TEMP/embedded-cache-$ITEM_SLUG"

          if ! git fetch origin "$cache_branch:$cache_ref"; then
            echo "::warning title=Embedded cache unavailable::Could not fetch $cache_branch; falling back to Google Drive for $ITEM_SLUG."
            exit 0
          fi
          if ! git cat-file -e "$cache_ref:$TARGET" 2>/dev/null; then
            echo "No embedded Git/LFS candidate for $ITEM_SLUG; using Google Drive."
            exit 0
          fi

          rm -rf "$staging" "$cache_worktree"
          if ! GIT_LFS_SKIP_SMUDGE=1 git worktree add --detach "$cache_worktree" "$cache_ref"; then
            echo "::warning title=Embedded cache checkout failed::Could not create cache worktree for $ITEM_SLUG; falling back to Google Drive."
            git worktree prune || true
            exit 0
          fi

          cache_ok=true
          if ! git -C "$cache_worktree" lfs fetch origin "$cache_branch" --include="$TARGET/**" --exclude=''; then
            cache_ok=false
          elif ! git -C "$cache_worktree" lfs checkout "$TARGET"; then
            cache_ok=false
          elif ! python3 - "$cache_worktree/$TARGET" <<'PY'
          import pathlib, sys
          root=pathlib.Path(sys.argv[1])
          if not root.exists():
              raise SystemExit(1)
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  head=path.read_bytes()[:256]
              except OSError:
                  raise SystemExit(1)
              if head.startswith(b'version https://git-lfs.github.com/spec/v1\n') and b'\noid sha256:' in head:
                  print(f'unhydrated LFS pointer: {path}', file=sys.stderr)
                  raise SystemExit(1)
          PY
          then
            cache_ok=false
          fi

          if [[ "$cache_ok" == true ]] && ! python3 scripts/audit_complete_mod_payload.py . --mod-root "$cache_worktree/$TARGET" --descriptor "$DESCRIPTOR" --output "$RUNNER_TEMP/embedded-cache-audit-$ITEM_SLUG.json"; then
            cache_ok=false
            echo "::warning title=Embedded cache audit failed::Cached candidate for $ITEM_SLUG is hydrated but not functionally complete under the current auditor; falling back to Google Drive."
          fi

          if [[ "$cache_ok" == true ]]; then
            mkdir -p "$(dirname "$staging")"
            mv "$cache_worktree/$TARGET" "$staging"
            echo 'hit=true' >> "$GITHUB_OUTPUT"
            echo "Reused fully hydrated and audited Git/LFS candidate for $ITEM_SLUG."
          else
            echo "::warning title=Embedded cache rejected::Cached candidate for $ITEM_SLUG could not be safely reused; falling back to Google Drive."
          fi
          git worktree remove --force "$cache_worktree" || true
          git worktree prune || true

      - name: Download the entire source mod recursively
        id: source_download
        if: steps.embedded_candidate.outputs.hit != 'true'
        continue-on-error: true
        shell: bash
        env:
          NAME: ${{ steps.mod.outputs.name }}
          DRIVE_ID: ${{ steps.mod.outputs.drive_id }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/mod-$ITEM_SLUG"; rm -rf "$staging"; mkdir -p "$staging"
          for attempt in 1 2 3 4 5; do
            if gdown --continue --folder "https://drive.google.com/drive/folders/$DRIVE_ID" -O "$staging"; then exit 0; fi
            [[ "$attempt" != 5 ]] || { echo "$NAME: Drive failed after 5 resumable attempts" >&2; exit 1; }
            sleep $((attempt*30))
          done

      - name: Report upstream candidate unavailable
        if: steps.embedded_candidate.outputs.hit != 'true' && steps.source_download.outcome == 'failure'
        shell: bash
        env:
          NAME: ${{ steps.mod.outputs.name }}
          DRIVE_ID: ${{ steps.mod.outputs.drive_id }}
        run: |
          echo "::warning title=Authoritative candidate unavailable::$ITEM_SLUG ($NAME) could not be fully downloaded from Drive folder $DRIVE_ID after resumable retries. The source tree remains healthy; this candidate will be retried by a later staging run."

      - name: Validate and materialize source mod
        if: steps.embedded_candidate.outputs.hit == 'true' || steps.source_download.outcome == 'success'
        shell: bash
        env:
          NAME: ${{ steps.mod.outputs.name }}
          MIN_FILES: ${{ steps.mod.outputs.min_files }}
          MIN_BYTES: ${{ steps.mod.outputs.min_bytes }}
          TARGET: ${{ steps.mod.outputs.target }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/mod-$ITEM_SLUG"
          files="$(find "$staging" -type f | wc -l | tr -d ' ')"; bytes="$(find "$staging" -type f -printf '%s\n' | awk '{s+=$1} END{printf "%.0f",s}')"
          (( files >= MIN_FILES )) || { echo "$NAME: $files files < $MIN_FILES" >&2; exit 1; }; (( bytes >= MIN_BYTES )) || { echo "$NAME: $bytes bytes < $MIN_BYTES" >&2; exit 1; }
          violations=(); while IFS= read -r -d '' path; do lower="${path,,}"; base="${lower##*/}"; case "$lower" in *third_party/discord_social_sdk/*|*discord_partner_sdk.framework/*|*discord_partner_sdk.xcframework/*) violations+=("$path");; esac; case "$base" in discord_partner_sdk.dll|libdiscord_partner_sdk.so|libdiscord_partner_sdk.dylib|discord_partner_sdk.aar|*.jks|*.keystore|*.p12|*.pfx) violations+=("$path");; esac; done < <(find "$staging" -type f -print0)
          if (( ${#violations[@]} )); then printf 'Refusing private/non-redistributable inputs:\n' >&2; printf ' - %s\n' "${violations[@]}" >&2; exit 1; fi
          rm -rf "$TARGET"; mkdir -p "$(dirname "$TARGET")"; mv "$staging" "$TARGET"

      - name: Audit functional dependency closure before Git LFS conversion
        if: success() && (steps.embedded_candidate.outputs.hit == 'true' || steps.source_download.outcome == 'success')
        shell: bash
        env:
          TARGET: ${{ steps.mod.outputs.target }}
          DESCRIPTOR: ${{ steps.mod.outputs.descriptor }}
        run: |
          set -euo pipefail
          python3 scripts/audit_complete_mod_payload.py . --mod-root "$TARGET" --descriptor "$DESCRIPTOR" --output "$RUNNER_TEMP/complete-mod-audit-$ITEM_SLUG.json"

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-mod-audit-${{ matrix.slug }}
          path: ${{ runner.temp }}/complete-mod-audit-${{ matrix.slug }}.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and publish this mod branch
        if: success() && (steps.embedded_candidate.outputs.hit == 'true' || steps.source_download.outcome == 'success')
        shell: bash
        env:
          TARGET: ${{ steps.mod.outputs.target }}
          BRANCH: ${{ steps.mod.outputs.branch }}
          OLD_SHA: ${{ steps.mod.outputs.old }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do size="$(stat -c '%s' "$file")"; if (( size >= 25*1024*1024 )); then attr="$(git check-attr filter -- "$file" | sed 's/^.*: //')"; [[ "$attr" == lfs ]] || git lfs track "$file"; fi; done < <(find "$TARGET" -type f -print0)
          git add -- .gitattributes; git add -f -- "$TARGET"
          if git diff --cached --quiet; then echo "$ITEM_SLUG already identical to main"; exit 0; fi
          while IFS= read -r path; do [[ "$path" == '.gitattributes' || "$path" == "$TARGET"/* ]] || { echo "unexpected staged path: $path" >&2; exit 1; }; done < <(git diff --cached --name-only)
          while IFS= read -r -d '' file; do size="$(stat -c '%s' "$file")"; if (( size >= 95*1024*1024 )); then [[ "$(git check-attr filter -- "$file" | sed 's/^.*: //')" == lfs ]] || { echo "$file is $size bytes but is not LFS" >&2; exit 1; }; fi; done < <(find "$TARGET" -type f -print0)
          git commit -m "complete(content): embed $ITEM_SLUG"; git lfs fsck --pointers HEAD
          if [[ -n "$OLD_SHA" ]]; then git push --force-with-lease="refs/heads/$BRANCH:$OLD_SHA" origin "HEAD:refs/heads/$BRANCH"; else git push origin "HEAD:refs/heads/$BRANCH"; fi
