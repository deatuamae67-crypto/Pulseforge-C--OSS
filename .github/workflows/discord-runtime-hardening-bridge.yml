name: PulseForge Discord runtime hardening bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    if: ${{ github.actor == github.repository_owner }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OSS source branch
        uses: actions/checkout@v4
        with:
          ref: import/pulseforge-0.9.7-oss
          fetch-depth: 0

      - name: Make linked Discord runtime mandatory
        shell: python
        run: |
          from pathlib import Path

          path = Path('CMakeLists.txt')
          text = path.read_text(encoding='utf-8')
          old = '''    elseif(PULSEFORGE_DISCORD_SOCIAL_SDK_ACTIVE AND WIN32)
                  message(WARNING
                      "Discord Social SDK is linked, but no runtime DLL was supplied. "
                      "Set PULSEFORGE_DISCORD_SDK_RUNTIME_LIBRARY to discord_partner_sdk.dll."
                  )
              endif()
          '''
          new = '''    elseif(PULSEFORGE_DISCORD_SOCIAL_SDK_ACTIVE AND NOT ANDROID)
                  message(FATAL_ERROR
                      "Discord Social SDK is linked, but its runtime shared library is missing. "
                      "A linked PulseForge build would fail in the operating-system loader before "
                      "the fail-open Discord backend can run. Supply "
                      "PULSEFORGE_DISCORD_SDK_RUNTIME_LIBRARY or install the complete SDK archive."
                  )
              endif()
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Discord runtime warning block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'A linked PulseForge build would fail in the operating-system loader' CMakeLists.txt
          if grep -Fq 'Discord Social SDK is linked, but no runtime DLL was supplied' CMakeLists.txt; then
            echo 'Old warning block remains' >&2
            exit 1
          fi

      - name: Commit source hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'build: require Discord runtime when SDK is linked'
          git push origin HEAD:import/pulseforge-0.9.7-oss
