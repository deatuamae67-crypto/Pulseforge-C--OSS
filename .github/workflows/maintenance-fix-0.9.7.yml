name: PulseForge 0.9.7 maintenance patch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-fixes:
    if: ${{ github.actor == github.repository_owner }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out OSS import branch
        uses: actions/checkout@v4
        with:
          ref: import/pulseforge-0.9.7-oss
          fetch-depth: 0

      - name: Apply audited implementation fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # Fix 1: loading settings must enforce the same Discord redirect
          # validation that save_settings already enforces. Without this,
          # arbitrary remote OAuth callback URLs survive load_settings().
          settings_path = Path("src/io/settings_loader.cpp")
          settings = settings_path.read_text(encoding="utf-8")
          settings = replace_once(
              settings,
              """        sanitize(settings);\n        rebuild_legacy_lane_bindings(settings);\n        return {std::move(settings), {}};\n""",
              """        if (const auto discord_error =\n                discord_settings_validation_error(settings.discord);\n            discord_error.has_value()) {\n            return {std::nullopt, *discord_error};\n        }\n        sanitize(settings);\n        rebuild_legacy_lane_bindings(settings);\n        return {std::move(settings), {}};\n""",
              "settings Discord redirect validation",
          )
          settings_path.write_text(settings, encoding="utf-8")

          # Fix 2: hostile-but-representable uint64 durations must not be lost
          # by a premature double rounding. Preserve extended precision only
          # while parsing duration fields; PackedNote remains uint64_t.
          importer_path = Path("src/io/streaming_chart_importer.cpp")
          importer = importer_path.read_text(encoding="utf-8")

          importer = replace_once(
              importer,
              """[[nodiscard]] std::optional<double> token_double(const Token& token) {\n    if (token.kind != TokenKind::number) {\n        return std::nullopt;\n    }\n    double value{};\n    if (!parse_ascii_floating(token.text, value)) {\n        return std::nullopt;\n    }\n    return value;\n}\n""",
              """[[nodiscard]] std::optional<double> token_double(const Token& token) {\n    if (token.kind != TokenKind::number) {\n        return std::nullopt;\n    }\n    double value{};\n    if (!parse_ascii_floating(token.text, value)) {\n        return std::nullopt;\n    }\n    return value;\n}\n\n[[nodiscard]] std::optional<long double> token_long_double(const Token& token) {\n    if (token.kind != TokenKind::number) {\n        return std::nullopt;\n    }\n    long double value{};\n    if (!parse_ascii_floating(token.text, value)) {\n        return std::nullopt;\n    }\n    return value;\n}\n""",
              "extended-precision token parser",
          )

          importer = replace_once(
              importer,
              """[[nodiscard]] std::optional<std::uint64_t> duration_to_microseconds(\n    const double milliseconds\n) noexcept {\n    if (!std::isfinite(milliseconds) || milliseconds < 0.0) {\n        return std::nullopt;\n    }\n    const auto scaled = static_cast<long double>(milliseconds) * 1'000.0L;\n""",
              """[[nodiscard]] std::optional<std::uint64_t> duration_to_microseconds(\n    const long double milliseconds\n) noexcept {\n    if (!std::isfinite(milliseconds) || milliseconds < 0.0L) {\n        return std::nullopt;\n    }\n    const auto scaled = milliseconds * 1'000.0L;\n""",
              "extended-precision duration conversion",
          )

          importer = replace_once(
              importer,
              """    std::optional<double> duration;\n    std::optional<double> duration_ms;\n""",
              """    std::optional<long double> duration;\n    std::optional<long double> duration_ms;\n""",
              "native duration candidate precision",
          )
          importer = replace_once(
              importer,
              """    std::optional<double> duration;\n    std::string kind{\"normal\"};\n""",
              """    std::optional<long double> duration;\n    std::string kind{\"normal\"};\n""",
              "Psych duration candidate precision",
          )

          importer = replace_once(
              importer,
              """    [[nodiscard]] std::optional<double> read_number() {\n        if (peek().kind != TokenKind::number) {\n            skip_value(0U);\n            return std::nullopt;\n        }\n        return token_double(take());\n    }\n""",
              """    [[nodiscard]] std::optional<double> read_number() {\n        if (peek().kind != TokenKind::number) {\n            skip_value(0U);\n            return std::nullopt;\n        }\n        return token_double(take());\n    }\n\n    [[nodiscard]] std::optional<long double> read_duration_number() {\n        if (peek().kind != TokenKind::number) {\n            skip_value(0U);\n            return std::nullopt;\n        }\n        return token_long_double(take());\n    }\n""",
              "duration reader",
          )

          importer = replace_once(
              importer,
              "native.duration = read_number();",
              "native.duration = read_duration_number();",
              "native duration read",
          )
          importer = replace_once(
              importer,
              "native.duration_ms = read_number();",
              "native.duration_ms = read_duration_number();",
              "native durationMs read",
          )
          importer = replace_once(
              importer,
              "candidate.duration = read_number();",
              "candidate.duration = read_duration_number();",
              "Psych duration read",
          )
          importer = replace_once(
              importer,
              "const double raw_duration = candidate.duration.value_or(0.0);",
              "const long double raw_duration = candidate.duration.value_or(0.0L);",
              "Psych raw duration precision",
          )
          importer = replace_once(
              importer,
              "const double psych_duration = raw_duration < 0.0\n            ? 0.0\n            : raw_duration;",
              "const long double psych_duration = raw_duration < 0.0L\n            ? 0.0L\n            : raw_duration;",
              "Psych duration normalization precision",
          )

          importer_path.write_text(importer, encoding="utf-8")

      - name: Verify intended diff only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/io/settings_loader.cpp src/io/streaming_chart_importer.cpp
          changed="$(git diff --name-only)"
          test "$changed" = $'src/io/settings_loader.cpp\nsrc/io/streaming_chart_importer.cpp'

      - name: Commit fixes to import branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/io/settings_loader.cpp src/io/streaming_chart_importer.cpp
          git commit -m "fix: harden settings and extreme streaming durations"
          git push origin HEAD:import/pulseforge-0.9.7-oss
