name: PulseForge Complete embedded-content gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/complete-release.yml'
      - '.github/workflows/import-builtin-content.yml'
      - '.github/workflows/stage-complete-mod-branches.yml'
      - '.gitattributes'
      - 'docs/COMPLETE_CONTENT_1.0.0.json'
      - 'docs/COMPLETE_EDITION.md'
      - 'docs/COMPLETE_CROSS_MOD_RECOVERY.md'
      - 'docs/RELEASE_NOTES_1.0.0_COMPLETE.md'
      - 'scripts/recover_complete_mod_dependencies.py'
      - 'mods/**'
      - 'assets/menu/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTENT_SPEC: 'docs/COMPLETE_CONTENT_1.0.0.json'

jobs:
  validate-source-model:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source without materializing LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Validate Complete definition and embedded-content policy
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == 2
            and .edition == "1.0.0-complete"
            and .target_mod_count == 30
            and .mods_directory == "docs/complete/mods"
            and .source.mods_folder_id == "1pAnpn__0pfFe1pMtS-XyenPP5peqIU46"
            and .source.menu_music_staging_folder_id == "1LZxmV2e_94mDj8qx8b2mBL8cg-f-mVp_"
            and .source.excluded_transient_folders == [".autochart-staging"]
            and .menu_music.expected_tracks == 10
            and .menu_music.expected_total_bytes == 46117355
          ' "$CONTENT_SPEC" >/dev/null

          shopt -s nullglob
          specs=(docs/complete/mods/*.json)
          test "${#specs[@]}" -eq 30

          grep -Fq 'assets/menu/*.mp3 filter=lfs' .gitattributes
          grep -Fq 'mods/**/*.ogg filter=lfs' .gitattributes
          grep -Fq 'part of the engine' docs/COMPLETE_EDITION.md
          test -f docs/COMPLETE_CROSS_MOD_RECOVERY.md
          test -f scripts/recover_complete_mod_dependencies.py

          # The old content-pack model must not return. Match executable command
          # lines only so these assertions cannot match their own grep text.
          ! grep -Eq '^[[:space:]]*gh[[:space:]]+release[[:space:]]+upload.*complete-mod-' .github/workflows/complete-mod.yml
          ! grep -Eq '^[[:space:]]*(gdown|python3[[:space:]]+-m[[:space:]]+gdown)([[:space:]]|$)' .github/workflows/complete-release.yml

      - name: Self-test conservative cross-mod recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/recover_complete_mod_dependencies.py --self-test

      - name: Verify incrementally materialized embedded tree
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f mods/modsList.txt ]]; then
            echo 'Built-in content has not been materialized on this branch yet; definition-only validation passed.'
            exit 0
          fi

          test ! -e mods/.autochart-staging
          test "$(find assets/menu -maxdepth 1 -type f -iname '*.mp3' | wc -l | tr -d ' ')" -eq 10

          python3 - <<'PY'
          import json
          from pathlib import Path

          descriptors = {}
          for path in sorted(Path('docs/complete/mods').glob('*.json')):
              spec = json.loads(path.read_text(encoding='utf-8'))
              name = spec['name']
              if name in descriptors:
                  raise SystemExit(f'duplicate Complete descriptor name: {name}')
              descriptors[name] = spec

          target_count = json.loads(
              Path('docs/COMPLETE_CONTENT_1.0.0.json').read_text(encoding='utf-8')
          )['target_mod_count']
          if len(descriptors) != target_count:
              raise SystemExit(
                  f'Complete descriptor count mismatch: {len(descriptors)} != {target_count}'
              )

          materialized = sorted(
              path.name
              for path in Path('mods').iterdir()
              if path.is_dir() and path.name != '.autochart-staging'
          )
          if not materialized:
              raise SystemExit('modsList.txt exists but no built-in mod directories are materialized')

          listed = []
          states = {}
          for number, raw in enumerate(
              Path('mods/modsList.txt').read_text(encoding='utf-8-sig').splitlines(),
              start=1,
          ):
              line = raw.strip()
              if not line:
                  continue
              if '|' not in line:
                  raise SystemExit(f'modsList.txt:{number}: expected <folder>|<0|1>')
              folder, state = line.rsplit('|', 1)
              folder = folder.strip()
              state = state.strip()
              if not folder or state not in {'0', '1'}:
                  raise SystemExit(f'modsList.txt:{number}: invalid entry {raw!r}')
              if folder in states:
                  raise SystemExit(f'modsList.txt:{number}: duplicate folder {folder!r}')
              states[folder] = state == '1'
              listed.append(folder)

          listed_sorted = sorted(listed)
          if listed_sorted != materialized:
              missing = sorted(set(materialized) - set(listed))
              extra = sorted(set(listed) - set(materialized))
              raise SystemExit(
                  'modsList/materialized tree mismatch; '
                  f'missing_from_list={missing}, missing_from_tree={extra}'
              )

          for name in materialized:
              spec = descriptors.get(name)
              if spec is None:
                  raise SystemExit(f'materialized mod has no Complete descriptor: {name}')
              root = Path('mods') / name
              if not any(path.is_file() for path in root.rglob('*')):
                  raise SystemExit(f'empty built-in collection: {root}')
              expected = bool(spec['enabled_by_default'])
              if states[name] != expected:
                  raise SystemExit(
                      f'modsList default-state mismatch for {name}: '
                      f'{int(states[name])} != descriptor {int(expected)}'
                  )

          print(
              f'Validated incremental Complete tree: {len(materialized)}/{target_count} '
              'collections materialized and catalogued.'
          )
          PY

          command -v git-lfs >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends git-lfs
          }
          git lfs fsck --pointers HEAD

          oversized="$(git ls-tree -r -l HEAD | awk '$4 ~ /^[0-9]+$/ && $4 >= 99614720 {print $4, $5}')"
          [[ -z "$oversized" ]] || { printf 'ordinary Git blobs >=95 MiB remain:\n%s\n' "$oversized" >&2; exit 1; }

          echo 'Complete source tree contains a consistent incrementally materialized mod/menu content model.'