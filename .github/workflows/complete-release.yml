name: PulseForge 1.0.0 Complete release

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/complete-release.yml'
      - 'docs/COMPLETE_CONTENT_1.0.0.json'
      - 'docs/COMPLETE_EDITION.md'
      - 'docs/RELEASE_NOTES_1.0.0_COMPLETE.md'
      - 'scripts/install-complete-content.sh'
      - 'scripts/install-complete-content.ps1'
      - 'README.md'
      - 'docs/OSS_SCOPE.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/complete-release.yml'
      - 'docs/COMPLETE_CONTENT_1.0.0.json'
      - 'docs/COMPLETE_EDITION.md'
      - 'docs/RELEASE_NOTES_1.0.0_COMPLETE.md'
      - 'scripts/install-complete-content.sh'
      - 'scripts/install-complete-content.ps1'
      - 'README.md'
      - 'docs/OSS_SCOPE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulseforge-v1.0.0-complete-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPLETE_VERSION: '1.0.0-complete'
  COMPLETE_TAG: 'v1.0.0-complete'
  CONTENT_SPEC: 'docs/COMPLETE_CONTENT_1.0.0.json'
  GDOWN_VERSION: '6.0.0'

jobs:
  validate-content-spec:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.spec.outputs.matrix }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Complete content definition
        id: spec
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == 1
            and .edition == "1.0.0-complete"
            and .source.mods_folder_id == "1pAnpn__0pfFe1pMtS-XyenPP5peqIU46"
            and .source.menu_music_staging_folder_id == "1LZxmV2e_94mDj8qx8b2mBL8cg-f-mVp_"
            and .source.excluded_transient_folders == [".autochart-staging"]
            and .menu_music.expected_tracks == 10
            and .menu_music.expected_total_bytes == 46117355
            and (.menu_music.tracks | length) == 10
            and ([.menu_music.tracks[].name] | unique | length) == 10
            and ([.menu_music.tracks[].drive_id] | unique | length) == 10
            and ([.menu_music.tracks[].size_bytes] | add) == 46117355
            and (.mods | length) == 30
            and ([.mods[].name] | unique | length) == 30
            and ([.mods[].slug] | unique | length) == 30
            and ([.mods[].drive_id] | unique | length) == 30
            and all(.mods[];
              (.name | type) == "string" and (.name | length) > 0
              and (.slug | test("^[a-z0-9][a-z0-9-]*$"))
              and (.drive_id | type) == "string" and (.drive_id | length) > 10
              and (.min_files | type) == "number" and .min_files >= 1
              and (.min_bytes | type) == "number" and .min_bytes >= 1
              and .name != ".autochart-staging"
            )
          ' "$CONTENT_SPEC" >/dev/null
          matrix="$(jq -c '{include: [.mods[] | {name, slug, drive_id, min_files, min_bytes}]}' "$CONTENT_SPEC")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Validate installer shell syntax
        shell: bash
        run: bash -n scripts/install-complete-content.sh

  probe-shared-content:
    needs: validate-content-spec
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install complete Drive downloader
        shell: bash
        run: python3 -m pip install --disable-pip-version-check "gdown==$GDOWN_VERSION"
      - name: Verify shared modsList and menu music
        shell: bash
        run: |
          set -euo pipefail
          gdown "$(jq -r '.source.mods_list_file_id' "$CONTENT_SPEC")" -O "$RUNNER_TEMP/modsList.txt"
          test "$(stat -c '%s' "$RUNNER_TEMP/modsList.txt")" -eq 839
          grep -qx 'drive-library-2026-04-30|1' "$RUNNER_TEMP/modsList.txt"
          menu="$RUNNER_TEMP/menu"
          mkdir -p "$menu"
          gdown --folder "https://drive.google.com/drive/folders/$(jq -r '.source.menu_music_staging_folder_id' "$CONTENT_SPEC")" -O "$menu"
          python3 - "$CONTENT_SPEC" "$menu" <<'PY'
          import json, pathlib, sys
          spec=json.load(open(sys.argv[1], encoding='utf-8'))
          root=pathlib.Path(sys.argv[2])
          expected={x['name']: x['size_bytes'] for x in spec['menu_music']['tracks']}
          actual={p.name: p.stat().st_size for p in root.iterdir() if p.is_file()}
          if actual != expected:
              raise SystemExit(f'menu music mismatch: expected={expected!r} actual={actual!r}')
          PY
      - name: Verify recursive mod access without partial-download mode
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/probe-mod"
          mkdir -p "$probe"
          gdown --folder 'https://drive.google.com/drive/folders/1ELZMQUVXuAe-V43QeUheKgPY5CxAPPrW' -O "$probe"
          files="$(find "$probe" -type f | wc -l | tr -d ' ')"
          bytes="$(find "$probe" -type f -printf '%s\n' | awk '{s+=$1} END{printf "%.0f",s}')"
          test "$files" -ge 41
          test "$bytes" -ge 3492318

  prepare-draft:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate-content-spec
      - probe-shared-content
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install Drive downloader
        shell: bash
        run: python3 -m pip install --disable-pip-version-check "gdown==$GDOWN_VERSION"
      - name: Create a fresh guarded draft
        id: release
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="$COMPLETE_TAG"
          existing="$(gh api "repos/$repo/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | [.id, .draft] | @tsv" | head -n1 || true)"
          if [[ -n "$existing" ]]; then
            IFS=$'\t' read -r release_id is_draft <<<"$existing"
            if [[ "$is_draft" != 'true' ]]; then
              echo "$tag is already published; refusing to mutate an existing Complete release." >&2
              exit 1
            fi
            gh api --method DELETE "repos/$repo/releases/$release_id"
            gh api --method DELETE "repos/$repo/git/refs/tags/$tag" >/dev/null 2>&1 || true
          fi
          gh release create "$tag" --repo "$repo" --target "$GITHUB_SHA" --title 'PulseForge 1.0.0 Complete' --notes-file docs/RELEASE_NOTES_1.0.0_COMPLETE.md --draft
          release_id="$(gh api "repos/$repo/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\" and .draft == true) | .id" | head -n1)"
          test -n "$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Upload durable content definition and installers
        shell: bash
        run: |
          set -euo pipefail
          mods_list="$RUNNER_TEMP/PulseForge-v1.0.0-complete-modsList.txt"
          gdown "$(jq -r '.source.mods_list_file_id' "$CONTENT_SPEC")" -O "$mods_list"
          test "$(stat -c '%s' "$mods_list")" -eq 839
          gh release upload "$COMPLETE_TAG" "$CONTENT_SPEC" scripts/install-complete-content.sh scripts/install-complete-content.ps1 "$mods_list" --repo "$GITHUB_REPOSITORY"

  menu-content-pack:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate-content-spec
      - prepare-draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Drive downloader
        run: python3 -m pip install --disable-pip-version-check "gdown==$GDOWN_VERSION"
      - name: Build and upload menu-music overlay
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          menu="$stage/assets/menu"
          mkdir -p "$menu"
          gdown --folder "https://drive.google.com/drive/folders/$(jq -r '.source.menu_music_staging_folder_id' "$CONTENT_SPEC")" -O "$menu"
          python3 - "$CONTENT_SPEC" "$menu" "$RUNNER_TEMP/PulseForge-v1.0.0-complete-menu-music.manifest.json" <<'PY'
          import hashlib, json, pathlib, sys
          spec=json.load(open(sys.argv[1], encoding='utf-8'))
          root=pathlib.Path(sys.argv[2])
          expected={x['name']: x['size_bytes'] for x in spec['menu_music']['tracks']}
          actual={p.name: p.stat().st_size for p in root.iterdir() if p.is_file()}
          if actual != expected:
              raise SystemExit(f'menu music mismatch: expected={expected!r} actual={actual!r}')
          files=[]
          for p in sorted(root.iterdir(), key=lambda p: p.name.casefold()):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024*1024), b''): h.update(chunk)
              files.append({'path': f'assets/menu/{p.name}', 'size_bytes': p.stat().st_size, 'sha256': h.hexdigest()})
          json.dump({'schema_version':1,'edition':'1.0.0-complete','kind':'menu_music','files':files}, open(sys.argv[3],'w',encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
          archive="$RUNNER_TEMP/PulseForge-v1.0.0-complete-menu-music.zip"
          (cd "$stage" && zip -q -r -6 "$archive" assets/menu)
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$archive")" > "$(basename "$archive").SHA256SUMS.txt")
          gh release upload "$COMPLETE_TAG" "$archive" "$archive.SHA256SUMS.txt" "$RUNNER_TEMP/PulseForge-v1.0.0-complete-menu-music.manifest.json" --repo "$GITHUB_REPOSITORY"

  mod-content-packs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate-content-spec
      - prepare-draft
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.validate-content-spec.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Drive downloader
        run: python3 -m pip install --disable-pip-version-check "gdown==$GDOWN_VERSION"
      - name: Download, validate and package mod
        shell: bash
        env:
          MOD_NAME: ${{ matrix.name }}
          MOD_SLUG: ${{ matrix.slug }}
          MOD_DRIVE_ID: ${{ matrix.drive_id }}
          MIN_FILES: ${{ matrix.min_files }}
          MIN_BYTES: ${{ matrix.min_bytes }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          mod_root="$stage/mods/$MOD_NAME"
          for attempt in 1 2 3; do
            rm -rf "$mod_root"
            mkdir -p "$mod_root"
            if gdown --folder "https://drive.google.com/drive/folders/$MOD_DRIVE_ID" -O "$mod_root"; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep $((attempt * 15))
          done
          files="$(find "$mod_root" -type f | wc -l | tr -d ' ')"
          bytes="$(find "$mod_root" -type f -printf '%s\n' | awk '{s+=$1} END{printf "%.0f",s}')"
          (( files >= MIN_FILES )) || { echo "$MOD_NAME: only $files files; minimum is $MIN_FILES" >&2; exit 1; }
          (( bytes >= MIN_BYTES )) || { echo "$MOD_NAME: only $bytes bytes; minimum is $MIN_BYTES" >&2; exit 1; }
          base="PulseForge-v1.0.0-complete-mod-$MOD_SLUG"
          manifest="$RUNNER_TEMP/$base.manifest.json"
          python3 - "$mod_root" "$manifest" "$MOD_NAME" "$MOD_SLUG" "$MOD_DRIVE_ID" <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          files=[]
          total=0
          for p in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda p: p.as_posix().casefold()):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(4*1024*1024), b''): h.update(chunk)
              size=p.stat().st_size
              total += size
              files.append({'path': p.relative_to(root).as_posix(), 'size_bytes': size, 'sha256': h.hexdigest()})
          json.dump({'schema_version':1,'edition':'1.0.0-complete','kind':'mod','name':sys.argv[3],'slug':sys.argv[4],'source_drive_id':sys.argv[5],'file_count':len(files),'total_bytes':total,'files':files}, open(sys.argv[2],'w',encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
          archive="$RUNNER_TEMP/$base.zip"
          (cd "$stage" && zip -q -r -6 "$archive" "mods/$MOD_NAME")
          checksum="$archive.SHA256SUMS.txt"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$archive")" > "$(basename "$checksum")")
          max_bytes=$((1900 * 1024 * 1024))
          upload=("$manifest" "$checksum")
          archive_bytes="$(stat -c '%s' "$archive")"
          if (( archive_bytes < max_bytes )); then
            upload+=("$archive")
          else
            split -b 1900M -d -a 2 "$archive" "$archive.part"
            parts_checksum="$RUNNER_TEMP/$base.zip.parts.SHA256SUMS.txt"
            (cd "$RUNNER_TEMP" && sha256sum "$base.zip.part"* > "$(basename "$parts_checksum")")
            upload+=("$parts_checksum")
            while IFS= read -r part; do upload+=("$part"); done < <(find "$RUNNER_TEMP" -maxdepth 1 -type f -name "$base.zip.part*" -print | sort)
          fi
          gh release upload "$COMPLETE_TAG" "${upload[@]}" --repo "$GITHUB_REPOSITORY"

  windows-x64:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: prepare-draft
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Add Complete menu music and modsList
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "gdown==$env:GDOWN_VERSION"
          $menuTemp = Join-Path $env:RUNNER_TEMP 'menu'
          New-Item -ItemType Directory -Path $menuTemp -Force | Out-Null
          python -m gdown --folder 'https://drive.google.com/drive/folders/1LZxmV2e_94mDj8qx8b2mBL8cg-f-mVp_' -O $menuTemp
          $files = @(Get-ChildItem -LiteralPath $menuTemp -File -Filter '*.mp3')
          if ($files.Count -ne 10) { throw "Expected 10 menu tracks, got $($files.Count)" }
          if (($files | Measure-Object -Property Length -Sum).Sum -ne 46117355) { throw 'Menu music byte total mismatch' }
          New-Item -ItemType Directory -Path assets/menu -Force | Out-Null
          Copy-Item -LiteralPath $files.FullName -Destination assets/menu -Force
          python -m gdown '1NDOUVSl9fjdyyKRa-bL30TxJ514O3Lao' -O "$env:RUNNER_TEMP/modsList.txt"
      - name: Configure and build Release
        shell: pwsh
        run: |
          cmake --preset windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and upload Windows Complete build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'PulseForge-v1.0.0-complete-Windows-x86_64'
          $stage = Join-Path $env:RUNNER_TEMP $package
          cmake --install out/build/msvc --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'bin/pulseforge.exe') -PathType Leaf)) { throw 'Missing pulseforge.exe' }
          $music = @(Get-ChildItem -LiteralPath (Join-Path $stage 'bin/assets/menu') -File -Filter '*.mp3')
          if ($music.Count -ne 10) { throw 'Complete menu music was not installed' }
          New-Item -ItemType Directory -Path (Join-Path $stage 'bin/mods') -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP/modsList.txt" (Join-Path $stage 'bin/mods/modsList.txt') -Force
          Copy-Item scripts/install-complete-content.ps1, scripts/install-complete-content.sh, docs/COMPLETE_EDITION.md -Destination $stage -Force
          $archive = "$stage.zip"
          Compress-Archive -Path $stage -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$archive.SHA256SUMS.txt"
          "$hash  $package.zip" | Set-Content -LiteralPath $checksum -Encoding ascii
          gh release upload $env:COMPLETE_TAG $archive $checksum --repo $env:GITHUB_REPOSITORY

  linux-x86_64:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: prepare-draft
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies and Complete content inputs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config file libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev
          python3 -m pip install --disable-pip-version-check "gdown==$GDOWN_VERSION"
          mkdir -p assets/menu
          gdown --folder 'https://drive.google.com/drive/folders/1LZxmV2e_94mDj8qx8b2mBL8cg-f-mVp_' -O assets/menu
          test "$(find assets/menu -maxdepth 1 -type f -iname '*.mp3' | wc -l | tr -d ' ')" -eq 10
          test "$(find assets/menu -maxdepth 1 -type f -iname '*.mp3' -printf '%s\n' | awk '{s+=$1} END{printf "%.0f",s}')" -eq 46117355
          gdown '1NDOUVSl9fjdyyKRa-bL30TxJ514O3Lao' -O "$RUNNER_TEMP/modsList.txt"
      - name: Build, package and upload Linux Complete build
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset linux-release
          cmake --build --preset linux-release --parallel 2
          package='PulseForge-v1.0.0-complete-Linux-x86_64'
          stage="$RUNNER_TEMP/$package"
          cmake --install out/build/linux-release --prefix "$stage"
          test -x "$stage/bin/pulseforge"
          ldd "$stage/bin/pulseforge" | tee "$RUNNER_TEMP/$package.ldd.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/$package.ldd.txt"
          test "$(find "$stage/bin/assets/menu" -maxdepth 1 -type f -iname '*.mp3' | wc -l | tr -d ' ')" -eq 10
          mkdir -p "$stage/bin/mods"
          cp "$RUNNER_TEMP/modsList.txt" "$stage/bin/mods/modsList.txt"
          cp scripts/install-complete-content.sh scripts/install-complete-content.ps1 docs/COMPLETE_EDITION.md "$stage/"
          chmod +x "$stage/install-complete-content.sh"
          archive="$RUNNER_TEMP/$package.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$package"
          (cd "$RUNNER_TEMP" && sha256sum "$package.tar.gz" > "$package.tar.gz.SHA256SUMS.txt")
          gh release upload "$COMPLETE_TAG" "$archive" "$archive.SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY"

  macos:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: prepare-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare tools and Complete inputs
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          python3 -m pip install --disable-pip-version-check "gdown==$GDOWN_VERSION"
          mkdir -p assets/menu
          python3 -m gdown --folder 'https://drive.google.com/drive/folders/1LZxmV2e_94mDj8qx8b2mBL8cg-f-mVp_' -O assets/menu
          test "$(find assets/menu -maxdepth 1 -type f -iname '*.mp3' | wc -l | tr -d ' ')" -eq 10
          bytes="$(find assets/menu -maxdepth 1 -type f -iname '*.mp3' -exec stat -f '%z' {} \; | awk '{s+=$1} END{printf "%.0f",s}')"
          test "$bytes" -eq 46117355
          python3 -m gdown '1NDOUVSl9fjdyyKRa-bL30TxJ514O3Lao' -O "$RUNNER_TEMP/modsList.txt"
      - name: Build, package and upload macOS Complete build
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset macos-release -DCMAKE_OSX_ARCHITECTURES='${{ matrix.arch }}'
          cmake --build --preset macos-release --parallel 2
          package="PulseForge-v1.0.0-complete-macOS-${{ matrix.arch }}"
          stage="$RUNNER_TEMP/$package"
          cmake --install out/build/macos-release --prefix "$stage"
          app="$stage/PulseForge.app"
          binary="$app/Contents/MacOS/pulseforge"
          test -x "$binary"
          codesign --deep --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(find "$stage" -path '*/assets/menu/*.mp3' -type f | wc -l | tr -d ' ')" -eq 10
          mkdir -p "$stage/bin/mods"
          cp "$RUNNER_TEMP/modsList.txt" "$stage/bin/mods/modsList.txt"
          cp scripts/install-complete-content.sh scripts/install-complete-content.ps1 docs/COMPLETE_EDITION.md "$stage/"
          chmod +x "$stage/install-complete-content.sh"
          lipo -archs "$binary" | grep -qx '${{ matrix.arch }}'
          archive="$RUNNER_TEMP/$package.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$package"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$package.tar.gz" > "$package.tar.gz.SHA256SUMS.txt")
          gh release upload "$COMPLETE_TAG" "$archive" "$archive.SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY"

  android-arm64:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: prepare-draft
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install Android toolchain and Complete menu music
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.31.6'
          python3 -m pip install --disable-pip-version-check "gdown==$GDOWN_VERSION"
          mkdir -p assets/menu
          gdown --folder 'https://drive.google.com/drive/folders/1LZxmV2e_94mDj8qx8b2mBL8cg-f-mVp_' -O assets/menu
          test "$(find assets/menu -maxdepth 1 -type f -iname '*.mp3' | wc -l | tr -d ' ')" -eq 10
          test "$(find assets/menu -maxdepth 1 -type f -iname '*.mp3' -printf '%s\n' | awk '{s+=$1} END{printf "%.0f",s}')" -eq 46117355
          sed -i "s/versionCode = 100000/versionCode = 100001/" platform/android/app/build.gradle
          sed -i "s/versionName = '1.0.0'/versionName = '1.0.0-complete'/" platform/android/app/build.gradle
      - name: Build Android Release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x platform/android/gradlew
          cd platform/android
          ./gradlew --no-daemon --stacktrace -PPULSEFORGE_ANDROID_BUILD_ROOT="$RUNNER_TEMP/pulseforge-android" :app:assembleRelease
      - name: Align, sign, verify and upload Android Complete APK
        shell: bash
        run: |
          set -euo pipefail
          package='PulseForge-v1.0.0-complete-Android-arm64-test-signed'
          unsigned="$RUNNER_TEMP/pulseforge-android/gradle/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/$package-aligned.apk"
          signed="$RUNNER_TEMP/$package.apk"
          keystore="$RUNNER_TEMP/pulseforge-ci-test.jks"
          keytool -genkeypair -noprompt -keystore "$keystore" -storepass android -keypass android -alias pulseforge-ci -keyalg RSA -keysize 4096 -validity 10000 -dname 'CN=PulseForge CI Test Build,OU=CI,O=PulseForge,C=PT'
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -P 16 -f 4 "$unsigned" "$aligned"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign --ks "$keystore" --ks-key-alias pulseforge-ci --ks-pass pass:android --key-pass pass:android --out "$signed" "$aligned"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$signed"
          unzip -l "$signed" > "$RUNNER_TEMP/apk.contents.txt"
          test "$(grep -c 'pulseforge/assets/menu/.*\.mp3' "$RUNNER_TEMP/apk.contents.txt")" -eq 10
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$signed" > "$RUNNER_TEMP/apk.badging.txt"
          grep -q "package: name='org.pulseforge.engine'.*versionCode='100001'.*versionName='1.0.0-complete'" "$RUNNER_TEMP/apk.badging.txt"
          (cd "$RUNNER_TEMP" && sha256sum "$package.apk" > "$package.apk.SHA256SUMS.txt")
          gh release upload "$COMPLETE_TAG" "$signed" "$RUNNER_TEMP/$package.apk.SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish verified v1.0.0-complete
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate-content-spec
      - prepare-draft
      - menu-content-pack
      - mod-content-packs
      - windows-x64
      - linux-x86_64
      - macos
      - android-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Verify complete draft and publish
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          release_id='${{ needs.prepare-draft.outputs.release_id }}'
          gh api "repos/$repo/releases/$release_id" > "$RUNNER_TEMP/release.json"
          jq -e --arg tag "$COMPLETE_TAG" --arg sha "$GITHUB_SHA" '.draft == true and .prerelease == false and .tag_name == $tag and .target_commitish == $sha' "$RUNNER_TEMP/release.json" >/dev/null
          gh api --paginate --slurp "repos/$repo/releases/$release_id/assets?per_page=100" > "$RUNNER_TEMP/assets-pages.json"
          jq 'add' "$RUNNER_TEMP/assets-pages.json" > "$RUNNER_TEMP/assets.json"
          jq -e 'length > 0 and all(.[]; .state == "uploaded" and .size > 0 and (.size < 2147483648) and (.digest | test("^sha256:[0-9a-f]{64}$")))' "$RUNNER_TEMP/assets.json" >/dev/null
          jq -r '.[].name' "$RUNNER_TEMP/assets.json" | sort > "$RUNNER_TEMP/names.txt"
          for name in PulseForge-v1.0.0-complete-Windows-x86_64.zip PulseForge-v1.0.0-complete-Windows-x86_64.zip.SHA256SUMS.txt PulseForge-v1.0.0-complete-Linux-x86_64.tar.gz PulseForge-v1.0.0-complete-Linux-x86_64.tar.gz.SHA256SUMS.txt PulseForge-v1.0.0-complete-macOS-arm64.tar.gz PulseForge-v1.0.0-complete-macOS-arm64.tar.gz.SHA256SUMS.txt PulseForge-v1.0.0-complete-macOS-x86_64.tar.gz PulseForge-v1.0.0-complete-macOS-x86_64.tar.gz.SHA256SUMS.txt PulseForge-v1.0.0-complete-Android-arm64-test-signed.apk PulseForge-v1.0.0-complete-Android-arm64-test-signed.apk.SHA256SUMS.txt PulseForge-v1.0.0-complete-menu-music.zip PulseForge-v1.0.0-complete-menu-music.zip.SHA256SUMS.txt PulseForge-v1.0.0-complete-menu-music.manifest.json PulseForge-v1.0.0-complete-modsList.txt COMPLETE_CONTENT_1.0.0.json install-complete-content.sh install-complete-content.ps1; do
            grep -Fxq "$name" "$RUNNER_TEMP/names.txt" || { echo "Missing required Complete asset: $name" >&2; exit 1; }
          done
          while IFS= read -r slug; do
            base="PulseForge-v1.0.0-complete-mod-$slug"
            grep -Fxq "$base.manifest.json" "$RUNNER_TEMP/names.txt" || { echo "Missing $base manifest" >&2; exit 1; }
            grep -Fxq "$base.zip.SHA256SUMS.txt" "$RUNNER_TEMP/names.txt" || { echo "Missing $base checksum" >&2; exit 1; }
            if ! grep -Fxq "$base.zip" "$RUNNER_TEMP/names.txt" && ! grep -q "^$base\.zip\.part00$" "$RUNNER_TEMP/names.txt"; then
              echo "Missing archive or first split part for $base" >&2
              exit 1
            fi
          done < <(jq -r '.mods[].slug' "$CONTENT_SPEC")
          test "$(grep -c '^PulseForge-v1\.0\.0-complete-mod-.*\.manifest\.json$' "$RUNNER_TEMP/names.txt")" -eq 30
          gh api --method PATCH "repos/$repo/releases/$release_id" -F draft=false -F prerelease=false -f make_latest=true > "$RUNNER_TEMP/published.json"
          jq -e '.draft == false and .prerelease == false and .published_at != null' "$RUNNER_TEMP/published.json" >/dev/null
          ref="$(gh api "repos/$repo/git/ref/tags/$COMPLETE_TAG")"
          object_type="$(jq -r '.object.type' <<<"$ref")"
          object_sha="$(jq -r '.object.sha' <<<"$ref")"
          if [[ "$object_type" == 'tag' ]]; then
            tagged="$(gh api "repos/$repo/git/tags/$object_sha")"
            object_type="$(jq -r '.object.type' <<<"$tagged")"
            object_sha="$(jq -r '.object.sha' <<<"$tagged")"
          fi
          [[ "$object_type" == 'commit' && "$object_sha" == "$GITHUB_SHA" ]]
          echo "PulseForge $COMPLETE_TAG published at $GITHUB_SHA with all Complete content assets verified."
