name: Temporary dense gameplay FPS patch

on:
  push:
    branches:
      - perf/fix-dense-7fps-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dense gameplay FPS fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              return text.replace(old, new, 1)

          app_path = Path("src/app/application.cpp")
          app = app_path.read_text(encoding="utf-8")
          app = once(app, '#include "pulseforge/adaptive_scroll.hpp"\n', '#include "pulseforge/adaptive_scroll.hpp"\n#include "pulseforge/dense_chart_routing.hpp"\n', "routing include")
          old_threshold = (
              "        // PULSEFORGE_1_0_0_STREAMING_FIRST_WITH_COMPAT_FALLBACK_V1\n"
              "        // Source size is a performance hint, never a compatibility gate. Keep\n"
              "        // the zero-materialization fast path for genuinely huge Psych charts,\n"
              "        // but if the PFC1 importer does not understand this JSON dialect, retry\n"
              "        // the format-aware materialized loader instead of treating 32 MiB as a\n"
              "        // hard limit. This preserves monster-chart memory behavior while also\n"
              "        // accepting large V-Slice/Denpa/other supported JSON dialects.\n"
              "        constexpr std::uintmax_t preferred_streaming_json_bytes =\n"
              "            32U * 1024U * 1024U;\n"
          )
          new_threshold = (
              "        // PULSEFORGE_1_0_0_STREAMING_FIRST_WITH_COMPAT_FALLBACK_V2\n"
              "        // Source size is a performance hint, never a compatibility gate. Route\n"
              "        // moderately large JSON to PFC1 before materialization as well: the\n"
              "        // 15.9 MiB / 1,059,988-note Taimuresu Overkill chart proved that 32 MiB\n"
              "        // was far too late for high-NPS content. Unsupported dialects still\n"
              "        // fall back transparently to the format-aware materialized loader.\n"
          )
          app = once(app, old_threshold, new_threshold, "streaming threshold block")
          app = once(app, "            if (!size_error && source_bytes > preferred_streaming_json_bytes) {", "            if (!size_error && large_chart_source_prefers_streaming(source_bytes)) {", "source size decision")

          dense_lines = [
              "        if (options_.enable_large_chart_streaming",
              "            && materialized_chart_density_prefers_streaming(",
              "                *loaded_chart.chart,",
              "                options_.settings.performance.max_visible_notes",
              "            )) {",
              "            std::cerr",
              "                << \"[PulseForge][streaming] materialized chart has \"",
              "                << loaded_chart.chart->notes.size()",
              "                << \" notes and exceeds the dense viewport working-set hint; \"",
              "                   \"retrying as bounded PFC1 before gameplay\\n\";",
              "            if (load_streaming_content(",
              "                    \"dense materialized chart performance route\"",
              "                )) {",
              "                return true;",
              "            }",
              "            const auto density_streaming_error = last_error_;",
              "            last_error_.clear();",
              "            set_loading_phase(ContentLoadPhase::parsing_chart);",
              "            std::cerr",
              "                << \"[PulseForge][streaming] dense-route PFC1 fallback was not \"",
              "                   \"available; continuing with the compatible materialized chart\"",
              "                << (density_streaming_error.empty()",
              "                    ? \"\\n\"",
              "                    : \": \" + density_streaming_error + \"\\n\");",
              "        }",
              "",
          ]
          dense_block = "\n".join(dense_lines)
          app = once(app, "        chart_ = std::move(*loaded_chart.chart);\n", dense_block + "        chart_ = std::move(*loaded_chart.chart);\n", "density reroute")

          app = once(
              app,
              "            streaming_visual_cache_.reset();\n        }\n#endif\n        if (name == \"Change P1 Mania\"",
              "            // Camera transforms are applied at draw time; keep the canonical\n            // PVD/PFC time-lane cache alive across zoom pulses.\n        }\n#endif\n        if (name == \"Change P1 Mania\"",
              "Add Camera Zoom reset"
          )
          app = once(
              app,
              "        update_scene_camera();\n        update_scene_hud_camera();\n        streaming_visual_cache_.reset();\n    }\n#endif\n\n    void update_effects",
              "        update_scene_camera();\n        update_scene_hud_camera();\n        // Camera zoom decay is a draw-time presentation transform.\n    }\n#endif\n\n    void update_effects",
              "camera decay reset"
          )
          app = once(
              app,
              "            update_scene_hud_camera();\n            streaming_visual_cache_.reset();\n            error.clear();\n            return true;\n        }\n\n        const auto dot = name.find('.');",
              "            update_scene_hud_camera();\n            // HUD-camera transforms are consumed at draw time; preserve PVD/PFC.\n            error.clear();\n            return true;\n        }\n\n        const auto dot = name.find('.');",
              "camHUD property reset"
          )
          app = once(
              app,
              "            else if (tween.property == \"alpha\") state.alpha = std::clamp(value, 0.0, 1.0);\n            else return false;\n            streaming_visual_cache_.reset();\n            return true;\n        }\n        if (tween.target == ScriptTweenTarget::camera_game) {",
              "            else if (tween.property == \"alpha\") state.alpha = std::clamp(value, 0.0, 1.0);\n            else return false;\n            // Dense drawing applies strum x/y/scale/angle/alpha dynamically.\n            return true;\n        }\n        if (tween.target == ScriptTweenTarget::camera_game) {",
              "strum tween reset"
          )
          app = once(
              app,
              "            if (scene_ != nullptr) scene_->script_set_hud_camera(\n                script_cam_hud_x_, script_cam_hud_y_, script_cam_hud_zoom_,\n                script_cam_hud_angle_, script_cam_hud_alpha_\n            );\n            streaming_visual_cache_.reset();\n            return true;\n        }\n        if (auto hud = script_hud_objects_.find(tween.object);",
              "            if (scene_ != nullptr) scene_->script_set_hud_camera(\n                script_cam_hud_x_, script_cam_hud_y_, script_cam_hud_zoom_,\n                script_cam_hud_angle_, script_cam_hud_alpha_\n            );\n            // Camera/HUD tweening must not rebuild dense note coverage per frame.\n            return true;\n        }\n        if (auto hud = script_hud_objects_.find(tween.object);",
              "camHUD tween reset"
          )
          app_path.write_text(app, encoding="utf-8")

          test_path = Path("tests/streaming_gameplay_test.cpp")
          tests = test_path.read_text(encoding="utf-8")
          tests = once(tests, '#include "pulseforge/adaptive_scroll.hpp"\n', '#include "pulseforge/adaptive_scroll.hpp"\n#include "pulseforge/dense_chart_routing.hpp"\n', "test include")
          fn_lines = [
              "void test_dense_chart_streaming_routing() {",
              "    require(",
              "        pulseforge::large_chart_source_prefers_streaming(15'934'282U),",
              "        \"Taimuresu-size JSON takes streaming-first route\"",
              "    );",
              "    require(",
              "        !pulseforge::large_chart_source_prefers_streaming(4U * 1024U * 1024U),",
              "        \"small ordinary JSON remains materialized\"",
              "    );",
              "    require(",
              "        pulseforge::materialized_note_count_prefers_streaming(250'000U)",
              "            && !pulseforge::materialized_note_count_prefers_streaming(249'999U),",
              "        \"large note count is a routing hint, not a validity limit\"",
              "    );",
              "",
              "    pulseforge::Chart dense;",
              "    dense.key_count = 4U;",
              "    dense.notes.reserve(17'000U);",
              "    for (std::size_t index = 0U; index < 17'000U; ++index) {",
              "        dense.notes.push_back({static_cast<double>(index) * 0.10, 0.0,",
              "            static_cast<std::uint16_t>(index % 4U),",
              "            pulseforge::NoteOwner::player, \"normal\"});",
              "    }",
              "    dense.normalize();",
              "    require(",
              "        pulseforge::materialized_chart_density_prefers_streaming(dense, 4'096U),",
              "        \"extreme NPS below total-note threshold routes to PFC1\"",
              "    );",
              "",
              "    pulseforge::Chart sparse;",
              "    sparse.key_count = 4U;",
              "    sparse.notes.reserve(17'000U);",
              "    for (std::size_t index = 0U; index < 17'000U; ++index) {",
              "        sparse.notes.push_back({static_cast<double>(index) * 10.0, 0.0,",
              "            static_cast<std::uint16_t>(index % 4U),",
              "            pulseforge::NoteOwner::player, \"normal\"});",
              "    }",
              "    sparse.normalize();",
              "    require(",
              "        !pulseforge::materialized_chart_density_prefers_streaming(sparse, 4'096U),",
              "        \"long sparse charts are not forced into streaming by duration\"",
              "    );",
              "}",
              "",
              "",
          ]
          fn = "\n".join(fn_lines)
          marker = "\n}  // namespace\n\nint main() {\n"
          tests = once(tests, marker, "\n" + fn + "}  // namespace\n\nint main() {\n", "routing test function")
          tests = once(tests, "        const TemporaryDirectory directory;\n        test_adaptive_scroll_controller();\n", "        const TemporaryDirectory directory;\n        test_adaptive_scroll_controller();\n        test_dense_chart_streaming_routing();\n", "routing test call")
          test_path.write_text(tests, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          anchor = "- Adds a visual-only adaptive scroll controller targeting 60 FPS. It learns a conservative on-screen logical-note budget per device, raises scroll speed in discrete hysteretic steps under real note pressure, and relaxes toward the authored speed after frame-time/density recovery without altering song time, hit windows, score or replay determinism.\n"
          addition = anchor + "- Fixes the persistent ~7 FPS path on Taimuresu Overkill and other dense Psych charts by routing 8 MiB+/250k-note/high-NPS sources into bounded PFC1 earlier and by keeping canonical PVD/PFC coverage cached across camera zoom decay, HUD-camera animation and draw-time strum transforms.\n"
          changelog = once(changelog, anchor, addition, "changelog")
          changelog_path.write_text(changelog, encoding="utf-8")

          for transient in [Path(".github/workflows/tmp-dense-fps-audit.yml"), Path(".github/tmp-dense-audit-trigger.txt")]:
              if transient.exists():
                  transient.unlink()
          PY
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(runtime): eliminate dense-chart 7 FPS rebuild path'
          git push origin HEAD:perf/fix-dense-7fps-20260912
