name: Temporary dense gameplay FPS patch

on:
  push:
    branches:
      - perf/fix-dense-7fps-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dense gameplay FPS fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          header = r'''#pragma once

#include "pulseforge/chart.hpp"

#include <algorithm>
#include <cmath>
#include <cstddef>
#include <cstdint>
#include <limits>

namespace pulseforge {

// Routing hints, never chart-validity limits.  The PFC1 path is substantially
// cheaper for dense gameplay because it can answer viewport queries without
// visiting every logical note in the visible time interval every frame.
inline constexpr std::uintmax_t preferred_streaming_json_bytes =
    8ULL * 1024ULL * 1024ULL;
inline constexpr std::size_t preferred_streaming_total_notes = 250'000U;
inline constexpr double preferred_streaming_density_window_ms = 2'000.0;
inline constexpr std::size_t minimum_dense_window_note_budget = 16'384U;
inline constexpr std::size_t maximum_dense_window_note_budget = 65'536U;

[[nodiscard]] inline bool large_chart_source_prefers_streaming(
    const std::uintmax_t source_bytes
) noexcept {
    return source_bytes >= preferred_streaming_json_bytes;
}

[[nodiscard]] inline bool materialized_note_count_prefers_streaming(
    const std::size_t note_count
) noexcept {
    return note_count >= preferred_streaming_total_notes;
}

[[nodiscard]] inline std::size_t dense_window_note_budget(
    const std::uint32_t configured_visible_notes
) noexcept {
    const auto configured = static_cast<std::size_t>(
        std::max<std::uint32_t>(configured_visible_notes, 1U)
    );
    const auto scaled = configured
            > std::numeric_limits<std::size_t>::max() / 4U
        ? std::numeric_limits<std::size_t>::max()
        : configured * 4U;
    return std::clamp(
        scaled,
        minimum_dense_window_note_budget,
        maximum_dense_window_note_budget
    );
}

// Chart::normalize() and all production loaders keep notes ordered by time. The
// two-pointer scan is O(n), allocation-free, and executes only once at load.
// It catches compact high-NPS charts that do not cross the source-byte hint.
[[nodiscard]] inline bool materialized_chart_density_prefers_streaming(
    const Chart& chart,
    const std::uint32_t configured_visible_notes
) noexcept {
    if (materialized_note_count_prefers_streaming(chart.notes.size())) {
        return true;
    }
    const auto threshold = dense_window_note_budget(configured_visible_notes);
    if (chart.notes.size() < threshold) {
        return false;
    }

    std::size_t left = 0U;
    double previous = -std::numeric_limits<double>::infinity();
    for (std::size_t right = 0U; right < chart.notes.size(); ++right) {
        const double time = chart.notes[right].time_ms;
        if (!std::isfinite(time)) {
            continue;
        }
        // Invalid/out-of-order charts are handled by normal validation. Do not
        // turn this performance heuristic into a compatibility rejection.
        if (time < previous) {
            return false;
        }
        previous = time;
        while (left < right
            && time - chart.notes[left].time_ms
                > preferred_streaming_density_window_ms) {
            ++left;
        }
        if (right - left + 1U >= threshold) {
            return true;
        }
    }
    return false;
}

}  // namespace pulseforge
'''
          Path('include/pulseforge/dense_chart_routing.hpp').write_text(header, encoding='utf-8')

          app_path = Path('src/app/application.cpp')
          app = app_path.read_text(encoding='utf-8')
          app = replace_once(
              app,
              '#include "pulseforge/adaptive_scroll.hpp"\n',
              '#include "pulseforge/adaptive_scroll.hpp"\n#include "pulseforge/dense_chart_routing.hpp"\n',
              'routing include'
          )
          app = replace_once(
              app,
              '''        // PULSEFORGE_1_0_0_STREAMING_FIRST_WITH_COMPAT_FALLBACK_V1
        // Source size is a performance hint, never a compatibility gate. Keep
        // the zero-materialization fast path for genuinely huge Psych charts,
        // but if the PFC1 importer does not understand this JSON dialect, retry
        // the format-aware materialized loader instead of treating 32 MiB as a
        // hard limit. This preserves monster-chart memory behavior while also
        // accepting large V-Slice/Denpa/other supported JSON dialects.
        constexpr std::uintmax_t preferred_streaming_json_bytes =
            32U * 1024U * 1024U;
''',
              '''        // PULSEFORGE_1_0_0_STREAMING_FIRST_WITH_COMPAT_FALLBACK_V2
        // Source size is a performance hint, never a compatibility gate. Route
        // moderately large JSON to PFC1 before materialization as well: the
        // 15.9 MiB / 1,059,988-note Taimuresu Overkill chart proved that 32 MiB
        // was far too late for high-NPS content. Unsupported dialects still
        // fall back transparently to the format-aware materialized loader.
''',
              'streaming-first threshold declaration'
          )
          app = replace_once(
              app,
              '            if (!size_error && source_bytes > preferred_streaming_json_bytes) {',
              '            if (!size_error && large_chart_source_prefers_streaming(source_bytes)) {',
              'source-byte route'
          )

          dense_block = '''        if (options_.enable_large_chart_streaming
            && materialized_chart_density_prefers_streaming(
                *loaded_chart.chart,
                options_.settings.performance.max_visible_notes
            )) {
            std::cerr
                << "[PulseForge][streaming] materialized chart has "
                << loaded_chart.chart->notes.size()
                << " notes and exceeds the dense viewport working-set hint; "
                   "retrying as bounded PFC1 before gameplay\\n";
            if (load_streaming_content(
                    "dense materialized chart performance route"
                )) {
                return true;
            }
            const auto density_streaming_error = last_error_;
            last_error_.clear();
            set_loading_phase(ContentLoadPhase::parsing_chart);
            std::cerr
                << "[PulseForge][streaming] dense-route PFC1 fallback was not "
                   "available; continuing with the compatible materialized "
                   "chart"
                << (density_streaming_error.empty()
                    ? "\\n"
                    : ": " + density_streaming_error + "\\n");
        }
'''
          app = replace_once(
              app,
              '        chart_ = std::move(*loaded_chart.chart);\n',
              dense_block + '        chart_ = std::move(*loaded_chart.chart);\n',
              'post-load density route'
          )

          # PVD/PFC stores canonical time/lane coverage. Camera/HUD/strum visual
          # transforms are applied dynamically by draw_dense_note_coverage(), so
          # invalidating the expensive density cache for those transforms causes
          # frame-by-frame rebuilds without improving correctness.
          app = replace_once(
              app,
              '''            streaming_visual_cache_.reset();
        }
#endif
        if (name == "Change P1 Mania"''',
              '''            // Camera transforms are applied at draw time; keep the
            // canonical PVD/PFC time-lane cache alive across zoom pulses.
        }
#endif
        if (name == "Change P1 Mania"''',
              'Add Camera Zoom cache invalidation'
          )
          app = replace_once(
              app,
              '''        update_scene_camera();
        update_scene_hud_camera();
        streaming_visual_cache_.reset();
    }
#endif

    void update_effects''',
              '''        update_scene_camera();
        update_scene_hud_camera();
        // Camera zoom decay is a presentation transform. Dense note rows stay
        // canonical and are transformed when drawn, so no cache rebuild here.
    }
#endif

    void update_effects''',
              'camera decay cache invalidation'
          )
          app = replace_once(
              app,
              '''            update_scene_hud_camera();
            streaming_visual_cache_.reset();
            error.clear();
            return true;
        }

        const auto dot = name.find('.');''',
              '''            update_scene_hud_camera();
            // HUD camera transforms are consumed at draw time; rebuilding PVD
            // density rows here would turn Psych camera animation into O(chart).
            error.clear();
            return true;
        }

        const auto dot = name.find('.');''',
              'camHUD property cache invalidation'
          )
          app = replace_once(
              app,
              '''            else if (tween.property == "alpha") state.alpha = std::clamp(value, 0.0, 1.0);
            else return false;
            streaming_visual_cache_.reset();
            return true;
        }
        if (tween.target == ScriptTweenTarget::camera_game) {''',
              '''            else if (tween.property == "alpha") state.alpha = std::clamp(value, 0.0, 1.0);
            else return false;
            // Strum x/y/scale/angle/alpha are applied from script state by the
            // dense draw path. Preserve the canonical time-density cache.
            return true;
        }
        if (tween.target == ScriptTweenTarget::camera_game) {''',
              'strum tween cache invalidation'
          )
          app = replace_once(
              app,
              '''            if (scene_ != nullptr) scene_->script_set_hud_camera(
                script_cam_hud_x_, script_cam_hud_y_, script_cam_hud_zoom_,
                script_cam_hud_angle_, script_cam_hud_alpha_
            );
            streaming_visual_cache_.reset();
            return true;
        }
        if (auto hud = script_hud_objects_.find(tween.object);''',
              '''            if (scene_ != nullptr) scene_->script_set_hud_camera(
                script_cam_hud_x_, script_cam_hud_y_, script_cam_hud_zoom_,
                script_cam_hud_angle_, script_cam_hud_alpha_
            );
            // Camera/HUD tweening must not rebuild a million-note visual index
            // every frame; draw-time transforms preserve the authored effect.
            return true;
        }
        if (auto hud = script_hud_objects_.find(tween.object);''',
              'camera HUD tween cache invalidation'
          )
          app_path.write_text(app, encoding='utf-8')

          test_path = Path('tests/streaming_gameplay_test.cpp')
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              '#include "pulseforge/adaptive_scroll.hpp"\n',
              '#include "pulseforge/adaptive_scroll.hpp"\n#include "pulseforge/dense_chart_routing.hpp"\n',
              'test routing include'
          )
          test_fn = r'''
void test_dense_chart_streaming_routing() {
    require(
        pulseforge::large_chart_source_prefers_streaming(15'934'282U),
        "Taimuresu-size JSON takes streaming-first route"
    );
    require(
        !pulseforge::large_chart_source_prefers_streaming(4U * 1024U * 1024U),
        "small ordinary JSON remains on compatible materialized route"
    );
    require(
        pulseforge::materialized_note_count_prefers_streaming(250'000U)
            && !pulseforge::materialized_note_count_prefers_streaming(249'999U),
        "large materialized note count is a routing hint, not a validity limit"
    );

    pulseforge::Chart dense;
    dense.key_count = 4U;
    dense.notes.reserve(17'000U);
    for (std::size_t index = 0U; index < 17'000U; ++index) {
        dense.notes.push_back({
            static_cast<double>(index) * 0.10,
            0.0,
            static_cast<std::uint16_t>(index % 4U),
            pulseforge::NoteOwner::player,
            "normal"
        });
    }
    dense.normalize();
    require(
        pulseforge::materialized_chart_density_prefers_streaming(dense, 4'096U),
        "extreme NPS below total-note threshold routes to PFC1"
    );

    pulseforge::Chart sparse;
    sparse.key_count = 4U;
    sparse.notes.reserve(17'000U);
    for (std::size_t index = 0U; index < 17'000U; ++index) {
        sparse.notes.push_back({
            static_cast<double>(index) * 10.0,
            0.0,
            static_cast<std::uint16_t>(index % 4U),
            pulseforge::NoteOwner::player,
            "normal"
        });
    }
    sparse.normalize();
    require(
        !pulseforge::materialized_chart_density_prefers_streaming(sparse, 4'096U),
        "long sparse charts are not forced into streaming solely by length"
    );
}

'''
          marker = '\n}  // namespace\n\nint main() {\n'
          tests = replace_once(
              tests,
              marker,
              '\n' + test_fn + '}  // namespace\n\nint main() {\n',
              'routing test function'
          )
          tests = replace_once(
              tests,
              '''        const TemporaryDirectory directory;
        test_adaptive_scroll_controller();
''',
              '''        const TemporaryDirectory directory;
        test_adaptive_scroll_controller();
        test_dense_chart_streaming_routing();
''',
              'routing test invocation'
          )
          test_path.write_text(tests, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          anchor = '- Adds a visual-only adaptive scroll controller targeting 60 FPS. It learns a conservative on-screen logical-note budget per device, raises scroll speed in discrete hysteretic steps under real note pressure, and relaxes toward the authored speed after frame-time/density recovery without altering song time, hit windows, score or replay determinism.\n'
          addition = anchor + '- Fixes the persistent ~7 FPS path on Taimuresu Overkill and other dense Psych charts by routing 8 MiB+/250k-note/high-NPS sources into bounded PFC1 earlier and by keeping canonical PVD/PFC coverage cached across camera zoom decay, HUD-camera animation and draw-time strum transforms.\n'
          changelog = replace_once(changelog, anchor, addition, 'changelog FPS note')
          changelog_path.write_text(changelog, encoding='utf-8')

          for transient in (
              Path('.github/workflows/tmp-dense-fps-audit.yml'),
              Path('.github/tmp-dense-audit-trigger.txt'),
          ):
              if transient.exists():
                  transient.unlink()
          PY

          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(runtime): eliminate dense-chart 7 FPS rebuild path'
          git push origin HEAD:perf/fix-dense-7fps-20260912
