name: PR161 one-shot Android runtime cache-root repair

on:
  push:
    branches:
      - fix/large-chart-streaming-diagnostics-20260913

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/large-chart-streaming-diagnostics-20260913
          fetch-depth: 0
      - name: Patch gameplay PFC1 cache root on Android
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/app/application.cpp")
          text = path.read_text(encoding="utf-8")
          old = """        StreamingChartCacheOptions cache_options;\n        cache_options.cache_root = options_.large_chart_cache_root;\n        cache_options.difficulty = options_.chart_options.difficulty;\n"""
          new = """        StreamingChartCacheOptions cache_options;\n        cache_options.cache_root = options_.large_chart_cache_root;\n#if defined(__ANDROID__)\n        // The interactive gameplay path must not fall back to the process CWD\n        // on Android. The launcher/editor already use SDL's writable per-app\n        // storage, but gameplay owns a separate cache preparation path.\n        if (cache_options.cache_root.empty()) {\n            if (char* preference = SDL_GetPrefPath(\"PulseForge\", \"PulseForge\");\n                preference != nullptr) {\n                cache_options.cache_root = std::filesystem::path(preference)\n                    / \"cache\" / \"large-charts\";\n                SDL_free(preference);\n            } else {\n                std::error_code temporary_error;\n                const auto temporary_root =\n                    std::filesystem::temp_directory_path(temporary_error);\n                if (!temporary_error) {\n                    cache_options.cache_root = temporary_root\n                        / \"pulseforge\" / \"large-charts\";\n                }\n            }\n        }\n#endif\n        cache_options.difficulty = options_.chart_options.difficulty;\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one cache-options block, got {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit cache-root repair and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr161-one-shot-android-cache.yml
          git add src/app/application.cpp
          git commit -m "fix(android): use writable PFC1 cache in gameplay"
          git push origin HEAD:fix/large-chart-streaming-diagnostics-20260913
