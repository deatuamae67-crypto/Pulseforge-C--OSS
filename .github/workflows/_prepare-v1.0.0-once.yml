name: Prepare PulseForge 1.0.0 once

on:
  push:
    branches:
      - release/v1.0.0-final
    paths:
      - '.github/workflows/_prepare-v1.0.0-once.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/v1.0.0-final
          fetch-depth: 1

      - name: Apply exact 1.0.0 source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_v1_0_0.py
          git diff --check
          grep -R --line-number --fixed-strings 'VERSION 1.0.0' CMakeLists.txt
          grep -R --line-number --fixed-strings "versionName = '1.0.0'" platform/android/app/build.gradle
          grep -R --line-number --fixed-strings 'PULSEFORGE_1_0_0_SELECTED_SCRIPT_ROOT_ISOLATION_V1' src/app/psych_content_roots.hpp

      - name: Commit prepared source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt README.md CHANGELOG.md \
            platform/android/app/build.gradle platform/android/README.md \
            .github/ISSUE_TEMPLATE/bug_report.yml \
            src/app/psych_content_roots.hpp src/app/application.cpp \
            tests/psych_content_roots_test.cpp \
            docs/MOD_CORPUS_1.0.0.json docs/MOD_CORPUS_1.0.0.md \
            docs/RELEASE_NOTES_1.0.0.md mods/README.md
          git diff --cached --quiet && { echo 'No prepared changes were produced.' >&2; exit 1; }
          git commit -m 'release: prepare PulseForge 1.0.0'
          git push origin HEAD:release/v1.0.0-final
