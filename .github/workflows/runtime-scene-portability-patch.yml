name: PulseForge runtime-scene portability patch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-source:
    if: ${{ github.actor == github.repository_owner }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: import/pulseforge-0.9.7-oss
          fetch-depth: 0

      - name: Replace remaining floating from_chars
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/runtime_scene.cpp')
          text = path.read_text(encoding='utf-8')

          include = '#include "pulseforge/ascii_number.hpp"'
          if include not in text:
              anchor = '#include "runtime_texture_policy.hpp"\n'
              if text.count(anchor) != 1:
                  raise SystemExit('runtime_scene.cpp: expected one include anchor')
              text = text.replace(anchor, anchor + '\n' + include + '\n', 1)

          event_start = text.find('const auto event_number = [](')
          event_end = text.find('\n        };', event_start)
          if event_start < 0 or event_end < 0:
              raise SystemExit('runtime_scene.cpp: event_number lambda not found')

          block = text[event_start:event_end]
          pattern = re.compile(
              r'''            double parsed\{\};\n'''
              r'''            const auto converted = std::from_chars\(\n'''
              r'''                text\.data\(\),\n'''
              r'''                text\.data\(\) \+ text\.size\(\),\n'''
              r'''                parsed\n'''
              r'''            \);\n'''
              r'''            return converted\.ec == std::errc\{\}\n'''
              r'''                    && converted\.ptr == text\.data\(\) \+ text\.size\(\)\n'''
              r'''                    && std::isfinite\(parsed\)\n'''
              r'''                \? parsed\n'''
              r'''                : fallback;'''
          )
          replacement = '''            double parsed{};
            return parse_ascii_floating<double>(text, parsed)
                ? parsed
                : fallback;'''
          block, count = pattern.subn(replacement, block)
          if count != 1:
              raise SystemExit(f'runtime_scene.cpp: expected one event-number from_chars block, found {count}')

          text = text[:event_start] + block + text[event_end:]
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- src/app/runtime_scene.cpp

      - name: Commit runtime-scene portability fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/runtime_scene.cpp
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix: centralize runtime event number parsing'
          git push origin HEAD:import/pulseforge-0.9.7-oss
