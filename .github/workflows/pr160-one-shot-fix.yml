name: PR160 one-shot Android compile fix

on:
  push:
    branches:
      - fix/android-profiler-lua-render-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-profiler-lua-render-20260912
          fetch-depth: 0
      - name: Patch Android OfflineEncoder finalization guard
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/app/offline_encoder.cpp")
          text = path.read_text(encoding="utf-8")
          old = """bool OfflineEncoder::finish(std::string* error) {
          #if defined(_WIN32)
              const bool process_ready = process_handle_ != nullptr;
          #else
              const bool process_ready = process_ != nullptr;
          #endif
          """.replace("          ", "")
          new = """bool OfflineEncoder::finish(std::string* error) {
          #if defined(__ANDROID__)
              const bool process_ready = android_session_id_ >= 0;
          #elif defined(_WIN32)
              const bool process_ready = process_handle_ != nullptr;
          #else
              const bool process_ready = process_ != nullptr;
          #endif
          """.replace("          ", "")
          if old not in text:
              if new in text:
                  print("Patch already applied")
                  raise SystemExit(0)
              raise SystemExit("Expected OfflineEncoder::finish guard not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet -- src/app/offline_encoder.cpp; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/offline_encoder.cpp
          git commit -m "fix(android): finalize FFmpegKit encoder without SDL process"
          git push origin HEAD:fix/android-profiler-lua-render-20260912
