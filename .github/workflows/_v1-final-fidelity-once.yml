name: Validate final PulseForge 1.0.0 fidelity once

on:
  push:
    branches:
      - release/v1.0.0-final
    paths:
      - '.github/workflows/_v1-final-fidelity-once.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/v1.0.0-final
          fetch-depth: 1

      - name: Apply and stage final fidelity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_v1_final_fidelity.py
          git diff --check
          grep -R --line-number --fixed-strings 'PULSEFORGE_1_0_0_PSYCH_EASING_FIDELITY_V1' src/app/application.cpp
          grep -F 'quartIn' src/app/application.cpp
          grep -F 'quintOut' src/app/application.cpp
          grep -F 'third-party mod payloads are not automatically redistributed' docs/MOD_CORPUS_1.0.0.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/application.cpp CHANGELOG.md \
            docs/RELEASE_NOTES_1.0.0.md docs/MOD_CORPUS_1.0.0.md mods/README.md
          git diff --cached --quiet && { echo 'No source changes produced.' >&2; exit 1; }
          git commit -m 'fix(compat): preserve Psych easing fidelity in 1.0.0'
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - name: Compile engine and Lua regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_COMMIT"
          cmake --preset linux-release \
            -DPULSEFORGE_BUILD_TESTS=ON \
            -DPULSEFORGE_BUILD_AUTOCHART=OFF \
            -DPULSEFORGE_ENABLE_LUA=ON
          cmake --build --preset linux-release --target \
            pulseforge pulseforge_lua_tests --parallel 2
          ./out/build/linux-release/pulseforge_lua_tests
          test "$(git rev-parse HEAD)" = "$VALIDATED_COMMIT"

      - name: Push tested commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_COMMIT"
          git push origin HEAD:release/v1.0.0-final
