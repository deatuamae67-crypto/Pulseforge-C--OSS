name: temporary Android runtime patch

on:
  push:
    branches: [fix/android-profiler-lua-render-20260912]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/android-profiler-lua-render-20260912
          fetch-depth: 1

      - name: Apply Android profiler, Lua and render patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp_android_runtime_patch.py

      - name: Commit implementation and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-android-profiler-patch.yml
          rm -f scripts/tmp_android_runtime_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(android): add on-device profiler, Lua switch and render backend'
          git push origin HEAD:fix/android-profiler-lua-render-20260912
