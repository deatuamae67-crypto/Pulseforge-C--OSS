name: Temporary adaptive onscreen streaming patch

on:
  push:
    branches:
      - perf/onscreen-streaming-adaptive-scroll-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply viewport streaming and adaptive scroll patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          app_path = Path('src/app/application.cpp')
          app = app_path.read_text(encoding='utf-8')

          app = once(app,
              '#include "pulseforge/audio_controls.hpp"\n',
              '#include "pulseforge/adaptive_scroll.hpp"\n#include "pulseforge/audio_controls.hpp"\n',
              'adaptive include')

          old_comments = (
              '        // Judgment remains deliberately bounded. If this temporal window is\n'
              '        // denser than 262144 notes, overdue taps are resolved by the streaming\n'
              '        // scheduler while the independent visual range visitor below still\n'
              '        // accounts for every on-screen head through fixed-memory LOD bins.\n'
              "        streaming_options.max_window_notes = 262'144U;\n"
          )
          new_window = (
              '        // Judgment state is independent from visual density. Keep only a bounded\n'
              "        // near-receptor working set; dense excess is handled by the scheduler's\n"
              '        // arithmetic/bulk catch-up while the PVD/PFC range visitor represents\n'
              '        // the viewport without materializing every logical note.\n'
              '        const auto configured_visual_budget = static_cast<std::size_t>(\n'
              '            std::max<std::uint32_t>(\n'
              '                options_.settings.performance.max_visible_notes,\n'
              '                1U\n'
              '            )\n'
              '        );\n'
              '        const auto scaled_judgment_window = configured_visual_budget\n'
              '                > std::numeric_limits<std::size_t>::max() / 2U\n'
              '            ? std::numeric_limits<std::size_t>::max()\n'
              '            : configured_visual_budget * 2U;\n'
              '        streaming_options.max_window_notes = std::clamp<std::size_t>(\n'
              '            scaled_judgment_window,\n'
              "            4'096U,\n"
              "            32'768U\n"
              '        );\n'
          )
          app = once(app, old_comments, new_window, 'bounded judgment window')

          old_speed = (
              '        const double speed = 0.43\n'
              '            * chart_speed\n'
              '            * gameplay_settings().scroll_speed;\n'
          )
          new_speed = (
              '        const double base_speed = 0.43\n'
              '            * chart_speed\n'
              '            * gameplay_settings().scroll_speed;\n'
              '        // Density adaptation is visual-only. Song time, hit windows, score,\n'
              '        // replay determinism and every gameplay judgment keep authored timing.\n'
              '        const double speed = base_speed * adaptive_scroll_.multiplier();\n'
          )
          app = once(app, old_speed, new_speed, 'adaptive visual speed')

          flash = '        screen_flash_ = std::max(0.0F, screen_flash_ - elapsed * 2.8F);\n'
          update = (
              '        adaptive_scroll_.update(\n'
              '            static_cast<double>(elapsed),\n'
              '            smoothed_fps_,\n'
              '            smoothed_frame_ms_,\n'
              '            rendered_notes_,\n'
              '            options_.settings.performance.max_visible_notes,\n'
              '            !options_.offline_render.enabled && !options_.smoke_test\n'
              '        );\n'
          ) + flash
          app = once(app, flash, update, 'adaptive update hook')

          render_start = app.index('    void render_streaming_notes(\n')
          render_end = app.index('    struct DenseReceptorClip final', render_start)
          render = app[render_start:render_end]
          old_open = (
              '    void render_streaming_notes(\n'
              '        const double visual_time,\n'
              '        const double speed\n'
              '    ) {\n'
              '        // A saturated judgment window may contain hundreds of thousands of\n'
              '        // entries. Decide on the indexed LOD path before walking it; the old\n'
              '        // order performed a full dense scan and then immediately discarded it.\n'
              '        if (streaming_session_->window_saturated()\n'
              '            && render_saturated_streaming_notes(visual_time, speed)) {\n'
              '            return;\n'
              '        }\n'
              '        auto& coverage = frame_note_coverage(\n'
              '            streaming_session_->window_notes().size()\n'
              '        );\n'
          )
          new_open = (
              '    void render_streaming_notes(\n'
              '        const double visual_time,\n'
              '        const double speed\n'
              '    ) {\n'
              '        const auto notes = streaming_session_->window_notes();\n'
              '        const auto configured = static_cast<std::size_t>(\n'
              '            std::max<std::uint32_t>(\n'
              '                options_.settings.performance.max_visible_notes,\n'
              '                1U\n'
              '            )\n'
              '        );\n'
              '        const auto doubled = configured\n'
              '                > std::numeric_limits<std::size_t>::max() / 2U\n'
              '            ? std::numeric_limits<std::size_t>::max()\n'
              '            : configured * 2U;\n'
              '        const auto indexed_threshold = std::clamp<std::size_t>(\n'
              '            doubled,\n'
              "            4'096U,\n"
              "            32'768U\n"
              '        );\n'
              '        // Enter fixed-memory indexed LOD before hard saturation.\n'
              '        const bool use_indexed_visuals =\n'
              '            streaming_session_->window_saturated()\n'
              '            || notes.size() > indexed_threshold\n'
              '            || adaptive_scroll_.multiplier() > 1.0;\n'
              '        if (use_indexed_visuals\n'
              '            && render_saturated_streaming_notes(visual_time, speed)) {\n'
              '            return;\n'
              '        }\n'
              '        auto& coverage = frame_note_coverage(notes.size());\n'
          )
          if render.count(old_open) != 1:
              raise SystemExit(f'render opening matches={render.count(old_open)}')
          render = render.replace(old_open, new_open, 1)
          loops = render.count('for (const auto& window : streaming_session_->window_notes()) {')
          if loops != 2:
              raise SystemExit(f'render exact loops expected 2, got {loops}')
          render = render.replace(
              'for (const auto& window : streaming_session_->window_notes()) {',
              'for (const auto& window : notes) {')
          app = app[:render_start] + render + app[render_end:]

          old_active = (
              '        auto& active_coverage = frame_note_coverage(\n'
              '            streaming_session_->window_notes().size()\n'
              '        );\n'
              '        const auto visual_us = bounded_microseconds(visual_time, false);\n'
              '        const auto streaming_kinds = streaming_reader_->kinds();\n'
              '        for (const auto& window : streaming_session_->window_notes()) {\n'
              '            if (window.note.time_us >= visual_us) {\n'
              '                break;\n'
              '            }\n'
          )
          new_active = (
              '        const auto notes = streaming_session_->window_notes();\n'
              '        const auto visual_us = bounded_microseconds(visual_time, false);\n'
              '        const double miss_ms = std::isfinite(gameplay_settings().windows.miss_ms)\n'
              '            ? std::max(0.0, gameplay_settings().windows.miss_ms)\n'
              '            : 180.0;\n'
              '        const double active_past_ms = visible_time_window_ms(\n'
              '            static_cast<double>(logical_height) + 96.0,\n'
              '            minimum_visual_speed(speed),\n'
              '            miss_ms + 75.0\n'
              '        );\n'
              '        const auto first_active_us = bounded_microseconds(\n'
              '            visual_time - active_past_ms,\n'
              '            false\n'
              '        );\n'
              '        const auto active_begin = std::lower_bound(\n'
              '            notes.begin(), notes.end(), first_active_us,\n'
              '            [](const StreamingWindowNote& note, const std::int64_t time) {\n'
              '                return note.note.time_us < time;\n'
              '            }\n'
              '        );\n'
              '        const auto active_end = std::lower_bound(\n'
              '            active_begin, notes.end(), visual_us,\n'
              '            [](const StreamingWindowNote& note, const std::int64_t time) {\n'
              '                return note.note.time_us < time;\n'
              '            }\n'
              '        );\n'
              '        auto& active_coverage = frame_note_coverage(\n'
              '            static_cast<std::size_t>(std::distance(active_begin, active_end))\n'
              '        );\n'
              '        const auto streaming_kinds = streaming_reader_->kinds();\n'
              '        for (auto iterator = active_begin; iterator != active_end; ++iterator) {\n'
              '            const auto& window = *iterator;\n'
          )
          app = once(app, old_active, new_active, 'indexed active slice')

          old_count = (
              '        const auto active_count = active_coverage.represented_note_count();\n'
              '        const auto future_count = streaming_visual_cache_\n'
              '            ->represented_note_count();\n'
              '        rendered_notes_ = future_count\n'
              '                > std::numeric_limits<std::uint64_t>::max() - active_count\n'
              '            ? std::numeric_limits<std::uint64_t>::max()\n'
              '            : future_count + active_count;\n'
              '        return true;\n'
          )
          new_count = (
              '        const auto active_count = active_coverage.represented_note_count();\n'
              '        // Count only cache heads mapped into the actual 720p viewport.\n'
              '        std::uint64_t future_visible_heads{};\n'
              '        const auto row_count = streaming_visual_cache_->row_count();\n'
              '        const double row_height = streaming_visual_cache_->row_height();\n'
              '        if (row_count != 0U && row_height > 0.0) {\n'
              '            const double source_top = std::max(0.0, -y_offset);\n'
              '            const double source_bottom = std::min(\n'
              '                static_cast<double>(row_count) * row_height,\n'
              '                static_cast<double>(logical_height) - y_offset\n'
              '            );\n'
              '            if (source_bottom > source_top) {\n'
              '                const auto first_row = std::min<std::size_t>(\n'
              '                    row_count, static_cast<std::size_t>(\n'
              '                        std::floor(source_top / row_height)\n'
              '                    )\n'
              '                );\n'
              '                const auto end_row = std::min<std::size_t>(\n'
              '                    row_count, static_cast<std::size_t>(\n'
              '                        std::ceil(source_bottom / row_height)\n'
              '                    )\n'
              '                );\n'
              '                for (const auto owner : {\n'
              '                        NoteOwner::opponent,\n'
              '                        NoteOwner::secondary_opponent,\n'
              '                        NoteOwner::player,\n'
              '                    }) {\n'
              '                    for (std::uint16_t lane = 0U;\n'
              '                         lane < streaming_visual_cache_->lane_count(); ++lane) {\n'
              '                        for (std::size_t row = first_row; row < end_row; ++row) {\n'
              '                            const auto count = streaming_visual_cache_->cell(\n'
              '                                owner, lane, row\n'
              '                            ).head_count;\n'
              '                            future_visible_heads = count\n'
              '                                    > std::numeric_limits<std::uint64_t>::max()\n'
              '                                        - future_visible_heads\n'
              '                                ? std::numeric_limits<std::uint64_t>::max()\n'
              '                                : future_visible_heads + count;\n'
              '                        }\n'
              '                    }\n'
              '                }\n'
              '            }\n'
              '        }\n'
              '        rendered_notes_ = future_visible_heads\n'
              '                > std::numeric_limits<std::uint64_t>::max() - active_count\n'
              '            ? std::numeric_limits<std::uint64_t>::max()\n'
              '            : future_visible_heads + active_count;\n'
              '        return true;\n'
          )
          app = once(app, old_count, new_count, 'viewport logical count')

          app = once(app,
              '    double smoothed_fps_{};\n    double smoothed_frame_ms_{};\n',
              '    double smoothed_fps_{};\n    double smoothed_frame_ms_{};\n    AdaptiveScrollController adaptive_scroll_;\n',
              'adaptive member')
          app_path.write_text(app, encoding='utf-8')

          test_path = Path('tests/streaming_gameplay_test.cpp')
          tests = test_path.read_text(encoding='utf-8')
          tests = once(tests,
              '#include "pulseforge/gameplay.hpp"\n',
              '#include "pulseforge/adaptive_scroll.hpp"\n#include "pulseforge/gameplay.hpp"\n',
              'test include')
          fn = (
              '\nvoid test_adaptive_scroll_controller() {\n'
              '    pulseforge::AdaptiveScrollController controller;\n'
              '    for (int index = 0; index < 4; ++index) {\n'
              "        controller.update(0.25, 120.0, 8.3, 240U, 4'096U, true);\n"
              '    }\n'
              '    require(std::abs(controller.multiplier() - 1.0) < 0.000001,\n'
              '        "adaptive scroll leaves ordinary low-density gameplay authored");\n'
              "    controller.update(0.25, 7.0, 142.0, 100'000U, 4'096U, true);\n"
              '    require(controller.multiplier() > 1.0,\n'
              '        "adaptive scroll reacts to pathological density");\n'
              "    require(controller.learned_note_budget() < 4'096U,\n"
              '        "adaptive scroll learns a lower device budget after frame collapse");\n'
              '    const double first_boost = controller.multiplier();\n'
              '    for (int index = 0; index < 4; ++index) {\n'
              "        controller.update(0.25, 7.0, 142.0, 100'000U, 4'096U, true);\n"
              '    }\n'
              '    require(controller.multiplier() >= first_boost\n'
              '            && controller.multiplier() <= 64.0,\n'
              '        "adaptive scroll grows discretely and remains bounded");\n'
              '    const double peak_boost = controller.multiplier();\n'
              '    for (int index = 0; index < 32; ++index) {\n'
              "        controller.update(0.25, 60.0, 16.4, 32U, 4'096U, true);\n"
              '    }\n'
              '    require(controller.multiplier() < peak_boost,\n'
              '        "adaptive scroll relaxes after 60 Hz recovery");\n'
              '    pulseforge::AdaptiveScrollController density_only;\n'
              "    density_only.update(0.25, 120.0, 8.3, 10'000U, 4'096U, true);\n"
              '    require(density_only.multiplier() > 1.0,\n'
              '        "on-screen logical density alone can raise visual speed");\n'
              "    controller.update(0.25, 60.0, 16.6, 32U, 4'096U, false);\n"
              '    require(std::abs(controller.multiplier() - 1.0) < 0.000001,\n'
              '        "disabled adaptation restores authored scroll speed");\n'
              '}\n'
          )
          tail = '\n}  // namespace\n\nint main() {\n'
          tests = once(tests, tail, fn + tail, 'test function')
          call = '        const TemporaryDirectory directory;\n'
          tests = once(tests, call,
              call + '        test_adaptive_scroll_controller();\n',
              'test invocation')
          test_path.write_text(tests, encoding='utf-8')

          Path('.github/workflows/tmp-adaptive-onscreen-patch.yml').unlink()
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/application.cpp tests/streaming_gameplay_test.cpp .github/workflows/tmp-adaptive-onscreen-patch.yml
          git commit -m 'perf(runtime): materialize giant charts by viewport pressure'
          git push origin HEAD:perf/onscreen-streaming-adaptive-scroll-20260912
