name: PulseForge Complete direct engine runtimes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-complete-runtimes.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pulseforge-complete-direct-runtimes
  cancel-in-progress: false

env:
  RELEASE_TAG: 'v1.0.0-complete-runtimes'
  RELEASE_TITLE: 'PulseForge 1.0.0 Complete Runtimes'
  PACKAGE_VERSION: '1.0.0-complete-runtimes'
  GDOWN_VERSION: '6.2.0'

jobs:
  runtime-manifest:
    name: Generate Complete startup manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false

      - name: Generate Drive-backed Complete runtime manifest
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/pulseforge-gdown"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --retries 5 "gdown==$GDOWN_VERSION"
          mkdir -p "$RUNNER_TEMP/complete-runtime-manifest"
          manifest="$RUNNER_TEMP/complete-runtime-manifest/complete-runtime-manifest.json"
          ok=0
          for attempt in 1 2 3; do
            if "$venv/bin/python" scripts/generate_complete_drive_runtime_manifest.py \
              --python "$venv/bin/python" \
              --source-commit "$GITHUB_SHA" \
              --output "$manifest"; then
              ok=1
              break
            fi
            echo "Runtime manifest generation attempt $attempt failed; retrying." >&2
            sleep $((attempt * 15))
          done
          (( ok == 1 ))
          jq -e '.schema_version == 1 and .edition == "1.0.0-complete" and .mod_count == 30 and (.mods | length) == 30' "$manifest" >/dev/null
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/complete-runtime-manifest/PULSEFORGE_SOURCE_SHA.txt"

      - name: Upload small runtime manifest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-runtime-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/complete-runtime-manifest/
          if-no-files-found: error
          retention-days: 7

  windows-x64:
    name: Build direct Windows runtime
    needs: runtime-manifest
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false

      - name: Hydrate engine assets and build dependencies only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git lfs install --local
          git lfs pull --include="assets/**,tools/**,third_party/**" --exclude="mods/**"
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "complete-runtime-manifest-$env:GITHUB_RUN_ID" --dir "$env:RUNNER_TEMP/runtime-manifest"
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/runtime-manifest/complete-runtime-manifest.json" -Destination "assets/complete-runtime-manifest.json" -Force

      - name: Build and package Windows engine
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --preset windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = "PulseForge-v$env:PACKAGE_VERSION-Windows-x86_64"
          $stage = Join-Path $env:RUNNER_TEMP $package
          $archive = "$stage.zip"
          $checksums = Join-Path $env:RUNNER_TEMP "$package.SHA256SUMS.txt"
          cmake --install out/build/msvc --config Release --prefix "$stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mods = Join-Path $stage 'bin/mods'
          if (Test-Path -LiteralPath $mods) { Remove-Item -LiteralPath $mods -Recurse -Force }
          $binary = Join-Path $stage 'bin/pulseforge.exe'
          $manifest = Join-Path $stage 'bin/assets/complete-runtime-manifest.json'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Missing $binary" }
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw "Missing $manifest" }
          if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          Compress-Archive -Path $stage -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content -LiteralPath $checksums -Encoding ascii
          "package=$package" >> $env:GITHUB_OUTPUT

      - name: Upload final Windows release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.package }}
          path: |
            ${{ runner.temp }}/${{ steps.package.outputs.package }}.zip
            ${{ runner.temp }}/${{ steps.package.outputs.package }}.SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  linux-x86_64:
    name: Build direct Linux runtime
    needs: runtime-manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config file git-lfs \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - name: Hydrate engine assets and runtime manifest only
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="assets/**,tools/**,third_party/**" --exclude="mods/**"
          mkdir -p "$RUNNER_TEMP/runtime-manifest"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "complete-runtime-manifest-$GITHUB_RUN_ID" --dir "$RUNNER_TEMP/runtime-manifest"
          cp "$RUNNER_TEMP/runtime-manifest/complete-runtime-manifest.json" assets/complete-runtime-manifest.json

      - name: Build and package Linux engine
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset linux-release
          cmake --build --preset linux-release --parallel 2
          package="PulseForge-v${PACKAGE_VERSION}-Linux-x86_64"
          stage="$RUNNER_TEMP/$package"
          archive="$RUNNER_TEMP/$package.tar.gz"
          cmake --install out/build/linux-release --prefix "$stage"
          rm -rf "$stage/bin/mods"
          test -x "$stage/bin/pulseforge"
          test -s "$stage/bin/assets/complete-runtime-manifest.json"
          ldd "$stage/bin/pulseforge" | tee "$RUNNER_TEMP/$package.ldd.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/$package.ldd.txt"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$package"
          ! tar -tzf "$archive" | grep -Eq '(^|/)mods(/|$)'
          (cd "$RUNNER_TEMP" && sha256sum "$package.tar.gz" > "$package.SHA256SUMS.txt")
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Upload final Linux release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.package }}
          path: |
            ${{ runner.temp }}/${{ steps.package.outputs.package }}.tar.gz
            ${{ runner.temp }}/${{ steps.package.outputs.package }}.SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Build direct macOS runtime / ${{ matrix.arch }}
    needs: runtime-manifest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false

      - name: Ensure tools and hydrate engine assets only
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          command -v git-lfs >/dev/null || brew install git-lfs
          git lfs install --local
          git lfs pull --include="assets/**,tools/**,third_party/**" --exclude="mods/**"
          mkdir -p "$RUNNER_TEMP/runtime-manifest"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "complete-runtime-manifest-$GITHUB_RUN_ID" --dir "$RUNNER_TEMP/runtime-manifest"
          cp "$RUNNER_TEMP/runtime-manifest/complete-runtime-manifest.json" assets/complete-runtime-manifest.json

      - name: Build and package macOS engine
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset macos-release -DCMAKE_OSX_ARCHITECTURES='${{ matrix.arch }}'
          cmake --build --preset macos-release --parallel 2
          package="PulseForge-v${PACKAGE_VERSION}-macOS-${{ matrix.arch }}"
          stage="$RUNNER_TEMP/$package"
          archive="$RUNNER_TEMP/$package.tar.gz"
          cmake --install out/build/macos-release --prefix "$stage"
          rm -rf "$stage/bin/mods"
          test -s "$stage/bin/assets/complete-runtime-manifest.json"
          app="$stage/PulseForge.app"
          test -d "$app/Contents/MacOS"
          test -f "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/pulseforge"
          rm -rf "$app/Contents/MacOS/assets" "$app/Contents/MacOS/mods"
          cp -a assets "$app/Contents/MacOS/assets"
          test -s "$app/Contents/MacOS/assets/complete-runtime-manifest.json"
          codesign --deep --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/pulseforge" | tee "$RUNNER_TEMP/$package.arch.txt"
          grep -qx '${{ matrix.arch }}' "$RUNNER_TEMP/$package.arch.txt"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$package"
          ! tar -tzf "$archive" | grep -Eq '(^|/)mods(/|$)'
          (cd "$RUNNER_TEMP" && shasum -a 256 "$package.tar.gz" > "$package.SHA256SUMS.txt")
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Upload final macOS release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.package }}
          path: |
            ${{ runner.temp }}/${{ steps.package.outputs.package }}.tar.gz
            ${{ runner.temp }}/${{ steps.package.outputs.package }}.SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  android-arm64:
    name: Build direct installable Android APK
    needs: runtime-manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Hydrate Android engine assets without mods
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="assets/**,third_party/**" --exclude="mods/**"
          mkdir -p "$RUNNER_TEMP/runtime-manifest"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "complete-runtime-manifest-$GITHUB_RUN_ID" --dir "$RUNNER_TEMP/runtime-manifest"
          cp "$RUNNER_TEMP/runtime-manifest/complete-runtime-manifest.json" assets/complete-runtime-manifest.json

      - name: Build, align, test-sign and verify final APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.31.6'
          chmod +x platform/android/gradlew
          cd platform/android
          gradle_ok=0
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --stacktrace \
              -PPULSEFORGE_ANDROID_BUILD_ROOT="$RUNNER_TEMP/pulseforge-android" \
              :app:assembleRelease; then
              gradle_ok=1
              break
            fi
            echo "Gradle attempt $attempt failed; retrying." >&2
            rm -rf "$HOME/.gradle/wrapper/dists/gradle-9.6.0-bin" || true
            sleep $((attempt * 10))
          done
          (( gradle_ok == 1 ))
          cd "$GITHUB_WORKSPACE"
          package="PulseForge-v${PACKAGE_VERSION}-Android-arm64-test-signed"
          unsigned="$RUNNER_TEMP/pulseforge-android/gradle/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/$package-aligned.apk"
          signed="$RUNNER_TEMP/$package.apk"
          keystore="$RUNNER_TEMP/pulseforge-ci-test.jks"
          test -f "$unsigned"
          keytool -genkeypair -noprompt -keystore "$keystore" \
            -storepass android -keypass android -alias pulseforge-ci \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname 'CN=PulseForge CI Test Build,OU=CI,O=PulseForge,C=PT'
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -P 16 -f 4 "$unsigned" "$aligned"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" --ks-key-alias pulseforge-ci \
            --ks-pass pass:android --key-pass pass:android \
            --out "$signed" "$aligned"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$signed" > "$RUNNER_TEMP/$package.signature.txt"
          unzip -l "$signed" > "$RUNNER_TEMP/$package.contents.txt"
          grep -q 'lib/arm64-v8a/libmain.so' "$RUNNER_TEMP/$package.contents.txt"
          grep -q 'lib/arm64-v8a/libSDL3.so' "$RUNNER_TEMP/$package.contents.txt"
          grep -q 'assets/pulseforge/assets/complete-runtime-manifest.json' "$RUNNER_TEMP/$package.contents.txt"
          ! grep -Eq '(^|[ /])mods/' "$RUNNER_TEMP/$package.contents.txt"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$signed" > "$RUNNER_TEMP/$package.badging.txt"
          grep -q "package: name='org.pulseforge.engine'.*versionCode='100000'.*versionName='1.0.0'" "$RUNNER_TEMP/$package.badging.txt"
          (cd "$RUNNER_TEMP" && sha256sum "$package.apk" > "$package.SHA256SUMS.txt")
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Upload the final APK itself
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.package }}
          path: |
            ${{ runner.temp }}/${{ steps.package.outputs.package }}.apk
            ${{ runner.temp }}/${{ steps.package.outputs.package }}.SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish direct engine-only release
    needs: [runtime-manifest, windows-x64, linux-x86_64, macos, android-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download this run's final platform files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-assets"

      - name: Verify exact public asset set
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-assets"
          while IFS= read -r checksum; do
            (cd "$(dirname "$checksum")" && sha256sum -c "$(basename "$checksum")")
          done < <(find "$root" -type f -name '*.SHA256SUMS.txt' -print | sort)

          expected="$RUNNER_TEMP/expected-assets.txt"
          actual="$RUNNER_TEMP/actual-assets.txt"
          cat > "$expected" <<EOF
          PulseForge-v${PACKAGE_VERSION}-Android-arm64-test-signed.SHA256SUMS.txt
          PulseForge-v${PACKAGE_VERSION}-Android-arm64-test-signed.apk
          PulseForge-v${PACKAGE_VERSION}-Linux-x86_64.SHA256SUMS.txt
          PulseForge-v${PACKAGE_VERSION}-Linux-x86_64.tar.gz
          PulseForge-v${PACKAGE_VERSION}-Windows-x86_64.SHA256SUMS.txt
          PulseForge-v${PACKAGE_VERSION}-Windows-x86_64.zip
          PulseForge-v${PACKAGE_VERSION}-macOS-arm64.SHA256SUMS.txt
          PulseForge-v${PACKAGE_VERSION}-macOS-arm64.tar.gz
          PulseForge-v${PACKAGE_VERSION}-macOS-x86_64.SHA256SUMS.txt
          PulseForge-v${PACKAGE_VERSION}-macOS-x86_64.tar.gz
          EOF
          find "$root" -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' -o -name '*.SHA256SUMS.txt' \) -printf '%f\n' | sort > "$actual"
          diff -u "$expected" "$actual"
          ! grep -Eq '\.part-[0-9]{3}$' "$actual"
          test "$(wc -l < "$actual")" -eq 10
          find "$root" -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' -o -name '*.SHA256SUMS.txt' \) -print | sort > "$RUNNER_TEMP/public-assets.paths"

      - name: Publish release with installables already formed
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="$RELEASE_TAG"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          # PulseForge Complete — direct engine runtimes

          This release contains the current PulseForge engine for Windows, Linux, macOS and Android, built from commit \`$GITHUB_SHA\`.

          **No mods are bundled in these downloads.** The Complete startup screen and the current engine fixes are included. The small runtime manifest is bundled so, when Complete content is missing or outdated, PulseForge can offer the existing Drive-backed download flow.

          Android is delivered directly as an installable, aligned and test-signed **APK**. No second build, reconstruction command or archive-joining step is required after CI finishes.
          EOF

          mapfile -t assets < "$RUNNER_TEMP/public-assets.paths"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Release $tag already points to $tag_sha, refusing to move it to $GITHUB_SHA." >&2
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --repo "$repo" --clobber
            release_id="$(gh api "repos/$repo/releases/tags/$tag" --jq '.id')"
            gh api --method PATCH "repos/$repo/releases/$release_id" \
              -f name="$RELEASE_TITLE" -f body="$(cat "$notes")" -F prerelease=false >/dev/null
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$repo" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$notes"
          fi

          release_id="$(gh api "repos/$repo/releases/tags/$tag" --jq '.id')"
          test "$(gh api "repos/$repo/releases/$release_id" --jq '.prerelease')" = false
          gh api "repos/$repo/releases/$release_id/assets?per_page=100" --paginate --jq '.[].name' | sort > "$RUNNER_TEMP/published-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/published-assets.txt"
          echo "Published $tag with five direct engine runtimes and no mod payloads."
