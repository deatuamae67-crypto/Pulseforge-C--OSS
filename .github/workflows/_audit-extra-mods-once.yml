name: Audit extra runnable mods once

on:
  push:
    branches:
      - release/v1.0.0-final
    paths:
      - '.github/workflows/_audit-extra-mods-once.yml'

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: taimuresu-spam-amplified
            folder_id: 14MFlkrbN6sRJwnqSTwMobRJ5NVoc_VHK
          - slug: charts-feitos-no-flp
            folder_id: 1Z-g_itHvEMiPnP7XB4Z9Adhu6G4S-Xnp
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install Drive downloader
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir gdown==5.2.0

      - name: Download public mod folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mod"
          gdown --folder 'https://drive.google.com/drive/folders/${{ matrix.folder_id }}' \
            -O "$RUNNER_TEMP/mod" --remaining-ok
          test -n "$(find "$RUNNER_TEMP/mod" -type f -print -quit)"

      - name: Compute deterministic inventory
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          FOLDER_ID: ${{ matrix.folder_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'mod'
          files = sorted(
              (p for p in root.rglob('*') if p.is_file()),
              key=lambda p: p.relative_to(root).as_posix(),
          )
          rows = ''.join(
              f"{p.relative_to(root).as_posix()}\t{p.stat().st_size}\n"
              for p in files
          )
          total = sum(p.stat().st_size for p in files)
          report = {
              'slug': os.environ['SLUG'],
              'drive_folder_id': os.environ['FOLDER_ID'],
              'file_count': len(files),
              'unpacked_bytes': total,
              'path_size_inventory_sha256': hashlib.sha256(rows.encode()).hexdigest(),
          }
          out = Path(os.environ['RUNNER_TEMP']) / f"{os.environ['SLUG']}.json"
          out.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Upload audit result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extra-mod-audit-${{ matrix.slug }}
          path: ${{ runner.temp }}/${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 7
