name: Temporary extreme-scale regression fix

on:
  push:
    branches:
      - feat/unbounded-chart-scale-20260911

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unbounded-chart-scale-20260911
          fetch-depth: 0
      - name: Apply regression fixes
        run: python3 .github/scripts/tmp_fix_extreme_scale_tests.py
      - name: Commit only intended source/test changes
        run: |
          rm -f .github/workflows/tmp-fix-extreme-scale-tests.yml
          rm -f .github/scripts/tmp_fix_extreme_scale_tests.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_main.cpp src/editor/chart_editor.cpp
          git add -u .github/workflows/tmp-fix-extreme-scale-tests.yml .github/scripts/tmp_fix_extreme_scale_tests.py
          git commit -m "test(core): align regressions with extreme chart scaling"
          git push origin HEAD:feat/unbounded-chart-scale-20260911
