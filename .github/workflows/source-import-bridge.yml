name: PulseForge source import bridge

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  import-source:
    if: ${{ github.event.issue.title == '[source-import-fast] PulseForge 0.9.7' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: import/pulseforge-0.9.7-oss
          fetch-depth: 0

      - name: Download source folders from DevCore
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'gdown>=5.2,<6'
          rm -rf /tmp/pf-source
          mkdir -p /tmp/pf-source/{include,src,android,tools}

          gdown --folder --remaining-ok \
            'https://drive.google.com/drive/folders/1bGtwum34lRz9jyeYdxWMu8wdjC0NHPJr' \
            -O /tmp/pf-source/include
          gdown --folder --remaining-ok \
            'https://drive.google.com/drive/folders/1AZ0jiUc1m0jOoqoUncTJePog4mtUYLMn' \
            -O /tmp/pf-source/src
          gdown --folder --remaining-ok \
            'https://drive.google.com/drive/folders/17cXFrFe_QgA9t7hPDGgvPHnzF_bqW_L2' \
            -O /tmp/pf-source/android
          gdown --folder --remaining-ok \
            'https://drive.google.com/drive/folders/1ftEhuAnsiLy508YJNek_QOfZgEq-mDxL' \
            -O /tmp/pf-source/tools
          gdown \
            'https://drive.google.com/uc?id=1s21BIDkof22sneMCz1TCm9gTCl0ZaHdz' \
            -O /tmp/pf-source/CMakeLists.txt

      - name: Stage and validate source tree
        shell: bash
        run: |
          set -euo pipefail

          INC=/tmp/pf-source/include
          SRC=/tmp/pf-source/src
          ANDROID=/tmp/pf-source/android
          TOOLS=/tmp/pf-source/tools

          [ -d "$INC/pulseforge" ] || INC="$INC/include"
          [ -f "$SRC/app/application.cpp" ] || SRC="$SRC/src"
          [ -f "$ANDROID/app/build.gradle" ] || ANDROID="$ANDROID/android"
          [ -f "$TOOLS/autochart/ml_backend.py" ] || TOOLS="$TOOLS/tools"

          test -f "$INC/pulseforge/application.hpp"
          test -f "$SRC/app/application.cpp"
          test -f "$SRC/io/chart_loader.cpp"
          test -f "$ANDROID/app/build.gradle"
          test -f "$ANDROID/app/src/main/AndroidManifest.xml"
          test -f "$TOOLS/autochart/ml_backend.py"
          grep -Eq 'VERSION[[:space:]]+0\.9\.7' /tmp/pf-source/CMakeLists.txt

          rm -rf include src platform/android tools
          mkdir -p include src platform/android tools
          cp -a "$INC"/. ./include/
          cp -a "$SRC"/. ./src/
          cp -a "$ANDROID"/. ./platform/android/
          cp -a "$TOOLS"/. ./tools/
          cp /tmp/pf-source/CMakeLists.txt ./CMakeLists.txt

          # Keep public source only: no local builds, backups, keys or proprietary SDK packages.
          find include src platform/android tools -type f \
            \( -name '*.pre_*' -o -name '*.premerge' -o -name '*.bak' -o -name '*~' \
               -o -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.aar' \
               -o -name '*.apk' -o -name '*.aab' -o -name '*.so' -o -name '*.dll' \
               -o -name '*.dylib' -o -name '*.exe' \) -delete
          find include src platform/android tools -type d \
            \( -name build -o -name out -o -name .gradle -o -name __pycache__ \
               -o -name node_modules -o -name CMakeFiles \) -prune -exec rm -rf {} + || true
          rm -rf third_party/discord_social_sdk platform/android/app/libs

          test -f include/pulseforge/application.hpp
          test -f src/app/application.cpp
          test -f src/io/chart_loader.cpp
          test -f platform/android/app/build.gradle
          test -f platform/android/app/src/main/AndroidManifest.xml
          test -f tools/autochart/ml_backend.py

          find include src platform/android tools -type f | sort | tee /tmp/source-files.txt
          count="$(wc -l < /tmp/source-files.txt)"
          bytes="$(du -sb include src platform/android tools | awk '{s += $1} END {print s}')"
          echo "Source files: $count"
          echo "Source bytes: $bytes"
          test "$count" -ge 120
          test "$bytes" -ge 3000000

      - name: Commit source code to import branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt include src platform/android tools
          if git diff --cached --quiet; then
            echo 'Source tree is already current.'
            exit 0
          fi
          git commit -m 'source: import PulseForge 0.9.7 engine'
          git push origin HEAD:import/pulseforge-0.9.7-oss
