name: Temporary PR 156 compile fix

on:
  push:
    branches:
      - fix/extreme-charts-menu-music-notetypes-20260911

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale raw-entry reserve reference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/io/fast_psych_loader.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''        state.chart = make_chart(
              metadata,
              denpa_schema,
              difficulty,
              metadata.raw_section_entries
          );'''
          new = '''        state.chart = make_chart(
              metadata,
              denpa_schema,
              difficulty,
              std::size_t{}
          );'''
          if text.count(old) != 1:
              raise SystemExit('expected stale raw_section_entries call exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/tmp-fix-pr156-compile.yml').unlink()
          PY
          ! grep -Fq 'metadata.raw_section_entries' src/io/fast_psych_loader.cpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(io): remove stale raw-entry reserve reference'
          git push origin HEAD:fix/extreme-charts-menu-music-notetypes-20260911
