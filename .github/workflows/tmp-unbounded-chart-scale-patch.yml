name: Temporary unbounded chart scale patch

on:
  push:
    branches:
      - feat/unbounded-chart-scale-20260911

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unbounded-chart-scale-20260911
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/tmp_unbounded_chart_patch.py
      - name: Commit patch
        run: |
          rm -f .github/workflows/tmp-unbounded-chart-scale-patch.yml
          rm -f .github/scripts/tmp_unbounded_chart_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(core): remove chart-wide safety ceilings"
          git push origin HEAD:feat/unbounded-chart-scale-20260911
