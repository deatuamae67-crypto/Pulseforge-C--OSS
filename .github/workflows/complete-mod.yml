name: PulseForge Complete descriptor validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/complete/mods/*.json'

permissions:
  contents: read

jobs:
  validate-one-descriptor:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source with comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require one valid provenance descriptor
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          mapfile -t changed < <(git diff --name-only "$base" "$head" -- 'docs/complete/mods/*.json')
          mapfile -t added < <(git diff --name-only --diff-filter=A "$base" "$head" -- 'docs/complete/mods/*.json')
          if (( ${#changed[@]} != 1 || ${#added[@]} != 1 )) || [[ "${changed[0]}" != "${added[0]}" ]]; then
            echo 'A descriptor PR must add exactly one docs/complete/mods/*.json provenance record.' >&2
            exit 1
          fi
          spec="${added[0]}"
          jq -e '
            .schema_version == 1
            and .edition == "1.0.0-complete"
            and (.name | type == "string" and length > 0)
            and (.slug | type == "string" and test("^[a-z0-9][a-z0-9-]*$"))
            and (.drive_id | type == "string" and length > 10)
            and (.min_files | type == "number" and . >= 1)
            and (.min_bytes | type == "number" and . >= 1)
            and (.enabled_by_default | type == "boolean")
          ' "$spec" >/dev/null
          expected="docs/complete/mods/$(jq -r '.slug' "$spec").json"
          [[ "$spec" == "$expected" ]]
          [[ "$(jq -r '.name' "$spec")" != '.autochart-staging' ]]
          echo 'Descriptor is valid provenance metadata. Runtime content is versioned under mods/ and assets/menu/.'
