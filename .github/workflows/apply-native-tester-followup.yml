name: Apply native tester follow-up

on:
  push:
    branches:
      - fix/tester-notetypes-volume-android-assets
    paths:
      - 'scripts/apply_native_tester_followup.py'
      - '.github/workflows/apply-native-tester-followup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/tester-notetypes-volume-android-assets
          fetch-depth: 2

      - name: Apply exact source patches
        run: python3 scripts/apply_native_tester_followup.py

      - name: Validate patched source invariants
        run: |
          set -euo pipefail
          python3 scripts/complete_runtime_transport_selftest.py
          python3 -m py_compile scripts/complete_runtime_transport_selftest.py
          bash -n scripts/complete_release_package.sh
          grep -Fq 'constexpr std::array<std::string_view, 11U> builtin_ids' src/core/note_types.cpp
          grep -Fq 'SDL_GetPreferredLocales' src/app/system_locale.hpp
          grep -Fq 'A  IMPORT AUDIO' src/app/editor_ui.cpp
          grep -Fq 'PulseForge native' include/pulseforge/note_skin_catalog.hpp

      - name: Commit final patch and remove one-shot machinery
        run: |
          set -euo pipefail
          rm -f scripts/apply_native_tester_followup.py .github/workflows/apply-native-tester-followup.yml
          git config user.name 'PulseForge CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Make note content native, localize installer, and expose audio import'
          git push origin HEAD:fix/tester-notetypes-volume-android-assets
