name: PulseForge tests import bridge

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  import-tests:
    if: ${{ startsWith(github.event.issue.title, '[tests-import] PulseForge 0.9.7') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: import/pulseforge-0.9.7-oss
          fetch-depth: 0

      - name: Download test source from public DevCore
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'gdown>=6,<7'
          rm -rf /tmp/pf-tests
          mkdir -p /tmp/pf-tests

          cat > /tmp/pf_download_tests.py <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import sys
          import time
          import urllib.parse

          folder_url = sys.argv[1]
          output_root = pathlib.Path(sys.argv[2])
          output_root.mkdir(parents=True, exist_ok=True)

          listing = subprocess.run(
              ['gdown', '--folder', '--json', folder_url],
              check=True,
              capture_output=True,
              text=True,
          )
          entries = json.loads(listing.stdout)

          allowed_suffixes = {'.c', '.cc', '.cpp', '.cxx', '.h', '.hh', '.hpp', '.hxx'}

          def excluded(path: pathlib.PurePosixPath) -> bool:
              name = path.name.lower()
              if '.pre_' in name or name.endswith('.premerge'):
                  return True
              if name.endswith('.bak') or name.endswith('~') or 'backup' in name:
                  return True
              if path.suffix.lower() not in allowed_suffixes:
                  return True
              return False

          def drive_id(url: str) -> str:
              parsed = urllib.parse.urlparse(url)
              query_id = urllib.parse.parse_qs(parsed.query).get('id')
              if query_id:
                  return query_id[0]
              match = re.search(r'/d/([A-Za-z0-9_-]+)', parsed.path)
              if match:
                  return match.group(1)
              if re.fullmatch(r'[A-Za-z0-9_-]{10,}', url):
                  return url
              raise ValueError(f'Could not extract Drive id from {url!r}')

          def looks_like_html(path: pathlib.Path) -> bool:
              prefix = path.read_bytes()[:512].lstrip().lower()
              return prefix.startswith(b'<!doctype html') or prefix.startswith(b'<html')

          failures = []
          kept = 0
          for entry in entries:
              rel = pathlib.PurePosixPath(entry['path'])
              if excluded(rel):
                  print(f'SKIP {rel}')
                  continue

              file_id = drive_id(entry['url'])
              destination = output_root.joinpath(*rel.parts)
              destination.parent.mkdir(parents=True, exist_ok=True)
              temporary = pathlib.Path(str(destination) + '.part')
              direct_url = (
                  'https://drive.usercontent.google.com/download'
                  f'?id={file_id}&export=download&confirm=t'
              )

              ok = False
              for attempt in range(1, 4):
                  temporary.unlink(missing_ok=True)
                  curl = subprocess.run([
                      'curl', '--fail', '--location', '--silent', '--show-error',
                      '--retry', '3', '--retry-delay', '2', '--retry-all-errors',
                      '--connect-timeout', '20', '--max-time', '120',
                      direct_url, '-o', str(temporary),
                  ])
                  if curl.returncode == 0 and temporary.is_file() and temporary.stat().st_size > 0 and not looks_like_html(temporary):
                      ok = True
                      break
                  temporary.unlink(missing_ok=True)
                  fallback = subprocess.run([
                      'gdown', '--quiet', '--continue', file_id,
                      '-O', str(temporary),
                  ])
                  if fallback.returncode == 0 and temporary.is_file() and temporary.stat().st_size > 0 and not looks_like_html(temporary):
                      ok = True
                      break
                  time.sleep(attempt * 3)

              if not ok:
                  failures.append((file_id, str(rel)))
                  continue
              temporary.replace(destination)
              kept += 1
              print(f'OK {file_id} {rel} ({destination.stat().st_size} bytes)')
              time.sleep(0.1)

          print(f'Downloaded {kept} test source files')
          if failures:
              for file_id, rel in failures:
                  print(f'FAILED {file_id} {rel}', file=sys.stderr)
              raise SystemExit(2)
          PY

          python /tmp/pf_download_tests.py \
            'https://drive.google.com/drive/folders/1_ZEUGBnLVkR9-ATlwjxspre1y_WzXL1-' \
            /tmp/pf-tests

      - name: Stage and validate tests
        shell: bash
        run: |
          set -euo pipefail
          TESTS=/tmp/pf-tests
          [ -f "$TESTS/test_main.cpp" ] || TESTS="$TESTS/tests"

          test -f "$TESTS/test_main.cpp"
          test -f "$TESTS/runtime_telemetry_test.cpp"
          test -f "$TESTS/discord_presence_test.cpp"

          rm -rf tests
          mkdir -p tests
          cp -a "$TESTS"/. ./tests/

          if find tests -type f ! \( \
              -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' -o \
              -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' \
            \) -print -quit | grep -q .; then
            echo 'Unexpected non-source test file detected.' >&2
            exit 1
          fi

          count="$(find tests -type f | wc -l)"
          bytes="$(du -sb tests | awk '{print $1}')"
          echo "Test source files: $count"
          echo "Test source bytes: $bytes"
          test "$count" -ge 3
          test "$bytes" -ge 1000

      - name: Commit tests to import branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          if git diff --cached --quiet; then
            echo 'Test sources are already current.'
            exit 0
          fi
          git commit -m 'tests: import PulseForge 0.9.7 deterministic tests'
          git push origin HEAD:import/pulseforge-0.9.7-oss
