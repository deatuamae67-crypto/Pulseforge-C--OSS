name: One-shot macOS signing order fix

on:
  push:
    branches:
      - feat/discord-macos-framework
    paths:
      - .github/workflows/one-shot-codesign-order-fix.yml

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/discord-macos-framework
          fetch-depth: 0

      - name: Replace brittle deep signing with explicit inside-out signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/macos-discord-framework-validation.yml')
          text = path.read_text()
          old = '''          codesign --force --deep --sign - "$app"\n          codesign --verify --deep --strict --verbose=2 "$app"\n'''
          new = '''          # Sign nested code inside-out. `codesign --deep --sign` is intentionally\n          # avoided because it can misclassify synthetic versioned frameworks;\n          # production signing likewise signs nested code before the containing app.\n          embedded="$app/Contents/Frameworks/discord_partner_sdk.framework"\n          codesign --force --sign - \\\n            "$embedded/Versions/A/Frameworks/libdiscord_krisp.dylib"\n          codesign --force --sign - \\\n            "$embedded/Versions/A/discord_partner_sdk"\n          codesign --force --sign - "$app"\n          codesign --verify --strict --verbose=2 \\\n            "$embedded/Versions/A/Frameworks/libdiscord_krisp.dylib"\n          codesign --verify --strict --verbose=2 \\\n            "$embedded/Versions/A/discord_partner_sdk"\n          codesign --verify --strict --verbose=2 "$app"\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one signing block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-codesign-order-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/macos-discord-framework-validation.yml \
            .github/workflows/one-shot-codesign-order-fix.yml
          git diff --cached --check
          git commit -m 'ci: sign macOS framework fixture inside-out'
          git push origin HEAD:feat/discord-macos-framework
