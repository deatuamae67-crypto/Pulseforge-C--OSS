name: Finalize optional private-media regressions once

on:
  push:
    branches:
      - release/v1.0.0-final
    paths:
      - '.github/workflows/_finalize-optional-media-tests.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/v1.0.0-final
          fetch-depth: 1

      - name: Make licensed media probes optional and commit locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          audio = Path('tests/audio_transport_test.cpp')
          text = audio.read_text(encoding='utf-8')
          old = '        if (argument_count == 2) {\n'
          new = ('        if (argument_count == 2\n'
                 '            && std::filesystem::is_regular_file(arguments[1])) {\n')
          if old not in text:
              raise SystemExit('audio media-probe anchor not found')
          audio.write_text(text.replace(old, new, 1), encoding='utf-8')

          intro = Path('tests/intro_player_test.cpp')
          text = intro.read_text(encoding='utf-8')
          old = '        const bool decoded_probe = argument_count == 2;\n'
          new = ('        const bool decoded_probe = argument_count == 2\n'
                 '            && std::filesystem::is_regular_file(arguments[1]);\n')
          if old not in text:
              raise SystemExit('intro media-probe anchor not found')
          intro.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/audio_transport_test.cpp tests/intro_player_test.cpp
          git diff --cached --quiet && { echo 'No media-fallback changes produced.' >&2; exit 1; }
          git commit -m 'test(media): keep private media probes optional in OSS checkouts'
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - name: Compile and run clean-OSS media regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_COMMIT"
          cmake --preset linux-release \
            -DPULSEFORGE_BUILD_TESTS=ON \
            -DPULSEFORGE_BUILD_AUTOCHART=OFF \
            -DPULSEFORGE_ENABLE_DISCORD_SOCIAL_SDK=OFF
          cmake --build --preset linux-release --target \
            pulseforge_audio_transport_tests pulseforge_intro_tests --parallel 2
          ctest --test-dir out/build/linux-release \
            -R '^(pulseforge\.audio_transport|pulseforge\.intro|pulseforge\.intro_decoded)$' \
            --output-on-failure --no-tests=error
          test "$(git rev-parse HEAD)" = "$VALIDATED_COMMIT"

      - name: Push tested commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_COMMIT"
          git push origin HEAD:release/v1.0.0-final
