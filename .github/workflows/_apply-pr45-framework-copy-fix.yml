name: Apply PR45 production CMake fix

on:
  push:
    branches:
      - feat/discord-macos-framework
    paths:
      - .github/workflows/_apply-pr45-framework-copy-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/discord-macos-framework
          fetch-depth: 0

      - name: Patch production framework staging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("CMakeLists.txt")
          text = path.read_text()
          old = "\n".join([
              '            COMMAND ${CMAKE_COMMAND} -E copy_directory',
              '                "${_pulseforge_discord_framework}"',
              '                "$<TARGET_BUNDLE_CONTENT_DIR:pulseforge>/Frameworks/discord_partner_sdk.framework"',
          ]) + "\n"
          new = "\n".join([
              '            COMMAND ${CMAKE_COMMAND} -E rm -rf',
              '                "$<TARGET_BUNDLE_CONTENT_DIR:pulseforge>/Frameworks/discord_partner_sdk.framework"',
              '            COMMAND /usr/bin/ditto',
              '                "${_pulseforge_discord_framework}"',
              '                "$<TARGET_BUNDLE_CONTENT_DIR:pulseforge>/Frameworks/discord_partner_sdk.framework"',
          ]) + "\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one production framework copy block, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          grep -n -A5 -B3 '/usr/bin/ditto' CMakeLists.txt

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "fix: preserve macOS Discord framework symlinks"
          git push origin HEAD:feat/discord-macos-framework
