name: Bootstrap Discord release hydration integration

on:
  push:
    branches: [feat/discord-release-hydration-v2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/discord-release-hydration-v2
          fetch-depth: 1

      - name: Integrate optional private SDK hydration into release workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release-artifacts.yml')
          text = path.read_text(encoding='utf-8')

          def once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          secret_expr = '$' + '{{ secrets.PULSEFORGE_DISCORD_SDK_ARCHIVE_URL }}'

          once(
              "  windows-x64:\n    runs-on: windows-2022\n    timeout-minutes: 90\n    steps:\n      - name: Checkout source\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n",
              "  windows-x64:\n    runs-on: windows-2022\n    timeout-minutes: 90\n    env:\n      PULSEFORGE_DISCORD_SDK_ARCHIVE_URL: " + secret_expr + "\n    steps:\n      - name: Checkout source\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n      - name: Hydrate private Discord Social SDK when configured\n        if: env.PULSEFORGE_DISCORD_SDK_ARCHIVE_URL != ''\n        shell: pwsh\n        run: |\n          ./scripts/prepare-discord-release-sdk.ps1\n",
          )
          once(
              "          cmake --preset windows-msvc\n",
              "          $requireDiscord = if ([string]::IsNullOrWhiteSpace($env:PULSEFORGE_DISCORD_SDK_ARCHIVE_URL)) { 'OFF' } else { 'ON' }\n          cmake --preset windows-msvc \"-DPULSEFORGE_REQUIRE_DISCORD_SOCIAL_SDK=$requireDiscord\"\n",
          )
          once(
              "          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw \"Missing $binary\" }\n",
              "          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw \"Missing $binary\" }\n          if (-not [string]::IsNullOrWhiteSpace($env:PULSEFORGE_DISCORD_SDK_ARCHIVE_URL)) {\n            $discordRuntime = Join-Path $stage 'bin/discord_partner_sdk.dll'\n            if (-not (Test-Path -LiteralPath $discordRuntime -PathType Leaf)) { throw \"Missing $discordRuntime\" }\n          }\n",
          )

          once(
              "  linux-x86_64:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 90\n    steps:\n      - name: Checkout source\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n",
              "  linux-x86_64:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 90\n    env:\n      PULSEFORGE_DISCORD_SDK_ARCHIVE_URL: " + secret_expr + "\n    steps:\n      - name: Checkout source\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n      - name: Hydrate private Discord Social SDK when configured\n        if: env.PULSEFORGE_DISCORD_SDK_ARCHIVE_URL != ''\n        shell: bash\n        run: |\n          set -euo pipefail\n          bash scripts/prepare-discord-release-sdk.sh\n",
          )
          once(
              "          cmake --preset linux-release\n",
              "          require_discord=OFF\n          [[ -z \"${PULSEFORGE_DISCORD_SDK_ARCHIVE_URL:-}\" ]] || require_discord=ON\n          cmake --preset linux-release -DPULSEFORGE_REQUIRE_DISCORD_SOCIAL_SDK=\"$require_discord\"\n",
          )
          once(
              "          test -x \"$stage/bin/pulseforge\"\n          ldd \"$stage/bin/pulseforge\"",
              "          test -x \"$stage/bin/pulseforge\"\n          if [[ -n \"${PULSEFORGE_DISCORD_SDK_ARCHIVE_URL:-}\" ]]; then\n            test -f \"$stage/bin/libdiscord_partner_sdk.so\"\n          fi\n          ldd \"$stage/bin/pulseforge\"",
          )

          once(
              "    runs-on: ${{ matrix.runner }}\n    timeout-minutes: 90\n    steps:\n      - name: Checkout source\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n      - name: Ensure build tools\n",
              "    runs-on: ${{ matrix.runner }}\n    timeout-minutes: 90\n    env:\n      PULSEFORGE_DISCORD_SDK_ARCHIVE_URL: " + secret_expr + "\n    steps:\n      - name: Checkout source\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n      - name: Hydrate private Discord Social SDK when configured\n        if: env.PULSEFORGE_DISCORD_SDK_ARCHIVE_URL != ''\n        shell: bash\n        run: |\n          set -euo pipefail\n          bash scripts/prepare-discord-release-sdk.sh\n      - name: Ensure build tools\n",
          )
          once(
              "          cmake --preset macos-release -DCMAKE_OSX_ARCHITECTURES='${{ matrix.arch }}'\n",
              "          require_discord=OFF\n          [[ -z \"${PULSEFORGE_DISCORD_SDK_ARCHIVE_URL:-}\" ]] || require_discord=ON\n          cmake --preset macos-release -DCMAKE_OSX_ARCHITECTURES='${{ matrix.arch }}' -DPULSEFORGE_REQUIRE_DISCORD_SOCIAL_SDK=\"$require_discord\"\n",
          )
          once(
              "          test -f \"$app/Contents/Info.plist\"\n          codesign --deep",
              "          test -f \"$app/Contents/Info.plist\"\n          if [[ -n \"${PULSEFORGE_DISCORD_SDK_ARCHIVE_URL:-}\" ]]; then\n            framework=\"$app/Contents/Frameworks/discord_partner_sdk.framework\"\n            test -d \"$framework\"\n            test -f \"$framework/Versions/A/discord_partner_sdk\"\n          fi\n          codesign --deep",
          )

          once(
              "  android-arm64:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 90\n    steps:\n      - name: Checkout source\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n",
              "  android-arm64:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 90\n    env:\n      PULSEFORGE_DISCORD_SDK_ARCHIVE_URL: " + secret_expr + "\n    steps:\n      - name: Checkout source\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n      - name: Hydrate private Discord Social SDK when configured\n        if: env.PULSEFORGE_DISCORD_SDK_ARCHIVE_URL != ''\n        shell: bash\n        run: |\n          set -euo pipefail\n          bash scripts/prepare-discord-release-sdk.sh\n",
          )
          once(
              "            -PPULSEFORGE_ANDROID_BUILD_ROOT=\"$RUNNER_TEMP/pulseforge-android\" \\\n            :app:assembleRelease\n",
              "            -PPULSEFORGE_ANDROID_BUILD_ROOT=\"$RUNNER_TEMP/pulseforge-android\" \\\n            -PPULSEFORGE_DISCORD_APPLICATION_ID=1544144634832355429 \\\n            :app:assembleRelease\n",
          )
          once(
              "          grep -q 'lib/arm64-v8a/libSDL3.so' \"$RUNNER_TEMP/$package.contents.txt\"\n",
              "          grep -q 'lib/arm64-v8a/libSDL3.so' \"$RUNNER_TEMP/$package.contents.txt\"\n          if [[ -n \"${PULSEFORGE_DISCORD_SDK_ARCHIVE_URL:-}\" ]]; then\n            grep -q 'lib/arm64-v8a/libdiscord_partner_sdk.so' \"$RUNNER_TEMP/$package.contents.txt\"\n          fi\n",
          )

          path.write_text(text, encoding='utf-8')
          PY

          grep -Fq 'prepare-discord-release-sdk.ps1' .github/workflows/release-artifacts.yml
          test "$(grep -Fc 'prepare-discord-release-sdk.sh' .github/workflows/release-artifacts.yml)" -eq 3
          test "$(grep -Fc 'PULSEFORGE_REQUIRE_DISCORD_SOCIAL_SDK' .github/workflows/release-artifacts.yml)" -eq 3
          grep -Fq 'lib/arm64-v8a/libdiscord_partner_sdk.so' .github/workflows/release-artifacts.yml

      - name: Commit release integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PulseForge CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/release-artifacts.yml
          if git diff --cached --quiet; then
            echo 'Release hydration integration already present.'
            exit 0
          fi
          git commit -m 'Hydrate Discord SDK in release artifact builds'
          git push origin HEAD:feat/discord-release-hydration-v2
