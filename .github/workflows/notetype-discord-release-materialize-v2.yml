name: Native NoteType and Discord release materializer v2

on:
  push:
    branches:
      - fix/native-notetype-menu-discord-release

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[notetype-discord-materialized]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/native-notetype-menu-discord-release
          fetch-depth: 0

      - name: Apply source and release policy patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'include/pulseforge/note_types.hpp',
              '[[nodiscard]] std::span<const std::string_view> builtin_note_type_ids() noexcept;\n',
              '[[nodiscard]] std::span<const std::string_view> builtin_note_type_ids() noexcept;\n'
              '[[nodiscard]] std::span<const std::string_view> bundled_note_type_ids() noexcept;\n'
          )

          builtin_block = '''constexpr std::array<std::string_view, 8U> builtin_ids{
              "normal",
              "Alt Animation",
              "GF Sing",
              "Hurt Note",
              "Hey!",
              "No Animation",
              "Cross Fade",
              "GF Cross Fade",
          };
          '''
          bundled_block = builtin_block + '''
          // Engine-shipped compatibility types. They are native editor choices but
          // intentionally remain custom/overrideable in NoteTypeRegistry.
          constexpr std::array<std::string_view, 3U> bundled_ids{
              "the note",
              "3rd Player",
              "5th Player",
          };
          '''
          # Dedent the literal indentation introduced by this Python heredoc.
          import textwrap
          replace_once(
              'src/core/note_types.cpp',
              textwrap.dedent(builtin_block),
              textwrap.dedent(bundled_block),
          )

          replace_once(
              'src/core/note_types.cpp',
              'std::span<const std::string_view> builtin_note_type_ids() noexcept {\n'
              '    return builtin_ids;\n'
              '}\n',
              'std::span<const std::string_view> builtin_note_type_ids() noexcept {\n'
              '    return builtin_ids;\n'
              '}\n\n'
              'std::span<const std::string_view> bundled_note_type_ids() noexcept {\n'
              '    return bundled_ids;\n'
              '}\n'
          )

          replace_once(
              'src/app/editor_ui.cpp',
              '    for (const auto id : builtin_note_type_ids()) {\n'
              '        builtins.note_types.emplace_back(id);\n'
              '    }\n',
              '    for (const auto id : builtin_note_type_ids()) {\n'
              '        builtins.note_types.emplace_back(id);\n'
              '    }\n'
              '    for (const auto id : bundled_note_type_ids()) {\n'
              '        builtins.note_types.emplace_back(id);\n'
              '    }\n'
          )

          replace_once(
              'src/app/streaming_editor_ui.cpp',
              '    for (const auto id : builtin_note_type_ids()) {\n'
              '        choices.note_types.emplace_back(id);\n'
              '    }\n',
              '    for (const auto id : builtin_note_type_ids()) {\n'
              '        choices.note_types.emplace_back(id);\n'
              '    }\n'
              '    for (const auto id : bundled_note_type_ids()) {\n'
              '        choices.note_types.emplace_back(id);\n'
              '    }\n'
          )

          replace_once(
              'tests/note_types_test.cpp',
              '    require(ids.back() == "GF Cross Fade", "JS cross-fade built-in is exposed");\n',
              '    require(ids.back() == "GF Cross Fade", "JS cross-fade built-in is exposed");\n\n'
              '    const auto bundled = pulseforge::bundled_note_type_ids();\n'
              '    require(bundled.size() == 3U, "engine-bundled custom note types are exposed");\n'
              '    require(bundled[0] == "the note", "the note is a native editor choice");\n'
              '    require(bundled[1] == "3rd Player", "3rd Player is a native editor choice");\n'
              '    require(bundled[2] == "5th Player", "5th Player is a native editor choice");\n'
              '    require(registry.find("the note") == nullptr,\n'
              '            "bundled custom note types remain overrideable");\n'
          )

          workflow_path = Path('.github/workflows/complete-testing-draft.yml')
          workflow = workflow_path.read_text(encoding='utf-8')

          # Ensure changes to the hydration script run the release-contract validator.
          old = "      - 'platform/android/app/build.gradle'\n"
          if old not in workflow:
              raise SystemExit('PR path anchor missing')
          workflow = workflow.replace(
              old,
              old + "      - 'scripts/prepare-discord-release-sdk.sh'\n",
              1,
          )
          old = "      - 'scripts/complete_release_package.sh'\n"
          if old not in workflow:
              raise SystemExit('push path anchor missing')
          workflow = workflow.replace(
              old,
              old + "      - 'scripts/prepare-discord-release-sdk.sh'\n",
              1,
          )

          anchor = '          bash -n "$package"\n'
          if workflow.count(anchor) != 1:
              raise SystemExit('release validator anchor changed')
          workflow = workflow.replace(
              anchor,
              anchor
              + '          bash -n scripts/prepare-discord-release-sdk.sh\n'
              + "          grep -Fq 'PULSEFORGE_DISCORD_SDK_ARCHIVE_URL' \"$workflow\"\n"
              + "          grep -Fq 'PULSEFORGE_REQUIRE_DISCORD_SOCIAL_SDK=ON' \"$workflow\"\n",
              1,
          )

          inject_anchor = '      - name: Inject Complete runtime manifest into Android source assets\n'
          if workflow.count(inject_anchor) != 1:
              raise SystemExit('release SDK insertion anchor changed')
          sdk_step = '''      - name: Stage authorized Discord Social SDK for release
                  shell: bash
                  env:
                    PULSEFORGE_DISCORD_SDK_ARCHIVE_URL: ${{ secrets.PULSEFORGE_DISCORD_SDK_ARCHIVE_URL }}
                  run: |
                    set -euo pipefail
                    bash scripts/prepare-discord-release-sdk.sh

          '''
          workflow = workflow.replace(
              inject_anchor,
              textwrap.dedent(sdk_step) + inject_anchor,
              1,
          )

          for old, new in (
              ('          cmake --preset windows-msvc\n',
               '          cmake --preset windows-msvc -DPULSEFORGE_REQUIRE_DISCORD_SOCIAL_SDK=ON\n'),
              ('          cmake --preset linux-release\n',
               '          cmake --preset linux-release -DPULSEFORGE_REQUIRE_DISCORD_SOCIAL_SDK=ON\n'),
              ("          cmake --preset macos-release -DCMAKE_OSX_ARCHITECTURES='${{ matrix.arch }}'\n",
               "          cmake --preset macos-release -DCMAKE_OSX_ARCHITECTURES='${{ matrix.arch }}' -DPULSEFORGE_REQUIRE_DISCORD_SOCIAL_SDK=ON\n"),
          ):
              if workflow.count(old) != 1:
                  raise SystemExit(f'CMake release anchor changed: {old!r}')
              workflow = workflow.replace(old, new, 1)

          workflow_path.write_text(workflow, encoding='utf-8')
          PY

          grep -q 'bundled_note_type_ids' include/pulseforge/note_types.hpp
          grep -q 'bundled_note_type_ids' src/app/editor_ui.cpp
          grep -q 'bundled_note_type_ids' src/app/streaming_editor_ui.cpp
          grep -q 'PULSEFORGE_DISCORD_SDK_ARCHIVE_URL' .github/workflows/complete-testing-draft.yml
          grep -q 'PULSEFORGE_REQUIRE_DISCORD_SOCIAL_SDK=ON' .github/workflows/complete-testing-draft.yml
          bash -n scripts/prepare-discord-release-sdk.sh

      - name: Commit materialized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/pulseforge/note_types.hpp src/core/note_types.cpp \
            src/app/editor_ui.cpp src/app/streaming_editor_ui.cpp \
            tests/note_types_test.cpp .github/workflows/complete-testing-draft.yml \
            scripts/prepare-discord-release-sdk.sh
          git commit -m 'fix: expose native note types and require Discord SDK releases [notetype-discord-materialized]'
          git push origin HEAD:fix/native-notetype-menu-discord-release
