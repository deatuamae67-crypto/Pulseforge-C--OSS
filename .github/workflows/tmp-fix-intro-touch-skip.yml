name: Temporary intro touch skip fix

on:
  push:
    branches:
      - feature/android-touch-port
    paths:
      - .github/workflows/tmp-fix-intro-touch-skip.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/android-touch-port
          fetch-depth: 1

      - name: Apply exact intro tap fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/app/intro_player.cpp")
          text = path.read_text(encoding="utf-8")

          old_helper = '''[[nodiscard]] bool is_skip_event(const SDL_Event& event) noexcept {
              return event.type == SDL_EVENT_FINGER_UP
                  || (event.type == SDL_EVENT_KEY_DOWN
                      && (event.key.scancode == SDL_SCANCODE_RETURN
                          || event.key.scancode == SDL_SCANCODE_KP_ENTER
                          || event.key.scancode == SDL_SCANCODE_SPACE));
          }
          '''
          new_helper = '''class SkipInputState {
          public:
              [[nodiscard]] bool consume(const SDL_Event& event) noexcept {
                  if (event.type == SDL_EVENT_KEY_DOWN
                      && (event.key.scancode == SDL_SCANCODE_RETURN
                          || event.key.scancode == SDL_SCANCODE_KP_ENTER
                          || event.key.scancode == SDL_SCANCODE_SPACE)) {
                      return true;
                  }

                  switch (event.type) {
                  case SDL_EVENT_FINGER_DOWN:
                      if (!touch_active_) {
                          touch_active_ = true;
                          touch_id_ = event.tfinger.touchID;
                          finger_id_ = event.tfinger.fingerID;
                          start_x_ = event.tfinger.x;
                          start_y_ = event.tfinger.y;
                          touch_moved_ = false;
                      }
                      return false;
                  case SDL_EVENT_FINGER_MOTION:
                      if (matches_touch(event)) {
                          update_travel(event.tfinger.x, event.tfinger.y);
                      }
                      return false;
                  case SDL_EVENT_FINGER_UP:
                      if (!matches_touch(event)) {
                          return false;
                      }
                      update_travel(event.tfinger.x, event.tfinger.y);
                      {
                          const bool should_skip = !touch_moved_;
                          reset_touch();
                          return should_skip;
                      }
                  case SDL_EVENT_FINGER_CANCELED:
                      if (matches_touch(event)) {
                          reset_touch();
                      }
                      return false;
                  case SDL_EVENT_WINDOW_FOCUS_LOST:
                      reset_touch();
                      return false;
                  default:
                      return false;
                  }
              }

          private:
              static constexpr float maximum_tap_travel = 0.05F;

              [[nodiscard]] bool matches_touch(const SDL_Event& event) const noexcept {
                  return touch_active_
                      && event.tfinger.touchID == touch_id_
                      && event.tfinger.fingerID == finger_id_;
              }

              void update_travel(const float x, const float y) noexcept {
                  const float dx = x - start_x_;
                  const float dy = y - start_y_;
                  touch_moved_ = touch_moved_
                      || dx * dx + dy * dy
                          > maximum_tap_travel * maximum_tap_travel;
              }

              void reset_touch() noexcept {
                  touch_active_ = false;
                  touch_moved_ = false;
                  touch_id_ = {};
                  finger_id_ = {};
              }

              bool touch_active_{};
              bool touch_moved_{};
              SDL_TouchID touch_id_{};
              SDL_FingerID finger_id_{};
              float start_x_{};
              float start_y_{};
          };
          '''

          if text.count(old_helper) != 1:
              raise SystemExit(f"Expected one old skip helper, found {text.count(old_helper)}")
          text = text.replace(old_helper, new_helper, 1)

          decoded_anchor = '''    while (true) {
              SDL_Event event;
          '''
          decoded_replacement = '''    SkipInputState skip_input;
              while (true) {
              SDL_Event event;
          '''
          if text.count(decoded_anchor) != 1:
              raise SystemExit(f"Expected one decoded-loop anchor, found {text.count(decoded_anchor)}")
          text = text.replace(decoded_anchor, decoded_replacement, 1)

          fallback_anchor = '''    const auto begin = SDL_GetTicksNS();
              while (SDL_GetTicksNS() - begin < duration_ns) {
          '''
          fallback_replacement = '''    const auto begin = SDL_GetTicksNS();
              SkipInputState skip_input;
              while (SDL_GetTicksNS() - begin < duration_ns) {
          '''
          if text.count(fallback_anchor) != 1:
              raise SystemExit(f"Expected one fallback-loop anchor, found {text.count(fallback_anchor)}")
          text = text.replace(fallback_anchor, fallback_replacement, 1)

          if text.count('is_skip_event(event)') != 2:
              raise SystemExit(f"Expected two skip calls, found {text.count('is_skip_event(event)')}")
          text = text.replace('is_skip_event(event)', 'skip_input.consume(event)')

          old_hint = '"PRESS ENTER OR SPACE TO SKIP"'
          new_hint = '"TAP OR PRESS ENTER OR SPACE TO SKIP"'
          if text.count(old_hint) != 1:
              raise SystemExit(f"Expected one skip hint, found {text.count(old_hint)}")
          text = text.replace(old_hint, new_hint, 1)

          path.write_text(text, encoding="utf-8", newline="\n")

          verified = path.read_text(encoding="utf-8")
          checks = {
              'SDL_EVENT_FINGER_UP\n': 1,
              'skip_input.consume(event)': 2,
              'SkipInputState skip_input;': 2,
              'SDL_EVENT_FINGER_CANCELED': 1,
              'TAP OR PRESS ENTER OR SPACE TO SKIP': 1,
          }
          for token, expected in checks.items():
              actual = verified.count(token)
              if actual != expected:
                  raise SystemExit(f"Verification failed for {token!r}: expected {expected}, found {actual}")

      - name: Stage and constrain source fix
        shell: bash
        run: |
          set -euo pipefail
          git add -- src/app/intro_player.cpp
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          test "$changed" = "src/app/intro_player.cpp"
          git diff --cached -- src/app/intro_player.cpp

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: require a tap gesture to skip intro"
          git push origin HEAD:feature/android-touch-port
