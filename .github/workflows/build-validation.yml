name: PulseForge cross-platform build validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Configure Windows MSVC x64
        shell: pwsh
        run: |
          cmake --preset windows-msvc 2>&1 | Tee-Object -FilePath windows-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows Release
        shell: pwsh
        run: |
          cmake --build --preset windows-release 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate mobile touch controls
        shell: pwsh
        run: |
          cmake --preset windows-msvc -DPULSEFORGE_BUILD_TESTS=ON 2>&1 | Tee-Object -FilePath windows-touch-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-release --target pulseforge_mobile_touch_controls_tests 2>&1 | Tee-Object -FilePath windows-touch-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir out/build/msvc -C Release -R '^pulseforge\.mobile_touch_controls$' --output-on-failure --no-tests=error 2>&1 | Tee-Object -FilePath windows-touch-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inspect Windows binaries
        shell: pwsh
        run: |
          Get-ChildItem -Path out/build/msvc -Recurse -File |
            Where-Object { $_.Extension -in '.exe','.dll','.lib' } |
            Select-Object FullName,Length

      - name: Upload Windows validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-logs-windows-x64
          path: |
            windows-configure.log
            windows-build.log
            windows-touch-configure.log
            windows-touch-build.log
            windows-touch-test.log
          if-no-files-found: ignore
          retention-days: 14

  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - name: Configure Linux Release
        shell: bash
        run: |
          set -o pipefail
          cmake --preset linux-release 2>&1 | tee linux-configure.log

      - name: Build Linux Release
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset linux-release 2>&1 | tee linux-build.log

      - name: Validate mobile touch controls
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cmake --preset linux-release -DPULSEFORGE_BUILD_TESTS=ON 2>&1 | tee linux-touch-configure.log
          cmake --build --preset linux-release --target pulseforge_mobile_touch_controls_tests 2>&1 | tee linux-touch-build.log
          ctest --test-dir out/build/linux-release -R '^pulseforge\.mobile_touch_controls$' --output-on-failure --no-tests=error 2>&1 | tee linux-touch-test.log

      - name: Inspect Linux binaries
        shell: bash
        run: |
          find out/build/linux-release -maxdepth 4 -type f -perm -111 -print -exec file {} \; || true

      - name: Upload Linux validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-logs-linux-x86_64
          path: |
            linux-configure.log
            linux-build.log
            linux-touch-configure.log
            linux-touch-build.log
            linux-touch-test.log
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Ensure CMake and Ninja
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          cmake --version
          ninja --version

      - name: Configure macOS Release
        shell: bash
        env:
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.arch }}
        run: |
          set -o pipefail
          cmake --preset macos-release -DCMAKE_OSX_ARCHITECTURES="${CMAKE_OSX_ARCHITECTURES}" 2>&1 | tee macos-configure.log

      - name: Build macOS Release
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset macos-release 2>&1 | tee macos-build.log

      - name: Validate mobile touch controls
        shell: bash
        env:
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          set -o pipefail
          cmake --preset macos-release -DCMAKE_OSX_ARCHITECTURES="${CMAKE_OSX_ARCHITECTURES}" -DPULSEFORGE_BUILD_TESTS=ON 2>&1 | tee macos-touch-configure.log
          cmake --build --preset macos-release --target pulseforge_mobile_touch_controls_tests 2>&1 | tee macos-touch-build.log
          ctest --test-dir out/build/macos-release -R '^pulseforge\.mobile_touch_controls$' --output-on-failure --no-tests=error 2>&1 | tee macos-touch-test.log

      - name: Inspect macOS binaries
        shell: bash
        run: |
          find out/build/macos-release -maxdepth 4 -type f -perm -111 -print -exec file {} \; || true

      - name: Upload macOS validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-logs-macos-${{ matrix.arch }}
          path: |
            macos-configure.log
            macos-build.log
            macos-touch-configure.log
            macos-touch-build.log
            macos-touch-test.log
          if-no-files-found: ignore
          retention-days: 14

  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.31.6'

      - name: Resolve optional Discord Android support dependencies
        shell: bash
        run: |
          set -euo pipefail
          stub_dir="$RUNNER_TEMP/pulseforge-discord-aar-stub"
          stub_aar="$RUNNER_TEMP/discord_partner_sdk-ci-stub.aar"
          rm -rf "$stub_dir" "$stub_aar"
          mkdir -p "$stub_dir"
          cat > "$stub_dir/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="org.pulseforge.ci.discordstub" />
          EOF
          python3 - "$stub_dir" "$stub_aar" <<'PY'
          import pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              zf.write(root / 'AndroidManifest.xml', 'AndroidManifest.xml')
          PY

          chmod +x platform/android/gradlew
          cd platform/android
          ./gradlew --no-daemon --stacktrace \
            :app:dependencies \
            --configuration releaseRuntimeClasspath \
            -PPULSEFORGE_DISCORD_SDK_AAR="$stub_aar" \
            -PPULSEFORGE_DISCORD_APPLICATION_ID=1 \
            2>&1 | tee "$GITHUB_WORKSPACE/android-discord-dependencies.log"

          grep -F 'androidx.browser:browser:1.10.0' "$GITHUB_WORKSPACE/android-discord-dependencies.log"
          if grep -Eq 'androidx\.browser:browser:1\.10\.0.*FAILED' "$GITHUB_WORKSPACE/android-discord-dependencies.log"; then
            echo 'androidx.browser 1.10.0 did not resolve successfully.' >&2
            exit 1
          fi

      - name: Build unsigned Android Release APK
        shell: bash
        env:
          PULSEFORGE_ANDROID_BUILD_ROOT: ${{ runner.temp }}/pulseforge-android
        run: |
          set -o pipefail
          chmod +x platform/android/gradlew
          cd platform/android
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"

      - name: Inspect Android APK and native library
        shell: bash
        run: |
          set -euo pipefail
          find platform/android/app/build -type f \( -name '*.apk' -o -name 'libpulseforge.so' -o -name 'libmain.so' \) -print -exec ls -lh {} \; || true
          find "$RUNNER_TEMP/pulseforge-android" -type f \( -name '*.apk' -o -name 'libpulseforge.so' -o -name 'libmain.so' \) -print -exec ls -lh {} \; || true

      - name: Upload Android validation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-logs-android-arm64
          path: |
            android-discord-dependencies.log
            android-build.log
          if-no-files-found: ignore
          retention-days: 14
