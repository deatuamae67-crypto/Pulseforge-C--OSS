name: Bootstrap split-chart CMake formatting cleanup

on:
  push:
    branches: [feat/native-split-chart-merge-ui]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/native-split-chart-merge-ui
      - name: Normalize CMake test block indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CMakeLists.txt')
          s = p.read_text(encoding='utf-8')
          old = '''    add_executable(\n    pulseforge_split_chart_merger_tests\n    tests/split_chart_merger_native_test.cpp\n)\ntarget_link_libraries(pulseforge_split_chart_merger_tests PRIVATE pulseforge_core)\npulseforge_set_warnings(pulseforge_split_chart_merger_tests)\nadd_test(\n    NAME pulseforge.split_chart_merger\n    COMMAND pulseforge_split_chart_merger_tests\n)\n'''
          new = '''    add_executable(\n        pulseforge_split_chart_merger_tests\n        tests/split_chart_merger_native_test.cpp\n    )\n    target_link_libraries(\n        pulseforge_split_chart_merger_tests PRIVATE pulseforge_core\n    )\n    pulseforge_set_warnings(pulseforge_split_chart_merger_tests)\n    add_test(\n        NAME pulseforge.split_chart_merger\n        COMMAND pulseforge_split_chart_merger_tests\n    )\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one split merger CMake test block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'PulseForge CI'
          git config user.email 'actions@users.noreply.github.com'
          git add CMakeLists.txt
          git commit -m 'Normalize split-chart merger CMake test block'
          git push origin HEAD:feat/native-split-chart-merge-ui
