name: PulseForge OSS boundary validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oss-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require immutable GitHub Action pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          uses_pattern = re.compile(
              r'''(?mx)
              (?:^[ \t]*(?:-[ \t]*)?|[{,][ \t]*)
              (?:uses|"uses"|'uses')[ \t]*:[ \t]*
              (?:"([^"\r\n]+)"|'([^'\r\n]+)'|([^,}\s#]+))
              '''
          )

          def extract_uses(text):
              refs = []
              for match in uses_pattern.finditer(text):
                  spec = next(group for group in match.groups() if group is not None)
                  line_number = text.count('\n', 0, match.start()) + 1
                  refs.append((line_number, spec))
              return refs

          scanner_cases = [
              ('uses: actions/checkout@v7\n', ['actions/checkout@v7']),
              ('- uses: actions/checkout@v7\n', ['actions/checkout@v7']),
              ('- { uses: actions/checkout@v7 }\n', ['actions/checkout@v7']),
              ('jobs: { build: { "uses": "owner/repo/.github/workflows/ci.yml@main" } }\n',
               ['owner/repo/.github/workflows/ci.yml@main']),
              ("- { 'uses': 'actions/checkout@v7', with: { fetch-depth: 1 } }\n",
               ['actions/checkout@v7']),
          ]
          for sample, expected in scanner_cases:
              actual = [spec for _, spec in extract_uses(sample)]
              if actual != expected:
                  raise SystemExit(
                      f'Internal action-reference scanner self-test failed: sample={sample!r} '
                      f'expected={expected!r} actual={actual!r}'
                  )

          violations = []
          roots = [pathlib.Path('.github/workflows'), pathlib.Path('.github/actions')]
          for root in roots:
              if not root.exists():
                  continue
              paths = sorted(set(root.rglob('*.yml')) | set(root.rglob('*.yaml')))
              for path in paths:
                  text = path.read_text(encoding='utf-8')
                  for line_number, spec in extract_uses(text):
                      if spec.startswith('./'):
                          continue

                      if spec.startswith('docker://'):
                          image = spec[len('docker://'):]
                          if not re.fullmatch(r'.+@sha256:[0-9a-fA-F]{64}', image):
                              violations.append(
                                  f'{path}:{line_number}: docker action must be pinned by sha256 digest: {spec}'
                              )
                          continue

                      if '@' not in spec:
                          violations.append(f'{path}:{line_number}: remote action has no ref: {spec}')
                          continue
                      ref = spec.rsplit('@', 1)[1]
                      if not re.fullmatch(r'[0-9a-fA-F]{40}', ref):
                          violations.append(
                              f'{path}:{line_number}: remote action must be pinned to a full 40-hex commit SHA: {spec}'
                          )

          if violations:
              print('Mutable GitHub Action references detected:', file=sys.stderr)
              for violation in violations:
                  print(f' - {violation}', file=sys.stderr)
              sys.exit(1)

          print('All remote GitHub Actions and docker action images use immutable references.')
          PY

      - name: Reject non-redistributable or private build inputs
        shell: bash
        run: |
          set -euo pipefail

          violations=()

          while IFS= read -r path; do
            lower="${path,,}"
            base="${lower##*/}"

            case "$lower" in
              third_party/discord_social_sdk/*)
                violations+=("$path :: raw Discord Social SDK input must not be tracked")
                ;;
            esac

            case "$base" in
              discord_partner_sdk.dll|libdiscord_partner_sdk.so|libdiscord_partner_sdk.dylib|discord_partner_sdk.aar)
                violations+=("$path :: Discord Social SDK runtime must not be redistributed in the OSS repository")
                ;;
              *.jks|*.keystore|*.p12|*.pfx)
                violations+=("$path :: signing key/container must not be tracked")
                ;;
              discordsocialsdk*.zip|discord-social-sdk*.zip|discord_social_sdk*.zip)
                violations+=("$path :: raw Discord Social SDK archive must not be tracked")
                ;;
              pulseforge-v*.zip|pulseforge-v*.tar.gz|pulseforge-v*.apk)
                violations+=("$path :: generated release package belongs in GitHub Releases/Actions, not source control")
                ;;
            esac

            case "$lower" in
              pulseforge.exe|pulseforge-cli.exe|discord_partner_sdk.dll)
                violations+=("$path :: generated/private root runtime binary must not be tracked")
                ;;
            esac
          done < <(git ls-files)

          if (( ${#violations[@]} > 0 )); then
            printf 'PulseForge OSS boundary violations detected:\n' >&2
            printf ' - %s\n' "${violations[@]}" >&2
            exit 1
          fi

          echo 'PulseForge OSS boundary validation passed.'

      - name: Confirm documented Discord release boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/DISCORD_SDK_DISTRIBUTION.md
          test -f docs/RELEASE_REQUIREMENTS.md
          test -f docs/OSS_SCOPE.md

          grep -q 'PULSEFORGE_REQUIRE_DISCORD_SOCIAL_SDK' docs/RELEASE_REQUIREMENTS.md
          grep -qi 'discord' docs/DISCORD_SDK_DISTRIBUTION.md
          echo 'Discord OSS/release-boundary documentation is present.'
