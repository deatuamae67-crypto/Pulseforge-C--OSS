name: PulseForge OSS boundary validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oss-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require immutable GitHub Action pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          violations = []
          roots = [pathlib.Path('.github/workflows'), pathlib.Path('.github/actions')]
          for root in roots:
              if not root.exists():
                  continue
              paths = sorted(set(root.rglob('*.yml')) | set(root.rglob('*.yaml')))
              for path in paths:
                  for line_number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      match = re.match(r'^\s*uses:\s*([^\s#]+)', line)
                      if not match:
                          continue
                      spec = match.group(1)
                      if spec.startswith('./') or spec.startswith('docker://'):
                          continue
                      if '@' not in spec:
                          violations.append(f'{path}:{line_number}: remote action has no ref: {spec}')
                          continue
                      ref = spec.rsplit('@', 1)[1]
                      if not re.fullmatch(r'[0-9a-fA-F]{40}', ref):
                          violations.append(
                              f'{path}:{line_number}: remote action must be pinned to a full 40-hex commit SHA: {spec}'
                          )

          if violations:
              print('Mutable GitHub Action references detected:', file=sys.stderr)
              for violation in violations:
                  print(f' - {violation}', file=sys.stderr)
              sys.exit(1)

          print('All remote GitHub Actions are pinned to immutable commit SHAs.')
          PY

      - name: Reject non-redistributable or private build inputs
        shell: bash
        run: |
          set -euo pipefail

          violations=()

          while IFS= read -r path; do
            lower="${path,,}"
            base="${lower##*/}"

            case "$lower" in
              third_party/discord_social_sdk/*)
                violations+=("$path :: raw Discord Social SDK input must not be tracked")
                ;;
            esac

            case "$base" in
              discord_partner_sdk.dll|libdiscord_partner_sdk.so|libdiscord_partner_sdk.dylib|discord_partner_sdk.aar)
                violations+=("$path :: Discord Social SDK runtime must not be redistributed in the OSS repository")
                ;;
              *.jks|*.keystore|*.p12|*.pfx)
                violations+=("$path :: signing key/container must not be tracked")
                ;;
              discordsocialsdk*.zip|discord-social-sdk*.zip|discord_social_sdk*.zip)
                violations+=("$path :: raw Discord Social SDK archive must not be tracked")
                ;;
              pulseforge-v*.zip|pulseforge-v*.tar.gz|pulseforge-v*.apk)
                violations+=("$path :: generated release package belongs in GitHub Releases/Actions, not source control")
                ;;
            esac

            case "$lower" in
              pulseforge.exe|pulseforge-cli.exe|discord_partner_sdk.dll)
                violations+=("$path :: generated/private root runtime binary must not be tracked")
                ;;
            esac
          done < <(git ls-files)

          if (( ${#violations[@]} > 0 )); then
            printf 'PulseForge OSS boundary violations detected:\n' >&2
            printf ' - %s\n' "${violations[@]}" >&2
            exit 1
          fi

          echo 'PulseForge OSS boundary validation passed.'

      - name: Confirm documented Discord release boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/DISCORD_SDK_DISTRIBUTION.md
          test -f docs/RELEASE_REQUIREMENTS.md
          test -f docs/OSS_SCOPE.md

          grep -q 'PULSEFORGE_REQUIRE_DISCORD_SOCIAL_SDK' docs/RELEASE_REQUIREMENTS.md
          grep -qi 'discord' docs/DISCORD_SDK_DISTRIBUTION.md
          echo 'Discord OSS/release-boundary documentation is present.'
