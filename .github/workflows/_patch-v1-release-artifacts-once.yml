name: Patch PulseForge 1.0.0 release packaging once

on:
  push:
    branches:
      - release/v1.0.0-final
    paths:
      - '.github/workflows/_patch-v1-release-artifacts-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/v1.0.0-final
          fetch-depth: 1
      - name: Patch exact 1.0.0 packaging assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/release-artifacts.yml')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("  PULSEFORGE_VERSION: '0.9.7'", "  PULSEFORGE_VERSION: '1.0.0'"),
              ("versionCode='90700'.*versionName='0.9.7'", "versionCode='100000'.*versionName='1.0.0'"),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one {old!r}, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -F "PULSEFORGE_VERSION: '1.0.0'" .github/workflows/release-artifacts.yml
          grep -F "versionCode='100000'.*versionName='1.0.0'" .github/workflows/release-artifacts.yml
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release-artifacts.yml
          git commit -m 'ci(release): package PulseForge 1.0.0'
          git push origin HEAD:release/v1.0.0-final
