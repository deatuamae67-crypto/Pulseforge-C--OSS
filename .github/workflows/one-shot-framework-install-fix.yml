name: One-shot framework install fix

on:
  push:
    branches:
      - feat/discord-macos-framework
    paths:
      - .github/workflows/one-shot-framework-install-fix.yml

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/discord-macos-framework
          fetch-depth: 0

      - name: Remove duplicate install rule exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CMakeLists.txt')
          text = path.read_text(encoding='utf-8')
          old = '''    if(PULSEFORGE_DISCORD_SOCIAL_SDK_FRAMEWORK_ACTIVE)\n        install(\n            DIRECTORY "${_pulseforge_discord_framework}"\n            DESTINATION "$<TARGET_BUNDLE_DIR_NAME:pulseforge>/Contents/Frameworks"\n        )\n    elseif(PULSEFORGE_DISCORD_SOCIAL_SDK_ACTIVE\n'''
          new = '''    if(PULSEFORGE_DISCORD_SOCIAL_SDK_FRAMEWORK_ACTIVE)\n        # The framework is embedded by the pulseforge POST_BUILD rule above.\n        # install(TARGETS pulseforge BUNDLE ...) installs that complete app\n        # bundle, including framework symlinks and nested Krisp resources.\n        # Installing the source framework again would duplicate symlinks.\n    elseif(PULSEFORGE_DISCORD_SOCIAL_SDK_ACTIVE\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one framework install block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/one-shot-framework-install-fix.yml
          git diff --check
          git diff -- CMakeLists.txt

      - name: Commit fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt .github/workflows/one-shot-framework-install-fix.yml
          git commit -m "fix: install embedded macOS framework once"
          git push origin HEAD:feat/discord-macos-framework
