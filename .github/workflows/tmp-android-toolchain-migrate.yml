name: Temporary Android wrapper regeneration

on:
  push:
    branches:
      - maintenance/android-agp-9.4-gradle-9.6
    paths:
      - .github/workflows/tmp-android-toolchain-migrate.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: maintenance/android-agp-9.4-gradle-9.6
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Regenerate and verify Gradle 9.6 wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x platform/android/gradlew
          cd platform/android
          grep -F "getDefaultProguardFile('proguard-android-optimize.txt')" app/build.gradle
          if grep -Fq "getDefaultProguardFile('proguard-android.txt')" app/build.gradle; then
            echo 'Unsupported AGP 9 default ProGuard file remains.' >&2
            exit 1
          fi
          ./gradlew --no-daemon --stacktrace wrapper \
            --gradle-version 9.6.0 \
            --distribution-type bin
          ./gradlew --no-daemon --version
          test "$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')" = "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7"
          grep -F 'gradle-9.6.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -F 'distributionSha256Sum=bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01' gradle/wrapper/gradle-wrapper.properties

      - name: Commit only generated wrapper files
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            platform/android/gradlew \
            platform/android/gradlew.bat \
            platform/android/gradle/wrapper/gradle-wrapper.jar \
            platform/android/gradle/wrapper/gradle-wrapper.properties
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            'platform/android/gradle/wrapper/gradle-wrapper.jar' \
            'platform/android/gradle/wrapper/gradle-wrapper.properties' \
            'platform/android/gradlew' \
            'platform/android/gradlew.bat')"
          printf 'Generated wrapper outputs:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(android): regenerate Gradle 9.6 wrapper"
          git push origin HEAD:maintenance/android-agp-9.4-gradle-9.6
