name: PulseForge 1.0.0 Complete lightweight runtimes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/complete-testing-draft.yml'
      - 'platform/android/app/build.gradle'
      - 'scripts/complete_release_stage_transport.py'
      - 'scripts/complete_release_package.sh'
      - 'scripts/generate_complete_drive_runtime_manifest.py'
      - 'scripts/complete_runtime_transport_selftest.py'
      - 'docs/complete/mods/*.json'
      - 'docs/complete/RUNTIME_INSTALL.md'
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'assets/**'
      - 'include/**'
      - 'src/**'
      - 'platform/android/**'
      - 'third_party/**'
      - 'THIRD_PARTY_LICENSES/**'
      - 'THIRD_PARTY.md'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'tools/**'
      - 'docs/complete/mods/*.json'
      - 'docs/complete/RUNTIME_INSTALL.md'
      - 'docs/RELEASE_NOTES_1.0.0_COMPLETE.md'
      - 'scripts/complete_release_stage_transport.py'
      - 'scripts/complete_release_package.sh'
      - 'scripts/generate_complete_drive_runtime_manifest.py'
      - 'scripts/complete_runtime_transport_selftest.py'
      - '.github/workflows/complete-testing-draft.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulseforge-complete-lightweight-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPLETE_TAG: 'v1.0.0-complete'
  RELEASE_TITLE: 'PulseForge 1.0.0 Complete'
  TRANSPORT_TITLE: 'PulseForge Complete CI Transport'
  TRANSPORT_TAG: 'pulseforge-complete-ci-transport'
  PACKAGE_VERSION: '1.0.0-complete'
  RELEASE_PART_LIMIT: '1887436800'
  GDOWN_VERSION: '6.2.0'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          lfs: false

      - name: Validate lightweight Complete release contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/complete-testing-draft.yml'
          package='scripts/complete_release_package.sh'
          test -s docs/RELEASE_NOTES_1.0.0_COMPLETE.md
          test -s docs/COMPLETE_CONTENT_1.0.0.json
          jq -e '
            .schema_version == 2
            and .edition == "1.0.0-complete"
            and .target_mod_count == 30
          ' docs/COMPLETE_CONTENT_1.0.0.json >/dev/null
          test -s scripts/generate_complete_drive_runtime_manifest.py
          test -s scripts/complete_runtime_transport_selftest.py
          test -s scripts/complete_release_stage_transport.py
          test -s "$package"
          python3 -m py_compile scripts/generate_complete_drive_runtime_manifest.py
          python3 scripts/generate_complete_drive_runtime_manifest.py --self-test
          python3 scripts/complete_runtime_transport_selftest.py
          python3 -m py_compile scripts/complete_release_stage_transport.py
          python3 scripts/complete_release_stage_transport.py self-test
          bash -n "$package"
          grep -Fq "include 'complete-runtime-manifest.json'" platform/android/app/build.gradle
          grep -Fq 'generate_complete_drive_runtime_manifest.py' "$workflow"
          grep -Fq 'assets/complete-runtime-manifest.json' "$package"
          grep -Fq 'Android-arm64-test-signed.apk' "$package"
          ! grep -Fq 'ln -s "$GITHUB_WORKSPACE/mods"' "$package"
          ! grep -Fq 'adb push "$here/mods' "$package"
          ! grep -Fq 'git lfs pull --include="assets/**,mods/**"' "$workflow"
          ! grep -Fq 'actions/upload-artifact' "$workflow"
          ! grep -Fq 'actions/download-artifact' "$workflow"
          echo 'Complete release contract: five lightweight runtimes plus Drive-backed runtime manifest.'

  prepare-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      public_release_id: ${{ steps.release.outputs.public_release_id }}
      transport_release_id: ${{ steps.release.outputs.transport_release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve public Complete release and hidden CI transport draft
        id: release
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          public_release_id="$(
            gh api "repos/$repo/releases/tags/$COMPLETE_TAG" --jq '.id' 2>/dev/null || true
          )"
          if [[ -z "$public_release_id" ]]; then
            echo "Public Complete release $COMPLETE_TAG does not exist; refusing to publish through an unverified fallback." >&2
            exit 1
          fi

          mapfile -t drafts < <(
            gh api "repos/$repo/releases?per_page=100" --paginate \
              --jq ".[] | select(.draft == true and (.name == \"$TRANSPORT_TITLE\" or .name == \"$RELEASE_TITLE\") and .id != $public_release_id) | [.created_at, .id] | @tsv" \
              | sort
          )
          if (( ${#drafts[@]} == 0 )); then
            response="$(
              gh api --method POST "repos/$repo/releases" \
                -f tag_name="$TRANSPORT_TAG" \
                -f target_commitish="$GITHUB_SHA" \
                -f name="$TRANSPORT_TITLE" \
                -f body="Temporary hidden stage transport for PulseForge Complete CI." \
                -F draft=true \
                -F prerelease=false
            )"
            transport_release_id="$(jq -r '.id' <<<"$response")"
          else
            IFS=$'\t' read -r _ transport_release_id <<<"${drafts[0]}"
            if (( ${#drafts[@]} > 1 )); then
              for row in "${drafts[@]:1}"; do
                IFS=$'\t' read -r _ duplicate_id <<<"$row"
                gh api --method DELETE "repos/$repo/releases/$duplicate_id" >/dev/null
              done
            fi
            gh api --method PATCH "repos/$repo/releases/$transport_release_id" \
              -f tag_name="$TRANSPORT_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$TRANSPORT_TITLE" \
              -f body="Temporary hidden stage transport for PulseForge Complete CI." \
              -F draft=true \
              -F prerelease=false >/dev/null
          fi

          echo "public_release_id=$public_release_id" >> "$GITHUB_OUTPUT"
          echo "transport_release_id=$transport_release_id" >> "$GITHUB_OUTPUT"
          echo "Public Complete release: $public_release_id"
          echo "Hidden transport draft: $transport_release_id"

      - name: Clean stale transport stages and public candidates
        shell: bash
        env:
          PUBLIC_RELEASE_ID: ${{ steps.release.outputs.public_release_id }}
          TRANSPORT_RELEASE_ID: ${{ steps.release.outputs.transport_release_id }}
        run: |
          set -euo pipefail
          mapfile -t transport_assets < <(
            gh api "repos/$GITHUB_REPOSITORY/releases/$TRANSPORT_RELEASE_ID/assets?per_page=100" --paginate --jq '.[].id'
          )
          for id in "${transport_assets[@]}"; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null
          done
          mapfile -t stale_candidates < <(
            gh api "repos/$GITHUB_REPOSITORY/releases/$PUBLIC_RELEASE_ID/assets?per_page=100" --paginate \
              --jq '.[] | select(.name | startswith("CANDIDATE-")) | .id'
          )
          for id in "${stale_candidates[@]}"; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null
          done
          echo "Cleaned ${#transport_assets[@]} transport asset(s) and ${#stale_candidates[@]} stale public candidate(s)."

  runtime-manifest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, prepare-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TRANSPORT_RELEASE_ID: ${{ needs.prepare-release.outputs.transport_release_id }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false

      - name: Generate lightweight 30-mod Drive runtime manifest
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/pulseforge-gdown"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --retries 5 "gdown==$GDOWN_VERSION"
          stage="$RUNNER_TEMP/runtime-manifest-stage"
          mkdir -p "$stage"
          manifest="$stage/complete-runtime-manifest.json"
          ok=0
          for attempt in 1 2 3; do
            if "$venv/bin/python" scripts/generate_complete_drive_runtime_manifest.py \
              --python "$venv/bin/python" \
              --source-commit "$GITHUB_SHA" \
              --output "$manifest"; then
              ok=1
              break
            fi
            echo "Runtime manifest generation attempt $attempt failed." >&2
            sleep $((attempt * 10))
          done
          (( ok == 1 ))
          jq -e '.schema_version == 1 and .edition == "1.0.0-complete" and .mod_count == 30 and (.mods | length) == 30' "$manifest" >/dev/null
          printf '%s\n' "$GITHUB_SHA" > "$stage/PULSEFORGE_SOURCE_SHA.txt"

      - name: Upload runtime manifest through hidden transport draft
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/complete_release_stage_transport.py upload \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "$TRANSPORT_RELEASE_ID" \
            --sha "$GITHUB_SHA" \
            --stage-key runtime-manifest \
            --stage-dir "$RUNNER_TEMP/runtime-manifest-stage" \
            --archive-dir "$RUNNER_TEMP"

  build-stage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, prepare-release, runtime-manifest]
    name: build-stage / ${{ matrix.stage_key }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: windows
            stage_key: windows-x86_64
            runner: windows-2022
          - kind: linux
            stage_key: linux-x86_64
            runner: ubuntu-24.04
          - kind: macos
            stage_key: macos-arm64
            runner: macos-15
            arch: arm64
          - kind: macos
            stage_key: macos-x86_64
            runner: macos-26-intel
            arch: x86_64
          - kind: android
            stage_key: android-arm64
            runner: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TRANSPORT_RELEASE_ID: ${{ needs.prepare-release.outputs.transport_release_id }}

    steps:
      - name: Checkout exact engine source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false

      - name: Hydrate Windows build-time LFS dependencies
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git lfs install --local
          git lfs pull --include="tools/**,third_party/**" --exclude="mods/**,assets/**"

      - name: Hydrate Unix desktop build-time LFS dependencies
        if: matrix.kind == 'linux' || matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="tools/**,third_party/**" --exclude="mods/**,assets/**"

      - name: Hydrate Android runtime assets without the mod corpus
        if: matrix.kind == 'android'
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="assets/**,third_party/**" --exclude="mods/**"

      - name: Inject Complete runtime manifest into Android source assets
        if: matrix.kind == 'android'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/complete_release_stage_transport.py download-all \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "$TRANSPORT_RELEASE_ID" \
            --sha "$GITHUB_SHA" \
            --stage-keys runtime-manifest \
            --archive-dir "$RUNNER_TEMP/runtime-manifest-archive" \
            --output-root "$RUNNER_TEMP/runtime-manifest"
          manifest="$RUNNER_TEMP/runtime-manifest/complete-engine-stage-runtime-manifest/complete-runtime-manifest.json"
          test -s "$manifest"
          jq -e '.mod_count == 30 and (.mods | length) == 30' "$manifest" >/dev/null
          cp "$manifest" assets/complete-runtime-manifest.json

      - name: Configure, build and stage Windows Release
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --preset windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stage = Join-Path $env:RUNNER_TEMP 'windows-stage'
          cmake --install out/build/msvc --config Release --prefix "$stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $stage 'bin/pulseforge.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Missing $binary" }
          foreach ($path in @((Join-Path $stage 'bin/assets'), (Join-Path $stage 'bin/mods'))) {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
          }
          "source_sha=$env:GITHUB_SHA" | Set-Content -LiteralPath (Join-Path $stage 'PULSEFORGE_SOURCE_SHA.txt') -Encoding ascii

      - name: Install Linux build dependencies
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config file \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - name: Configure, build and stage Linux Release
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset linux-release
          cmake --build --preset linux-release --parallel 2
          stage="$RUNNER_TEMP/linux-stage"
          cmake --install out/build/linux-release --prefix "$stage"
          test -x "$stage/bin/pulseforge"
          ldd "$stage/bin/pulseforge" | tee "$stage/PulseForge.ldd.txt"
          ! grep -q 'not found' "$stage/PulseForge.ldd.txt"
          rm -rf "$stage/bin/assets" "$stage/bin/mods"
          printf '%s\n' "$GITHUB_SHA" > "$stage/PULSEFORGE_SOURCE_SHA.txt"

      - name: Ensure macOS build tools
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja

      - name: Configure, build and stage macOS Release
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset macos-release -DCMAKE_OSX_ARCHITECTURES='${{ matrix.arch }}'
          cmake --build --preset macos-release --parallel 2
          stage="$RUNNER_TEMP/macos-stage-${{ matrix.arch }}"
          cmake --install out/build/macos-release --prefix "$stage"
          app="$stage/PulseForge.app"
          binary="$app/Contents/MacOS/pulseforge"
          test -x "$binary"
          test -f "$app/Contents/Info.plist"
          rm -rf "$stage/bin/assets" "$stage/bin/mods" "$app/Contents/MacOS/assets"
          codesign --deep --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$binary" | tee "$stage/PulseForge.arch.txt"
          grep -qx '${{ matrix.arch }}' "$stage/PulseForge.arch.txt"
          printf '%s\n' "$GITHUB_SHA" > "$stage/PULSEFORGE_SOURCE_SHA.txt"

      - name: Set up JDK 17
        if: matrix.kind == 'android'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: matrix.kind == 'android'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Build, sign and stage Android Release
        if: matrix.kind == 'android'
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;36.0.0' \
            'ndk;28.2.13676358' 'cmake;3.31.6'
          chmod +x platform/android/gradlew
          cd platform/android
          gradle_ok=0
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --stacktrace \
              -PPULSEFORGE_ANDROID_BUILD_ROOT="$RUNNER_TEMP/pulseforge-android" \
              :app:assembleRelease; then
              gradle_ok=1
              break
            fi
            echo "Gradle attempt $attempt failed; retrying transient wrapper/network failures." >&2
            rm -rf "$HOME/.gradle/wrapper/dists/gradle-9.6.0-bin" || true
            sleep $((attempt * 10))
          done
          (( gradle_ok == 1 ))
          cd "$GITHUB_WORKSPACE"
          stage="$RUNNER_TEMP/android-stage"
          mkdir -p "$stage"
          apk="$stage/PulseForge-v${PACKAGE_VERSION}-Android-arm64-test-signed.apk"
          unsigned="$RUNNER_TEMP/pulseforge-android/gradle/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/pulseforge-complete-aligned.apk"
          keystore="$RUNNER_TEMP/pulseforge-ci-test.jks"
          test -f "$unsigned"
          keytool -genkeypair -noprompt -keystore "$keystore" \
            -storepass android -keypass android -alias pulseforge-ci \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname 'CN=PulseForge CI Test Build,OU=CI,O=PulseForge,C=PT'
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -P 16 -f 4 "$unsigned" "$aligned"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" --ks-key-alias pulseforge-ci \
            --ks-pass pass:android --key-pass pass:android \
            --out "$apk" "$aligned"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" \
            > "$stage/PulseForge.android-signature.txt"
          unzip -l "$apk" > "$stage/PulseForge.android-contents.txt"
          grep -q 'lib/arm64-v8a/libmain.so' "$stage/PulseForge.android-contents.txt"
          grep -q 'lib/arm64-v8a/libSDL3.so' "$stage/PulseForge.android-contents.txt"
          grep -q 'assets/pulseforge/assets/complete-runtime-manifest.json' "$stage/PulseForge.android-contents.txt"
          ! grep -Eq '(^|[ /])mods/' "$stage/PulseForge.android-contents.txt"
          printf '%s\n' "$GITHUB_SHA" > "$stage/PULSEFORGE_SOURCE_SHA.txt"

      - name: Upload compiled Windows stage through hidden transport draft
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python3 scripts/complete_release_stage_transport.py upload `
            --repo $env:GITHUB_REPOSITORY `
            --release-id $env:TRANSPORT_RELEASE_ID `
            --sha $env:GITHUB_SHA `
            --stage-key '${{ matrix.stage_key }}' `
            --stage-dir (Join-Path $env:RUNNER_TEMP 'windows-stage') `
            --archive-dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload compiled Unix stage through hidden transport draft
        if: matrix.kind != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.kind }}' in
            linux) stage="$RUNNER_TEMP/linux-stage" ;;
            android) stage="$RUNNER_TEMP/android-stage" ;;
            macos) stage="$RUNNER_TEMP/macos-stage-${{ matrix.arch }}" ;;
            *) echo 'unexpected stage kind' >&2; exit 1 ;;
          esac
          python3 scripts/complete_release_stage_transport.py upload \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "$TRANSPORT_RELEASE_ID" \
            --sha "$GITHUB_SHA" \
            --stage-key '${{ matrix.stage_key }}' \
            --stage-dir "$stage" \
            --archive-dir "$RUNNER_TEMP"

  package-complete:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare-release, runtime-manifest, build-stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.prepare-release.outputs.public_release_id }}
      TRANSPORT_RELEASE_ID: ${{ needs.prepare-release.outputs.transport_release_id }}
    steps:
      - name: Checkout exact Complete source without eager LFS hydration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false

      - name: Hydrate base engine assets only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-lfs libarchive-tools
          git lfs install --local
          git lfs pull --include="assets/**" --exclude="mods/**"
          python3 - <<'PY'
          from pathlib import Path
          root = Path('assets')
          pointer = b'version https://git-lfs.github.com/spec/v1\n'
          if not root.is_dir():
              raise SystemExit('missing assets root')
          for path in root.rglob('*'):
              if path.is_file() and path.read_bytes()[:80].startswith(pointer):
                  raise SystemExit(f'unhydrated asset LFS pointer: {path}')
          print('Base engine assets hydrated; mod corpus intentionally excluded.')
          PY

      - name: Recover five compiled runtimes and generated manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/complete_release_stage_transport.py download-all \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "$TRANSPORT_RELEASE_ID" \
            --sha "$GITHUB_SHA" \
            --stage-keys 'windows-x86_64,linux-x86_64,macos-arm64,macos-x86_64,android-arm64,runtime-manifest' \
            --archive-dir "$RUNNER_TEMP/stage-archives" \
            --output-root "$RUNNER_TEMP/compiled"
          manifest="$RUNNER_TEMP/compiled/complete-engine-stage-runtime-manifest/complete-runtime-manifest.json"
          test -s "$manifest"
          jq -e '.mod_count == 30 and (.mods | length) == 30' "$manifest" >/dev/null
          cp "$manifest" assets/complete-runtime-manifest.json

      - name: Package and upload five lightweight Complete runtimes
        shell: bash
        run: bash scripts/complete_release_package.sh package

      - name: Verify and promote the public Complete release
        shell: bash
        run: bash scripts/complete_release_package.sh finalize

      - name: Clean hidden transport assets after successful promotion
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(
            gh api "repos/$GITHUB_REPOSITORY/releases/$TRANSPORT_RELEASE_ID/assets?per_page=100" --paginate --jq '.[].id'
          )
          for id in "${ids[@]}"; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null
          done
          echo "Removed ${#ids[@]} temporary transport asset(s)."
