name: One-shot framework detection fix

on:
  push:
    branches:
      - feat/discord-macos-framework
    paths:
      - .github/workflows/one-shot-framework-detection-fix.yml

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/discord-macos-framework
          fetch-depth: 0

      - name: Require a complete default framework before selecting it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CMakeLists.txt')
          text = path.read_text(encoding='utf-8')
          old = '''            if(NOT _pulseforge_discord_framework\n                AND NOT PULSEFORGE_DISCORD_SDK_LIBRARY\n                AND IS_DIRECTORY "${_pulseforge_discord_default_framework}")\n                set(_pulseforge_discord_framework\n                    "${_pulseforge_discord_default_framework}"\n                )\n            endif()\n'''
          new = '''            if(NOT _pulseforge_discord_framework\n                AND NOT PULSEFORGE_DISCORD_SDK_LIBRARY\n                AND IS_DIRECTORY "${_pulseforge_discord_default_framework}"\n                AND EXISTS "${_pulseforge_discord_default_framework}/Versions/A/discord_partner_sdk"\n                AND EXISTS "${_pulseforge_discord_default_framework}/Versions/A/Headers/discordpp.h"\n                AND EXISTS "${_pulseforge_discord_default_framework}/Versions/A/Headers/cdiscord.h")\n                set(_pulseforge_discord_framework\n                    "${_pulseforge_discord_default_framework}"\n                )\n            endif()\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one default framework selector, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/one-shot-framework-detection-fix.yml
          git diff --check
          git diff -- CMakeLists.txt

      - name: Commit fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt .github/workflows/one-shot-framework-detection-fix.yml
          git commit -m "fix: ignore incomplete default Discord frameworks"
          git push origin HEAD:feat/discord-macos-framework
