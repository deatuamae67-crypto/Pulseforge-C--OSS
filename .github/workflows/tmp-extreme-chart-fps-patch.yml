name: Temporary extreme chart FPS patch

on:
  push:
    branches:
      - perf/extreme-chart-50m-fps-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply extreme-chart runtime optimizations
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp-extreme-chart-fps-patch.py
          git diff --check
          rm .github/tmp-extreme-chart-fps-patch.py
          git rm .github/workflows/tmp-extreme-chart-fps-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md include src tests
          git commit -m 'perf(runtime): sustain 60 FPS on 5M-50M note charts'
          git push origin HEAD:perf/extreme-chart-50m-fps-20260912
