name: Temporary extreme chart FPS patch

on:
  push:
    branches:
      - perf/extreme-chart-50m-fps-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply extreme-chart runtime optimizations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, got {count}")
              p.write_text(text.replace(old, new, 1))

          # 1) Shared, deterministic effect-LOD policy for truly gigantic charts.
          p = Path('include/pulseforge/dense_chart_routing.hpp')
          text = p.read_text()
          anchor = '\n}  // namespace pulseforge\n'
          if text.count(anchor) != 1:
              raise SystemExit('dense routing namespace anchor mismatch')
          addition = r'''

// Charts in the multi-million-note class need a second, independent visual
// quality governor. Note/PFC streaming remains exact; only presentation-only
// stage effects are reduced. This is deliberately keyed to logical chart size
// so a 33M/50M chart starts in a sane GPU/draw-call state before the first FPS
// sample exists, then tightens further only if frame pacing still collapses.
inline constexpr std::uint64_t extreme_chart_visual_lod_notes = 5'000'000ULL;
inline constexpr std::uint64_t massive_chart_visual_lod_notes = 25'000'000ULL;

struct DenseChartVisualLod final {
    std::size_t wavy_segment_cap{64U};
    std::size_t wiggle_segment_cap{24U};
    bool allow_cpu_heavy_texture_effects{true};
};

[[nodiscard]] inline DenseChartVisualLod dense_chart_visual_lod(
    const std::uint64_t logical_notes,
    const double smoothed_fps,
    const double smoothed_frame_ms
) noexcept {
    DenseChartVisualLod result;
    if (logical_notes < extreme_chart_visual_lod_notes) {
        return result;
    }

    if (logical_notes >= massive_chart_visual_lod_notes) {
        result.wavy_segment_cap = 24U;
        result.wiggle_segment_cap = 12U;
        result.allow_cpu_heavy_texture_effects = false;
    } else {
        result.wavy_segment_cap = 40U;
        result.wiggle_segment_cap = 18U;
    }

    const bool has_fps = std::isfinite(smoothed_fps) && smoothed_fps > 0.0;
    const bool has_frame = std::isfinite(smoothed_frame_ms)
        && smoothed_frame_ms > 0.0;
    if (!has_fps && !has_frame) {
        return result;
    }

    const auto slower_than = [&](const double fps, const double frame_ms) {
        return (has_fps && smoothed_fps < fps)
            || (has_frame && smoothed_frame_ms > frame_ms);
    };
    if (slower_than(30.0, 33.34)) {
        result.wavy_segment_cap = 8U;
        result.wiggle_segment_cap = 8U;
        result.allow_cpu_heavy_texture_effects = false;
    } else if (slower_than(45.0, 22.23)) {
        result.wavy_segment_cap = std::min<std::size_t>(
            result.wavy_segment_cap, 12U
        );
        result.wiggle_segment_cap = 8U;
        result.allow_cpu_heavy_texture_effects = false;
    } else if (slower_than(55.0, 18.19)) {
        result.wavy_segment_cap = std::min<std::size_t>(
            result.wavy_segment_cap, 16U
        );
        result.wiggle_segment_cap = std::min<std::size_t>(
            result.wiggle_segment_cap, 10U
        );
        result.allow_cpu_heavy_texture_effects = false;
    } else if (slower_than(59.5, 16.81)) {
        result.wavy_segment_cap = std::min<std::size_t>(
            result.wavy_segment_cap, 24U
        );
        result.wiggle_segment_cap = std::min<std::size_t>(
            result.wiggle_segment_cap, 12U
        );
        result.allow_cpu_heavy_texture_effects = false;
    }
    return result;
}
'''
          p.write_text(text.replace(anchor, addition + anchor, 1))

          # 2) Interactive extreme charts must repair a missing/corrupt PVD1.
          replace_once(
              'include/pulseforge/streaming_chart_importer.hpp',
              '''    // Offline rendering benefits from the multi-resolution visual index on\n    // every frame. When true, a missing/corrupt PVD1 is rebuilt during render\n    // preparation and its size is committed to the manifest. Interactive play\n    // leaves this false and falls back immediately to exact PFC1 visits.\n    bool require_visual_density{false};\n''',
              '''    // Offline rendering benefits from the multi-resolution visual index on\n    // every frame. When true, a missing/corrupt PVD1 is rebuilt during render\n    // preparation and its size is committed to the manifest.\n    bool require_visual_density{false};\n\n    // Interactive charts at or above this logical-note count also repair PVD1\n    // automatically. Zero disables the automatic policy. This is a performance\n    // routing threshold, never a chart-validity or note-count limit.\n    std::uint64_t auto_require_visual_density_logical_notes{5'000'000ULL};\n''',
              'streaming cache options PVD policy'
          )
          replace_once(
              'src/io/streaming_chart_importer.cpp',
              '        if (!visual_valid && options.require_visual_density) {\n',
              '''        const bool visual_density_required =\n            options.require_visual_density\n            || (options.auto_require_visual_density_logical_notes != 0U\n                && reader->logical_note_count()\n                    >= options.auto_require_visual_density_logical_notes);\n        if (!visual_valid && visual_density_required) {\n''',
              'cache-hit automatic PVD rebuild'
          )

          # 3) RuntimeScene receives a tiny draw/effect LOD contract.
          replace_once(
              'src/app/runtime_scene.hpp',
              '''    void begin_note_skin_profile_frame(bool enabled) noexcept;\n    [[nodiscard]] RuntimeNoteSkinProfileStats note_skin_profile_stats()\n        const noexcept;\n''',
              '''    void begin_note_skin_profile_frame(bool enabled) noexcept;\n    [[nodiscard]] RuntimeNoteSkinProfileStats note_skin_profile_stats()\n        const noexcept;\n\n    // Presentation-only LOD for extreme charts. It never changes chart time,\n    // note positions, input, scoring, replay state or Lua-visible properties.\n    void set_effect_lod(\n        std::size_t wavy_segment_cap,\n        std::size_t wiggle_segment_cap,\n        bool allow_cpu_heavy_texture_effects\n    ) noexcept;\n''',
              'RuntimeScene public effect LOD API'
          )
          replace_once(
              'src/app/runtime_scene.cpp',
              '''    std::uint64_t cpu_color_variant_bytes{};\n    std::uint64_t cpu_color_pixels_this_frame{};\n    std::vector<RuntimeSceneDiagnostic> diagnostics;\n''',
              '''    std::uint64_t cpu_color_variant_bytes{};\n    std::uint64_t cpu_color_pixels_this_frame{};\n    std::size_t wavy_segment_cap{psych_wavy_max_segments};\n    std::size_t wiggle_segment_cap{psych_wiggle_max_segments};\n    bool allow_cpu_heavy_texture_effects{true};\n    std::vector<RuntimeSceneDiagnostic> diagnostics;\n''',
              'RuntimeScene effect LOD state'
          )
          replace_once(
              'src/app/runtime_scene.cpp',
              '''        const auto segment_count = psych_wavy_segment_count(\n            sprite.wavy_effect,\n            destination.h\n        );\n        if (segment_count == 0U\n            || segment_count > psych_wavy_max_segments) {\n''',
              '''        const auto requested_segment_count = psych_wavy_segment_count(\n            sprite.wavy_effect,\n            destination.h\n        );\n        const auto segment_count = std::min(\n            requested_segment_count,\n            wavy_segment_cap\n        );\n        if (segment_count == 0U\n            || segment_count > psych_wavy_max_segments) {\n''',
              'wavy effect segment LOD'
          )
          replace_once(
              'src/app/runtime_scene.cpp',
              '''        const auto segment_count = psych_wiggle_segment_count(\n            shader_state,\n            destination.w,\n            destination.h\n        );\n        if (segment_count == 0U\n''',
              '''        const auto requested_segment_count = psych_wiggle_segment_count(\n            shader_state,\n            destination.w,\n            destination.h\n        );\n        const auto segment_count = std::min(\n            requested_segment_count,\n            wiggle_segment_cap\n        );\n        if (segment_count == 0U\n''',
              'wiggle effect segment LOD'
          )
          replace_once(
              'src/app/runtime_scene.cpp',
              '''            const std::uint64_t texture_pixel_limit =\n                shader_kind == PsychShaderCompatKind::gaussian_blur\n''',
              '''            if (!allow_cpu_heavy_texture_effects\n                && (shader_kind == PsychShaderCompatKind::mosaic\n                    || shader_kind == PsychShaderCompatKind::gaussian_blur)) {\n                return nullptr;\n            }\n            const std::uint64_t texture_pixel_limit =\n                shader_kind == PsychShaderCompatKind::gaussian_blur\n''',
              'CPU-heavy texture effect LOD'
          )
          replace_once(
              'src/app/runtime_scene.cpp',
              '''void RuntimeScene::begin_note_skin_profile_frame(const bool enabled) noexcept {\n''',
              '''void RuntimeScene::set_effect_lod(\n    const std::size_t wavy_cap,\n    const std::size_t wiggle_cap,\n    const bool allow_cpu_heavy_texture_effects\n) noexcept {\n    if (implementation_ == nullptr) {\n        return;\n    }\n    implementation_->wavy_segment_cap = std::clamp<std::size_t>(\n        wavy_cap, psych_wavy_min_segments, psych_wavy_max_segments\n    );\n    implementation_->wiggle_segment_cap = std::clamp<std::size_t>(\n        wiggle_cap, psych_wiggle_min_segments, psych_wiggle_max_segments\n    );\n    implementation_->allow_cpu_heavy_texture_effects =\n        allow_cpu_heavy_texture_effects;\n}\n\nvoid RuntimeScene::begin_note_skin_profile_frame(const bool enabled) noexcept {\n''',
              'RuntimeScene effect LOD implementation'
          )

          # 4) Apply baseline LOD before frame 1 and adapt it from real frame pacing.
          replace_once(
              'src/app/application.cpp',
              '''        scene_ = std::make_unique<detail::RuntimeScene>(\n            renderer_,\n            *chart_,\n            scene_roots,\n            scene_limits\n        );\n''',
              '''        scene_ = std::make_unique<detail::RuntimeScene>(\n            renderer_,\n            *chart_,\n            scene_roots,\n            scene_limits\n        );\n        if (scene_ != nullptr) {\n            const auto logical_notes = streaming_reader_.has_value()\n                ? streaming_reader_->logical_note_count()\n                : static_cast<std::uint64_t>(chart_->notes.size());\n            const auto effect_lod = dense_chart_visual_lod(\n                logical_notes, 0.0, 0.0\n            );\n            scene_->set_effect_lod(\n                effect_lod.wavy_segment_cap,\n                effect_lod.wiggle_segment_cap,\n                effect_lod.allow_cpu_heavy_texture_effects\n            );\n        }\n''',
              'initial extreme-chart effect LOD'
          )
          replace_once(
              'src/app/application.cpp',
              '''        adaptive_scroll_.update(\n            static_cast<double>(elapsed),\n            smoothed_fps_,\n            smoothed_frame_ms_,\n            rendered_notes_,\n            options_.settings.performance.max_visible_notes,\n            !options_.offline_render.enabled && !options_.smoke_test\n        );\n''',
              '''        adaptive_scroll_.update(\n            static_cast<double>(elapsed),\n            smoothed_fps_,\n            smoothed_frame_ms_,\n            rendered_notes_,\n            options_.settings.performance.max_visible_notes,\n            !options_.offline_render.enabled && !options_.smoke_test\n        );\n        if (scene_ != nullptr) {\n            const auto logical_notes = streaming_reader_.has_value()\n                ? streaming_reader_->logical_note_count()\n                : (chart_.has_value()\n                    ? static_cast<std::uint64_t>(chart_->notes.size())\n                    : 0ULL);\n            const auto effect_lod = dense_chart_visual_lod(\n                logical_notes, smoothed_fps_, smoothed_frame_ms_\n            );\n            scene_->set_effect_lod(\n                effect_lod.wavy_segment_cap,\n                effect_lod.wiggle_segment_cap,\n                effect_lod.allow_cpu_heavy_texture_effects\n            );\n        }\n''',
              'adaptive extreme-chart effect LOD'
          )

          # 5) Once Lua has proven a note callback absent, stop budgeting it;
          # and when the first missing call is discovered, skip the remainder in O(1).
          replace_once(
              'src/script/lua_runtime.cpp',
              '''    [[nodiscard]] static Impl* from_state(lua_State* lua) noexcept {\n        void* userdata = nullptr;\n        (void)lua_getallocf(lua, &userdata);\n        return static_cast<Impl*>(userdata);\n    }\n''',
              '''    [[nodiscard]] static Impl* from_state(lua_State* lua) noexcept {\n        void* userdata = nullptr;\n        (void)lua_getallocf(lua, &userdata);\n        return static_cast<Impl*>(userdata);\n    }\n\n    [[nodiscard]] bool callback_available(const Callback callback) const noexcept {\n        if (!script_loaded || state == nullptr) {\n            return false;\n        }\n        const auto index = static_cast<std::size_t>(callback);\n        return !disabled[index] && !absent[index];\n    }\n''',
              'Lua callback availability helper'
          )

          # There are two dispatchers with the same grouped note planning block.
          p = Path('src/script/lua_runtime.cpp')
          text = p.read_text()
          old_group = '''        case GameplayEventType::note_hit:\n        case GameplayEventType::note_miss:\n        case GameplayEventType::hold_tick:\n        case GameplayEventType::hold_drop:\n        case GameplayEventType::opponent_hit:\n            plan(event.logical_occurrence_count);\n            break;\n'''
          new_group = '''        case GameplayEventType::note_hit:\n        case GameplayEventType::hold_tick:\n            if (impl_->callback_available(Impl::Callback::good_note_hit)) {\n                plan(event.logical_occurrence_count);\n            }\n            break;\n        case GameplayEventType::note_miss:\n        case GameplayEventType::hold_drop:\n            if (impl_->callback_available(Impl::Callback::note_miss)) {\n                plan(event.logical_occurrence_count);\n            }\n            break;\n        case GameplayEventType::opponent_hit:\n            if (impl_->callback_available(Impl::Callback::opponent_note_hit)) {\n                plan(event.logical_occurrence_count);\n            }\n            break;\n'''
          count = text.count(old_group)
          if count != 2:
              raise SystemExit(f'Lua note planning groups: expected 2, got {count}')
          text = text.replace(old_group, new_group)

          old_repeat = '''        const auto runs = static_cast<std::size_t>(\n            std::min<std::uint64_t>(count, available)\n        );\n        for (std::size_t index = 0U; index < runs; ++index) {\n            accumulate(report, callback(index));\n        }\n        event_callbacks_used += runs;\n        if (count > runs) {\n            add_skipped(count - static_cast<std::uint64_t>(runs));\n            fanout_truncated = true;\n        }\n'''
          new_repeat = '''        const auto runs = static_cast<std::size_t>(\n            std::min<std::uint64_t>(count, available)\n        );\n        std::size_t executed = 0U;\n        bool callback_unavailable = false;\n        for (std::size_t index = 0U; index < runs; ++index) {\n            const auto current = callback(index);\n            accumulate(report, current);\n            ++executed;\n            if (current.status == LuaCallStatus::missing\n                || current.status == LuaCallStatus::disabled) {\n                callback_unavailable = true;\n                break;\n            }\n        }\n        event_callbacks_used += executed;\n        if (count > executed) {\n            add_skipped(count - static_cast<std::uint64_t>(executed));\n            if (!callback_unavailable && count > runs) {\n                fanout_truncated = true;\n            }\n        }\n'''
          count = text.count(old_repeat)
          if count != 2:
              raise SystemExit(f'Lua repeat loops: expected 2, got {count}')
          p.write_text(text.replace(old_repeat, new_repeat))

          # 6) Deterministic regression coverage for the 5M/33M/50M policy.
          p = Path('tests/streaming_gameplay_test.cpp')
          text = p.read_text()
          anchor = '\n}  // namespace\n\nint main() {'
          if text.count(anchor) != 1:
              raise SystemExit('streaming gameplay test namespace anchor mismatch')
          test = r'''

void test_extreme_chart_visual_lod() {
    const auto easy = pulseforge::dense_chart_visual_lod(
        1'059'988ULL, 70.0, 14.2
    );
    require(
        easy.wavy_segment_cap == 64U
            && easy.wiggle_segment_cap == 24U
            && easy.allow_cpu_heavy_texture_effects,
        "one-million-note Easy gameplay keeps full stage quality"
    );

    const auto end_of_world = pulseforge::dense_chart_visual_lod(
        5'000'000ULL, 70.0, 14.2
    );
    require(
        end_of_world.wavy_segment_cap == 40U
            && end_of_world.wiggle_segment_cap == 18U
            && end_of_world.allow_cpu_heavy_texture_effects,
        "five-million-note charts start with a mild presentation LOD"
    );

    const auto overkill = pulseforge::dense_chart_visual_lod(
        33'000'000ULL, 70.0, 14.2
    );
    require(
        overkill.wavy_segment_cap == 24U
            && overkill.wiggle_segment_cap == 12U
            && !overkill.allow_cpu_heavy_texture_effects,
        "33-million-note Overkill starts with bounded expensive effects"
    );

    const auto nullifier_collapse = pulseforge::dense_chart_visual_lod(
        50'000'000ULL, 7.0, 142.0
    );
    require(
        nullifier_collapse.wavy_segment_cap == 8U
            && nullifier_collapse.wiggle_segment_cap == 8U
            && !nullifier_collapse.allow_cpu_heavy_texture_effects,
        "50-million-note collapse drops presentation work to minimum LOD"
    );

    const auto nullifier_recovered = pulseforge::dense_chart_visual_lod(
        50'000'000ULL, 60.0, 16.6
    );
    require(
        nullifier_recovered.wavy_segment_cap == 24U
            && nullifier_recovered.wiggle_segment_cap == 12U,
        "extreme chart effect quality recovers after stable 60 Hz pacing"
    );
}
'''
          text = text.replace(anchor, test + anchor, 1)
          text = text.replace(
              '        test_dense_chart_streaming_routing();\n',
              '        test_dense_chart_streaming_routing();\n        test_extreme_chart_visual_lod();\n',
              1
          )
          p.write_text(text)

          # Reuse the existing missing-PVD cache regression with a tiny test-only
          # auto threshold. That proves the interactive extreme-chart path rather
          # than only the explicit offline-render switch.
          replace_once(
              'tests/streaming_chart_importer_test.cpp',
              '    options.require_visual_density = true;\n    const auto lazy_visual = pulseforge::prepare_streaming_chart_cache(\n',
              '''    options.auto_require_visual_density_logical_notes = 1U;\n    const auto lazy_visual = pulseforge::prepare_streaming_chart_cache(\n''',
              'automatic PVD repair regression'
          )

          # Changelog: describe all three bottlenecks rather than claiming that
          # source-size routing alone fixes 33M/50M charts.
          p = Path('CHANGELOG.md')
          text = p.read_text()
          marker = '### Fixed\n\n'
          if marker not in text:
              raise SystemExit('CHANGELOG Fixed marker missing')
          bullet = ('- Extreme-chart runtime now repairs missing PVD1 indexes automatically at '
                    '5M+ logical notes, removes no-op Lua logical-note callback fan-out after '
                    'callbacks are known absent, and dynamically reduces presentation-only '
                    'wavy/wiggle/CPU-heavy stage effects when 5M-50M+ charts threaten the 60 FPS '
                    'frame budget; note timing, judgment, scoring and chart validity are unchanged.\n')
          p.write_text(text.replace(marker, marker + bullet, 1))
          PY

          git diff --check
          git rm .github/workflows/tmp-extreme-chart-fps-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md \
            include/pulseforge/dense_chart_routing.hpp \
            include/pulseforge/streaming_chart_importer.hpp \
            src/io/streaming_chart_importer.cpp \
            src/app/runtime_scene.hpp \
            src/app/runtime_scene.cpp \
            src/app/application.cpp \
            src/script/lua_runtime.cpp \
            tests/streaming_gameplay_test.cpp \
            tests/streaming_chart_importer_test.cpp
          git commit -m 'perf(runtime): sustain 60 FPS on 5M-50M note charts'
          git push origin HEAD:perf/extreme-chart-50m-fps-20260912
