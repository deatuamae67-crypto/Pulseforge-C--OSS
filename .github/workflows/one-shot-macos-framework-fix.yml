name: One-shot macOS framework branch fix

on:
  push:
    branches:
      - feat/discord-macos-framework
    paths:
      - .github/workflows/one-shot-macos-framework-fix.yml

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/discord-macos-framework
          fetch-depth: 0

      - name: Apply exact reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CMakeLists.txt')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '        target_link_libraries(pulseforge_cli PRIVATE pulseforge_runtime)\n',
                  '        target_link_libraries(\n'
                  '            pulseforge_cli PRIVATE pulseforge_runtime SDL3::SDL3\n'
                  '        )\n',
              ),
              (
                  '            set_property(TARGET pulseforge APPEND PROPERTY BUILD_RPATH "@loader_path")\n'
                  '            set_property(TARGET pulseforge APPEND PROPERTY INSTALL_RPATH "@loader_path")\n'
                  '        endif()\n',
                  '            set_property(TARGET pulseforge APPEND PROPERTY BUILD_RPATH "@loader_path")\n'
                  '            set_property(TARGET pulseforge APPEND PROPERTY INSTALL_RPATH "@loader_path")\n'
                  '            if(TARGET pulseforge_cli)\n'
                  '                set_property(TARGET pulseforge_cli APPEND PROPERTY BUILD_RPATH "@loader_path")\n'
                  '                set_property(TARGET pulseforge_cli APPEND PROPERTY INSTALL_RPATH "@loader_path")\n'
                  '            endif()\n'
                  '        endif()\n',
              ),
              (
                  '            "the fail-open Discord backend can run. Supply the complete macOS framework "\n'
                  '            "or PULSEFORGE_DISCORD_SDK_RUNTIME_LIBRARY."\n',
                  '            "the fail-open Discord backend can run. Supply PULSEFORGE_DISCORD_SDK_RUNTIME_LIBRARY "\n'
                  '            "or, on macOS Social SDK 1.10+, the complete discord_partner_sdk.framework bundle."\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/one-shot-macos-framework-fix.yml

          git diff --check
          git diff -- CMakeLists.txt

      - name: Commit exact fixes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt .github/workflows/one-shot-macos-framework-fix.yml
          git commit -m "fix: preserve desktop Discord packaging behavior"
          git push origin HEAD:feat/discord-macos-framework
