name: PulseForge release integrity validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/release-integrity-validation.yml'
      - 'docs/RELEASE_0.9.7_ASSET_MANIFEST.json'
      - 'docs/RELEASE_0.9.7_PROVENANCE.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-integrity-validation.yml'
      - 'docs/RELEASE_0.9.7_ASSET_MANIFEST.json'
      - 'docs/RELEASE_0.9.7_PROVENANCE.md'
  release:
    types:
      - published
      - released
      - prereleased
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  MANIFEST: docs/RELEASE_0.9.7_ASSET_MANIFEST.json
  FINAL_SOURCE_SHA: 8e603b240c8c11945da70b03a42e93b7babf763f
  FINAL_RUN_ID: '33989617582'
  RELEASE_ID: '382859979'
  RELEASE_TAG: v0.9.7

jobs:
  validate-release-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.sha }}

      - name: Validate durable release manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f "$MANIFEST"

          jq -e --arg source "$FINAL_SOURCE_SHA" --argjson run "$FINAL_RUN_ID" --argjson release "$RELEASE_ID" --arg tag "$RELEASE_TAG" '
            .schema_version == 1
            and .pulseforge_version == "0.9.7"
            and .tag == $tag
            and .release_id == $release
            and .release_target_sha == $source
            and .source_run_id == $run
            and .source_workflow_path == ".github/workflows/release-artifacts.yml"
            and .source_head_sha == $source
            and (.assets | length) == 10
            and ([.assets[].name] | unique | length) == 10
            and all(.assets[];
              (.name | type) == "string"
              and (.name | length) > 0
              and (.size_bytes | type) == "number"
              and .size_bytes > 0
              and (.digest | test("^sha256:[0-9a-f]{64}$"))
            )
          ' "$MANIFEST" >/dev/null

      - name: Validate final source run provenance
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FINAL_RUN_ID")"

          [[ "$(jq -r '.status' <<<"$run_json")" == 'completed' ]] || {
            echo 'Final release-artifact run is not completed.' >&2
            exit 1
          }
          [[ "$(jq -r '.conclusion' <<<"$run_json")" == 'success' ]] || {
            echo 'Final release-artifact run did not succeed.' >&2
            exit 1
          }
          [[ "$(jq -r '.path' <<<"$run_json")" == '.github/workflows/release-artifacts.yml' ]] || {
            echo 'Unexpected final source workflow path.' >&2
            exit 1
          }
          [[ "$(jq -r '.head_branch' <<<"$run_json")" == 'main' ]] || {
            echo 'Final artifact run was not produced from main.' >&2
            exit 1
          }
          [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$FINAL_SOURCE_SHA" ]] || {
            echo 'Final artifact run source SHA mismatch.' >&2
            exit 1
          }
          [[ "$(jq -r '.event' <<<"$run_json")" == 'push' ]] || {
            echo 'Final artifact run was not a main push run.' >&2
            exit 1
          }

      - name: Fetch published GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > /tmp/pulseforge-release.json

      - name: Validate published Release against durable manifest
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(cat /tmp/pulseforge-release.json)"

          [[ "$(jq -r '.id' <<<"$release_json")" == "$RELEASE_ID" ]]
          [[ "$(jq -r '.tag_name' <<<"$release_json")" == "$RELEASE_TAG" ]] || {
            echo 'Release tag mismatch.' >&2
            exit 1
          }
          [[ "$(jq -r '.target_commitish' <<<"$release_json")" == "$FINAL_SOURCE_SHA" ]] || {
            echo 'Release target mismatch.' >&2
            exit 1
          }
          [[ "$(jq -r '.draft' <<<"$release_json")" == 'false' ]] || {
            echo 'v0.9.7 unexpectedly returned to draft state.' >&2
            exit 1
          }
          [[ "$(jq -r '.prerelease' <<<"$release_json")" == 'false' ]] || {
            echo 'v0.9.7 unexpectedly became a prerelease.' >&2
            exit 1
          }
          [[ -n "$(jq -r '.published_at // empty' <<<"$release_json")" ]] || {
            echo 'v0.9.7 has no publication timestamp.' >&2
            exit 1
          }

          manifest_count="$(jq '.assets | length' "$MANIFEST")"
          release_count="$(jq '.assets | length' <<<"$release_json")"
          unique_release_name_count="$(jq -r '.assets[].name' <<<"$release_json" | sort -u | wc -l | tr -d ' ')"
          [[ "$release_count" == "$manifest_count" && "$unique_release_name_count" == "$manifest_count" ]] || {
            echo "Release asset set is not exactly $manifest_count unique assets." >&2
            exit 1
          }

          jq -r '.assets[].name' "$MANIFEST" | sort > /tmp/pulseforge-manifest-assets.txt
          jq -r '.assets[].name' <<<"$release_json" | sort > /tmp/pulseforge-release-assets.txt
          diff -u /tmp/pulseforge-manifest-assets.txt /tmp/pulseforge-release-assets.txt || {
            echo 'Published Release asset names do not exactly match the durable manifest.' >&2
            exit 1
          }

          while IFS=$'\t' read -r name expected_size expected_digest; do
            asset_json="$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' <<<"$release_json")"
            [[ -n "$asset_json" ]] || {
              echo "Missing published Release asset: $name" >&2
              exit 1
            }
            [[ "$(jq -r '.state' <<<"$asset_json")" == 'uploaded' ]] || {
              echo "Published Release asset $name is not fully uploaded." >&2
              exit 1
            }
            [[ "$(jq -r '.size' <<<"$asset_json")" == "$expected_size" ]] || {
              echo "Published Release asset $name size mismatch." >&2
              exit 1
            }
            [[ "$(jq -r '.digest // empty' <<<"$asset_json")" == "$expected_digest" ]] || {
              echo "Published Release asset $name digest mismatch." >&2
              exit 1
            }
          done < <(jq -r '.assets[] | [.name, (.size_bytes | tostring), .digest] | @tsv' "$MANIFEST")

      - name: Validate exact published tag target
        shell: bash
        run: |
          set -euo pipefail
          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          object_sha="$(jq -r '.object.sha' <<<"$ref_json")"

          if [[ "$object_type" == 'tag' ]]; then
            tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -r '.object.type' <<<"$tag_json")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
          fi

          [[ "$object_type" == 'commit' && "$object_sha" == "$FINAL_SOURCE_SHA" ]] || {
            echo "$RELEASE_TAG resolves to $object_type $object_sha; expected commit $FINAL_SOURCE_SHA." >&2
            exit 1
          }

          echo "PulseForge $RELEASE_TAG published integrity verified at $FINAL_SOURCE_SHA."
