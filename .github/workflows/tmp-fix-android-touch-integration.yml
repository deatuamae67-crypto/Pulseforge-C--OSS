name: Temporary Android touch integration fix

on:
  push:
    branches:
      - feature/android-touch-port
    paths:
      - .github/workflows/tmp-fix-android-touch-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/android-touch-port
          fetch-depth: 1

      - name: Apply exact integration fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/app/application.cpp")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (r"(?<![A-Za-z0-9_:])mobile_touch_controls\(\)", "detail::mobile_touch_controls()", 6),
              (r"(?<![A-Za-z0-9_:])MobileTouchContext::", "detail::MobileTouchContext::", 6),
              (r"chart_\s*==\s*nullptr", "!chart_.has_value()", 1),
          ]

          for pattern, replacement, expected in replacements:
              text, count = re.subn(pattern, replacement, text)
              if count != expected:
                  raise SystemExit(
                      f"Refusing patch: expected {expected} matches for {pattern!r}, found {count}"
                  )

          path.write_text(text, encoding="utf-8", newline="\n")

          verified = path.read_text(encoding="utf-8")
          for pattern, replacement, expected in replacements:
              remaining = len(re.findall(pattern, verified))
              if remaining != 0:
                  raise SystemExit(
                      f"Verification failed: {remaining} unqualified matches remain for {pattern!r}"
                  )
              if verified.count(replacement) < expected:
                  raise SystemExit(
                      f"Verification failed: replacement {replacement!r} occurs fewer than {expected} times"
                  )

      - name: Stage and constrain source fix
        shell: bash
        run: |
          set -euo pipefail
          git add -- src/app/application.cpp
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          test "$changed" = "src/app/application.cpp"
          git diff --cached -- src/app/application.cpp

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: qualify mobile touch runtime integration"
          git push origin HEAD:feature/android-touch-port
