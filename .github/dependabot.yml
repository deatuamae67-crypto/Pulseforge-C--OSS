version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /platform/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      android-build-dependencies:
        patterns:
          - "*"
