version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /platform/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      android-toolchain:
        patterns:
          - "com.android.tools.build:gradle"
          - "gradle-wrapper"
        update-types:
          - "minor"
          - "patch"
      android-libraries:
        patterns:
          - "*"
        exclude-patterns:
          - "com.android.tools.build:gradle"
          - "gradle-wrapper"
    ignore:
      - dependency-name: "com.android.tools.build:gradle"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "gradle-wrapper"
        update-types:
          - "version-update:semver-major"
